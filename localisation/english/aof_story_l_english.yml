l_english:
 aof_kaz.1.t: "The broken peace"
 aof_kaz.1.d: "The Great War of 1914–1924 has ended. Kazakhstan enters this uncertain world as an independent country. Its considerable resource potential remains underdeveloped. Administration, transport and practical education will lay the foundation for the years ahead."
 aof_kaz.1.a: "Begin the work."
 aof_kaz.2.t: "Before the first investment"
 aof_kaz.2.d: "Resource potential alone cannot supply workshops. Surveys, technical training and transport must precede large extraction projects. The first findings will support our industrial research."
 aof_kaz.2.a: "Support industrial research."
 aof_kaz.3.t: "The first development programme"
 aof_kaz.3.d: "The groundwork is ready. Limited resources require a clear priority: civilian workshops for long-term growth, or arms production to equip the army. Both choices support independent development."
 aof_kaz.3.a: "Expand civilian production."
 aof_kaz.3.b: "Equip our own army."
 aof_kaz.4.t: "A foundation for the future"
 aof_kaz.4.d: "The first programme has brought administration, training and production into a common effort. Independence now has a stronger material foundation. The world beyond our borders remains uncertain; further development is our next task."
 aof_kaz.4.a: "Continue building."
 aof_technical_network: "Research network"
 aof_technical_network_desc: "Cooperation between technical schools and workshops supports practical research."
 aof_production_standards_spirit: "Production standards"
 aof_production_standards_spirit_desc: "Common standards improve equipment production."
 aof_resource_survey: "Resource survey"
 aof_capital_civilian_factory: "Adds one building slot and one civilian factory in the capital state."
 aof_capital_military_factory: "Adds one building slot and one military factory in the capital state."
 aof_capital_infrastructure: "Adds one infrastructure level in the capital state."
