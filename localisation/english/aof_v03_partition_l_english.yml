l_english:
 aof_partition.1.t: "A negotiated peaceful partition"
 aof_partition.1.d: "This is a specific treaty for the provisional playtest map, not a declaration of historical boundaries. Uzbekistan receives Karmana, Karakalpakstan, Bukhara and Khiva; its transitional cabinet will sit in Samarkand. Turkmenistan receives Ashgabat and Dashoguz; Tajikistan receives Dushanbe; Kyrgyzstan receives Pamir. Tashkent (state 405) remains with the Turkestani continuity cabinet so the current player can continue. The new states become independent. Their national rights are preserved, including the Uzbek core on Tashkent; possession of that city remains a separate provisional compromise. Every condition is checked again immediately before execution."
 aof_partition.1.a: "Execute the treaty and retain the Tashkent cabinet"
 aof_partition.1.b: "Preserve the common state"
 aof_partition.2.t: "Four independent governments"
 aof_partition.2.d: "The agreed territories have passed to four independent governments. Turkestan retains Tashkent, its existing political course and its institutions. This is a continuity cabinet, not the disappearance of the country or automatic endorsement of one historical map. No participant is compelled to join an alliance. The treaty creates no new claims and does not erase existing national rights."
 aof_partition.2.a: "Continue the work of the continuity cabinet"
 aof_partition.3.t: "The treaty cannot be executed under present conditions"
 aof_partition.3.d: "Nothing has changed. The treaty requires an independent Turkestan at peace; Uzbekistan, Turkmenistan, Tajikistan and Kyrgyzstan must not already exist; all nine agreed states (405, 584, 585, 732, 742, 823, 830, 831, 832) must be owned and controlled by Turkestan. The participants’ cores on the agreed states must remain intact. Additional conquered states with one successor’s cores cannot be transferred outside the treaty. A completed partition cannot be repeated. Restore the required conditions or preserve the union; negotiations may be reopened."
 aof_partition.3.a: "Keep the current boundaries"
 aof_partition_treaty_tt: "If every condition holds: create four independent countries on the agreed states and retain state 405 for Turkestan. The current player continues to govern Turkestan."
 aof_partition_reopen: "Return to the peaceful partition treaty"
 aof_partition_reopen_desc: "Reopen the specific treaty for four independent governments and a Tashkent continuity cabinet. Ownership, control of all nine states and peace are rechecked before execution."
