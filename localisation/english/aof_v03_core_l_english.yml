 aof_v03_regions.37.t: "A federal compact"
 aof_v03_regions.37.d: "After transit and defence cooperation, retain a compact of sovereign members or propose territorial federation to Guatemala, Honduras, El Salvador, Nicaragua and Costa Rica. Each decides independently. An accepting member transfers its territory to the common government; refusal does not cause war."
 aof_v03_regions.37.a: "Propose a voluntary territorial federation"
 aof_v03_regions.37.b: "Retain a compact of sovereign members"
 aof_v03_regions.40.t: "Join the Central American Federation?"
 aof_v03_regions.40.d: "Our existing partner proposes territorial union. Acceptance ends our separate government: all our owned lands, including outlying possessions, and troops join the common state. New cores apply only to our former core states. A player wishing to continue a separate campaign should decline. Only a peaceful independent country with previously accepted bilateral cooperation can consent."
 aof_v03_regions.40.a: "Accept: transfer our territory to the common state"
 aof_v03_regions.40.b: "Retain independence and existing cooperation"
