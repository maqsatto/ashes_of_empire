 aof_v03_regions.38.t: "The disputed Chaco"
 aof_v03_regions.38.d: "The commission collects Chaco claims. Borders require agreement; war is not an automatic outcome."
 aof_v03_regions.38.a: "Commission first"
 aof_v03_regions.38.b: "Prepare a military contingency"
 aof_v03_regions.39.t: "The terms of the oil order"
 aof_v03_regions.39.d: "Immediate exports or preparation for domestic refining?"
 aof_v03_regions.39.a: "Expand export concessions"
 aof_v03_regions.39.b: "Train local technicians"
 aof_v03_regions.41.t: "A durable constitution"
 aof_v03_regions.41.d: "After preparing safeguards, parliament settles the social compact. A liberal cabinet and conservative continuity both retain elections."
 aof_v03_regions.41.a: "A liberal government"
 aof_v03_regions.41.b: "A conservative parliamentary cabinet"
 aof_v03_regions.42.t: "Return of the civilian mandate"
 aof_v03_regions.42.d: "Emergency powers end. Civilian government will answer to the electorate."
 aof_v03_regions.42.a: "A conservative civilian cabinet"
 aof_v03_regions.42.b: "A liberal constitution"
