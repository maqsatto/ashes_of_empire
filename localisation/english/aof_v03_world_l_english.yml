 AOF_BROKEN_PEACE_NAME: "A Fragile Peace: 1924"
 AOF_BROKEN_PEACE_DESC: "Ten years of the Great War exhausted the old powers and gave new states a chance at independence. Europe seeks recovery, the United States decides how to use its wartime wealth, and Japan must settle the future of its sphere. Young republics must turn independence into working institutions, industry and the ability to defend their choices. Peace has been signed; its order remains to be built."
 aof_world_KAZ_bookmark: "Independence must be built. Connect Alash’s centres by road, train teachers and engineers, and turn known deposits into domestic machine building. A constitutional compact, land reform or emergency mandate will shape government; industrial partners and external routes will determine the price of autonomy."
 aof_world_SIB_bookmark: "A vast country needs a common timetable. Restore the trunk line, reach terms with the regions and secure access to foreign markets. Build a civilian Siberia, offer the Russian republics a voluntary compact, or entrust the communications network to a military directorate."
 aof_world_CAU_bookmark: "A strategic route makes the federation valuable to its neighbours and vulnerable to their demands. Share powers and revenues among its members or strengthen the centre. Domestic security and clear transit rules must let the Caucasus trade without becoming another power’s base."
 aof_world_TRK_bookmark: "The union needs a new compact among its members. Define local governments’ powers, coordinate defence and decide what holds the country together. Strengthen the union or negotiate a peaceful separation while retaining a continuity cabinet in Tashkent."
 aof_world_NAF_bookmark: "Victory over colonial oppression must become everyday freedom. Restore roads, schools and civil administration while preserving equality among members. Armed neutrality and mediation can give the commonwealth its own voice, but requests for military aid will test that policy’s limits."
 aof_world_CMT_bookmark: "The country was created for wartime supply, but the war has ended. Who now represents its residents, and whom do its warehouses, roads and workshops serve? Build a civilian republic, preserve the commercial charter or seek an external guarantee: every route must reckon with old obligations."
 aof_world_FER_bookmark: "Vladivostok can become a trading gateway between rivals rather than merely a military foothold. Train local personnel, expand links with Siberia and revisit the Japanese guarantee. Negotiated autonomy requires agreement; refusal leaves the local government to choose its next course."
 aof_world_USA_bookmark: "Who will receive the profits of a decade of war? Turn scientific and industrial strength into civilian prosperity, long foreign contracts or influence in the Western Hemisphere. Disputes over labour, large corporations and presidential power will determine America’s postwar republic."
 aof_world_JAP_bookmark: "Two dependencies, two treaties and mounting demands from the field commands. Choose a stable treaty sphere, a continental military mandate or maritime priorities. Relations with Manchuria, Vladivostok and Chinese governments will test whether the empire can maintain influence without endlessly expanding its commitments."
 aof_world_SOV_bookmark: "The revolution must learn to live. The civil war has ended, but production and institutions still bear its legacy. Prioritise a viable republic, offer neighbours a voluntary union or renew revolutionary pressure abroad, while deciding the place of local councils in the new order."
 aof_world_MEX_bookmark: "Oil belongs to the land, but who writes the contract? Reconcile land reform, labour rights and foreign orders. Predictable contract revision, domestic refining or officer-led consolidation offer different answers. The dispute with the United States permits compromise without guaranteeing it."
 aof_world_BRA_bookmark: "Exports brought income without uniting the republic. Connect internal markets and decide whether federal government serves civilian reform, officer-led modernisation or a compact of regions. At a South American conference, offer equal defence cooperation or try to impose your own rules."
 aof_world_ARG_bookmark: "Feeding the world is not enough to influence it. As the old buyer weakens, export earnings can fund processing and machines, a league of equal republics or a South Atlantic fleet. Cooperation with Brazil remains possible, but no country possesses a natural right to continental leadership."
 aof_world_CHI_bookmark: "Unity must not come at a foreign price. Coordinate the front and supplies, examine external obligations and settle relations with regional governments. A negotiated republic, a unified army or land reform offer different roads to a common state."
 aof_world_MAN_bookmark: "Industry and railways bring opportunity, while Japanese protection limits autonomy. Train local specialists and build an industrial administration before negotiating garrison powers. Government rights must become an actual agreement rather than a patron’s promise."
 aof_world_RAJ_bookmark: "War with Pakistan demands front-line supply without permanently determining India’s government. Preserve civilian administration, examine armistice terms and decide which obligations the country should accept after the fighting. Peace requires agreement on both sides."
 aof_world_PAK_bookmark: "Survival must not mean permanent tutelage. Connect the army to its hinterland, coordinate Iranian and Afghan aid and agree common supply rules. Seek an independent peace with India or prepare regional defence cooperation."
 aof_world_FIN_bookmark: "Control of Karelia requires everyday government as well as border troops. Give local communities representation, restore roads and schools and strengthen a recognised frontier. Finland can defend its interests without turning its proximity to Russia into an inevitable new war."
