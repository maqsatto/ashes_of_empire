 aof_diplomacy.60.t: "Pacific de-escalation"
 aof_diplomacy.60.d: "A maritime security agreement is proposed, without transferring islands, bases or command of another navy."
 aof_diplomacy.60.a: "Accept reciprocal commitments."
 aof_diplomacy.60.b: "Offer a limited compromise."
 aof_diplomacy.60.c: "Decline and retain our own course."
