 aof_diplomacy.70.t: "The Caspian convention"
 aof_diplomacy.70.d: "A maritime corridor needs both parties’ consent. Transit, defence guarantees and refusal have different consequences. An agreement cannot itself create a navigable map route."
 aof_diplomacy.70.a: "Accept reciprocal commitments."
 aof_diplomacy.70.b: "Offer a limited compromise."
 aof_diplomacy.70.c: "Decline and retain our own course."
 aof_diplomacy.71.t: "The Caspian convention"
 aof_diplomacy.71.d: "A maritime corridor needs both parties’ consent. Transit, defence guarantees and refusal have different consequences. An agreement cannot itself create a navigable map route."
 aof_diplomacy.71.a: "Accept reciprocal commitments."
 aof_diplomacy.71.b: "Offer a limited compromise."
 aof_diplomacy.71.c: "Decline and retain our own course."
 aof_diplomacy.72.t: "War tests the convention"
 aof_diplomacy.72.d: "Alash, now a belligerent, asks us to confirm canal passage. The convention does not require Caucasus to enter the war. Maintain access, charge for protection, or close the route to this belligerent. Closure also affects its convoys; overland development remains available."
 aof_diplomacy.72.a: "Honour the convention and remain neutral."
 aof_diplomacy.72.b: "Maintain passage with a protection fee."
 aof_diplomacy.72.c: "Close passage to the belligerent."
 aof_diplomacy.80.t: "Siberian access to ports"
 aof_diplomacy.80.d: "An overland corridor and open port can connect neighbours without unifying them. Japanese protection remains a separate issue."
 aof_diplomacy.80.a: "Accept reciprocal commitments."
 aof_diplomacy.80.b: "Offer a limited compromise."
 aof_diplomacy.80.c: "Decline and retain our own course."
 aof_diplomacy.81.t: "Siberian access to ports"
 aof_diplomacy.81.d: "An overland corridor and open port can connect neighbours without unifying them. Japanese protection remains a separate issue."
 aof_diplomacy.81.a: "Accept reciprocal commitments."
 aof_diplomacy.81.b: "Offer a limited compromise."
 aof_diplomacy.81.c: "Decline and retain our own course."
 aof_diplomacy.90.t: "Terms of a South American conference"
 aof_diplomacy.90.d: "The initiator proposes a common compact. Join as an equal, seek revised terms or remain outside. Refusal does not declare war."
 aof_diplomacy.90.a: "Join as an equal participant."
 aof_diplomacy.90.b: "Demand equal terms."
 aof_diplomacy.90.c: "Decline another state’s primacy."
 aof_diplomacy.100.t: "A scientific school returns"
 aof_diplomacy.100.d: "A restored European institute invites a scholar home. Local students are already working here. Preserve exclusivity, establish a joint department or support transfer of expertise?"
 aof_diplomacy.100.a: "Retain the scholar with a new commission."
 aof_diplomacy.100.b: "Establish a joint institute."
 aof_diplomacy.100.c: "Appoint the trained successors."
 aof_diplomacy.110.t: "The end of the wartime charter"
 aof_diplomacy.110.d: "The commercial state seeks support for a civil settlement. This is a prospective partnership, not an assertion that America was its original patron."
 aof_diplomacy.110.a: "Accept reciprocal commitments."
 aof_diplomacy.110.b: "Offer a limited compromise."
 aof_diplomacy.110.c: "Decline and retain our own course."
 aof_diplomacy.120.t: "An offer of mutual defence"
 aof_diplomacy.120.d: "The sender proposes a voluntary defensive alliance. Acceptance creates a common faction without transferring land or sovereignty. Refusal leaves trade cooperation possible."
 aof_diplomacy.120.a: "Accept mutual defence."
 aof_diplomacy.120.b: "Trade and non-aggression only."
 aof_diplomacy.120.c: "Retain independent defence."
 aof_diplomacy.130.t: "Terms of an armistice"
 aof_diplomacy.130.d: "The other side proposes ending the current war without compulsory absorption. Peace preserves both states and opens postwar development. Continuing the war remains a choice."
 aof_diplomacy.130.a: "Cease fire and conclude peace."
 aof_diplomacy.130.b: "Continue the war."
 aof_diplomacy.140.t: "Pakistan requests assistance"
 aof_diplomacy.140.d: "Pakistan requests a limited arms shipment. Sending aid does not make us a belligerent; direct intervention is not established by the starting history."
 aof_diplomacy.140.a: "Send arms and instructors."
 aof_diplomacy.140.b: "Provide diplomatic support only."
 aof_diplomacy.140.c: "Decline another shipment."
 aof_diplomacy.150.t: "A Chinese agreement without subordination"
 aof_diplomacy.150.d: "Japan proposes an agreement rather than direct domination. China retains government and territory, and must consent to the terms."
 aof_diplomacy.150.a: "Accept reciprocal commitments."
 aof_diplomacy.150.b: "Offer a limited compromise."
 aof_diplomacy.150.c: "Decline and retain our own course."
 aof_v03_far_eastern_rights: "Expanded Far Eastern powers"
 aof_diplomacy.160.t: "An offer of a common federation"
 aof_diplomacy.160.d: "Our defence partner proposes unifying territory and institutions. Acceptance ends our separate country: our lands and forces pass to the proposer. A player governing this country loses separate control. New cores apply only to our owned core territory. Alternatively, retain a union of sovereign states."
 aof_diplomacy.160.a: "Accept union and relinquish separate control."
 aof_diplomacy.160.b: "Retain a union of sovereign states."
 aof_diplomacy.160.c: "Keep our existing treaties."
