 aof_diplomacy.170.t: "A request for external protection"
 aof_diplomacy.170.d: "The commercial state seeks a new protection agreement. Offer a protectorate, guarantee independence, or decline. Relinquishing sovereignty requires its government’s separate final consent."
 aof_diplomacy.170.a: "Submit a protectorate for final approval."
 aof_diplomacy.170.b: "Guarantee independence without subordination."
 aof_diplomacy.170.c: "Decline new obligations."
 aof_diplomacy.172.t: "Our government has the final say"
 aof_diplomacy.172.d: "The United States offers external protection. A protectorate preserves our country but transfers part of its external independence to the American patron. We can approve only an independence guarantee, or retain our own defence. A foreign cabinet’s decision cannot substitute for our consent."
 aof_diplomacy.172.a: "Approve the protectorate: become a subject."
 aof_diplomacy.172.b: "Accept only the independence guarantee."
 aof_diplomacy.172.c: "Retain independent defence."
 aof_diplomacy.171.t: "Orders after the war"
 aof_diplomacy.171.d: "The commercial administration offers continued supply for the civilian market. A long order costs the American budget; a short contract leaves more risk with the supplier. This is procurement, not foreign tutelage."
 aof_diplomacy.171.a: "Approve a two-year order."
 aof_diplomacy.171.b: "Offer only a one-year transition contract."
 aof_diplomacy.171.c: "Decline the new order."
 aof_diplomacy.180.t: "A mediator for the wartime charter"
 aof_diplomacy.180.d: "The North African Commonwealth offers mediation between administrators, residents and suppliers. The mediator does not appoint our government. Acceptance opens joint preparation for civilian production; rejection leaves the dispute with our own institutions."
 aof_diplomacy.180.a: "Accept mediation and exchange of specialists."
 aof_diplomacy.180.b: "Conduct talks through our own institutions."
 aof_diplomacy.181.t: "An offer of Commonwealth assistance"
 aof_diplomacy.181.d: "The Commonwealth offers help to a country already involved in an African war. We specify civilian assistance or arms; its cabinet then decides whether it can fulfil the request. Arms and guarantees represent a different foreign policy from neutral mediation."
 aof_diplomacy.181.a: "Request civilian assistance."
 aof_diplomacy.181.b: "Request arms and political protection."
 aof_diplomacy.181.c: "Decline outside assistance."
 aof_diplomacy.182.t: "Mediation by the neighbouring republic"
 aof_diplomacy.182.d: "Alash offers a forum for talks on Turkestan’s future. Preserving common institutions or agreeing a separation remains our own choice. A neighbour can support talks, but cannot partition our country by decree."
 aof_diplomacy.182.a: "Accept the forum and convene our representatives."
 aof_diplomacy.182.b: "Discuss our future without an outside mediator."
 aof_diplomacy.190.t: "Siberian trade and Japanese protection"
 aof_diplomacy.190.d: "Siberia offers trade cooperation and supports wider local powers. While Japanese protection continues, changing its terms requires Japan’s response. An independent government can conclude the treaty itself."
 aof_diplomacy.190.a: "Accept trade and request revised protection."
 aof_diplomacy.190.b: "Keep the current arrangements."
 aof_diplomacy.191.t: "The price of Far Eastern self-government"
 aof_diplomacy.191.d: "The Far Eastern government seeks Siberian trade and revised Japanese protection. Recognise independence, expand local powers, or retain military tutelage. Independence does not transfer the country to Siberia."
 aof_diplomacy.191.a: "Recognise independence and preserve trade."
 aof_diplomacy.191.b: "Allow trade and expand local powers."
 aof_diplomacy.191.c: "Retain the existing military guarantee."
 aof_diplomacy.91.t: "A counteroffer of equal terms"
 aof_diplomacy.91.d: "The invited government will discuss the conference without recognising another state’s primacy. Acceptance revises our bilateral terms; other invitees retain their own decisions. Rejection lets the partner convene an alternative peaceful conference."
 aof_diplomacy.91.a: "Accept an equal partnership."
 aof_diplomacy.91.b: "Retain our proposed terms."
 aof_diplomacy.183.t: "A mutual non-interference treaty"
 aof_diplomacy.183.d: "Alash proposes recognition of mutual independence and non-aggression. This is a treaty, not entry into a common military bloc. Agreement preserves different social systems; rejection grants no foreign territory."
 aof_diplomacy.183.a: "Sign the non-aggression pact."
 aof_diplomacy.183.b: "Decline to bind the cabinet to a new treaty."
