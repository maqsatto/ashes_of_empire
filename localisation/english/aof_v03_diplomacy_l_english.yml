 aof_diplomacy.40.t: "Revising a dependent government’s powers"
 aof_diplomacy.40.d: "The government seeks greater autonomy. Recognise independence under treaty guarantees, retain protection with local powers or refuse. Manchuria and Vladivostok remain separate questions."
