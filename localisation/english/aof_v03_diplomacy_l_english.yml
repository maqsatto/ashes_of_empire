 aof_diplomacy.201.t: "Agreement accepted"
 aof_diplomacy.201.d: "Our partner accepted reciprocal obligations. The stated terms now apply; both parties retain sovereignty."
 aof_diplomacy.201.a: "Acknowledge the answer."
 aof_diplomacy.202.t: "A limited compromise"
 aof_diplomacy.202.d: "Our partner offered narrower cooperation, leaving room for later revision rather than compulsory conflict."
 aof_diplomacy.202.a: "Acknowledge the answer."
 aof_diplomacy.203.t: "Proposal declined"
 aof_diplomacy.203.d: "Our partner declined. This grants neither foreign territory nor control of its policy. Domestic development and other partners remain available."
 aof_diplomacy.203.a: "Acknowledge the answer."
 aof_diplomacy.10.t: "Revising oil obligations"
 aof_diplomacy.10.d: "The other party proposes revised oil terms and compensation. Accept a transition, narrow the agreement or decline; war is not automatic."
 aof_diplomacy.10.a: "Accept reciprocal commitments."
 aof_diplomacy.10.b: "Offer a limited compromise."
 aof_diplomacy.10.c: "Decline and retain our own course."
