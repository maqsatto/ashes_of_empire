 aof_nations.41.t: "To whom is the civilian republic accountable?"
 aof_nations.41.d: "Resident representation has become law. Elected oversight may preserve market contracts or rest on a parliamentary programme for labour and education. Both choices retain independence and competitive government."
 aof_nations.41.a: "An elected market cabinet"
 aof_nations.41.b: "A parliamentary social compact"
 aof_nations.31.t: "The aid request has changed"
 aof_nations.31.d: "The recipient no longer meets the agreed conditions. No arms or guarantees were transferred; diplomacy can resume when circumstances change."
 aof_nations.31.a: "Acknowledge the changed circumstances"
 aof_v03_mex_supply_disruption: "Costs of unilateral revision"
 aof_v03_mex_supply_disruption_desc: "Costs of unilateral revision — strengths and limits of the chosen course."
 aof_nations.90.t: "The oil contract after the reply"
 aof_nations.90.d: "The American reply does not end our choices. An agreed transition preserves supplies at the cost of compensation. New partners require new negotiations. Unilateral revision accelerates domestic orders but disrupts supply and worsens relations."
 aof_nations.90.a: "Implement the agreed compensation transition"
 aof_nations.90.b: "Seek other investors without war"
 aof_nations.90.c: "Revise the terms unilaterally"
 aof_v03_kaz_entry1: "Convene the common congress"
 aof_v03_kaz_entry1_desc: "Convene the common congress. Independence already exists, but institutions and connections remain fragmented. Common services must replace emergency levies and personal patronage."
 aof_v03_kaz_entry2: "Connect the republican centres"
 aof_v03_kaz_entry2_desc: "Improve infrastructure and connect the capital and Caspian base to the main railway network. Both spurs require Alash to own and control the entire route."
 aof_v03_kaz_entry3: "A common treasury instead of emergency levies"
 aof_v03_kaz_entry3_desc: "A common treasury instead of emergency levies. Independence already exists, but institutions and connections remain fragmented. Common services must replace emergency levies and personal patronage."
 aof_v03_kaz_service1: "A civil administration"
 aof_v03_kaz_service1_desc: "A civil administration. Daily republican government needs trained officials and accessible education. Society must see the congress’s results beyond its meetings."
 aof_v03_kaz_service2: "A school for the next generation"
 aof_v03_kaz_service2_desc: "A school for the next generation. Daily republican government needs trained officials and accessible education. Society must see the congress’s results beyond its meetings."
 aof_v03_kaz_service3: "The republic must work every day"
 aof_v03_kaz_service3_desc: "The republic must work every day. Daily republican government needs trained officials and accessible education. Society must see the congress’s results beyond its meetings."
 aof_v03_kaz_constitution1: "A constitution recognised locally"
 aof_v03_kaz_constitution1_desc: "A constitution recognised locally. Legality builds trust among communities but prevents the centre from bypassing local guarantees for a quick order. Courts and elected government make this compromise durable."
 aof_v03_kaz_constitution2: "Citizenship before patronage"
 aof_v03_kaz_constitution2_desc: "Citizenship before patronage. Legality builds trust among communities but prevents the centre from bypassing local guarantees for a quick order. Courts and elected government make this compromise durable."
 aof_v03_kaz_constitution3: "Elected local government"
 aof_v03_kaz_constitution3_desc: "Elected local government. Legality builds trust among communities but prevents the centre from bypassing local guarantees for a quick order. Courts and elected government make this compromise durable."
 aof_v03_kaz_constitution4: "Courts between power and property"
 aof_v03_kaz_constitution4_desc: "Courts between power and property. Legality builds trust among communities but prevents the centre from bypassing local guarantees for a quick order. Courts and elected government make this compromise durable."
 aof_v03_kaz_constitution5: "A republic of many communities"
 aof_v03_kaz_constitution5_desc: "A republic of many communities. Legality builds trust among communities but prevents the centre from bypassing local guarantees for a quick order. Courts and elected government make this compromise durable."
 aof_v03_kaz_land1: "A land compromise"
 aof_v03_kaz_land1_desc: "A land compromise. Cooperation and a land compromise broaden support for education and processing. This is negotiated reform rather than forced collectivisation; domestic capital remains limited."
 aof_v03_kaz_land2: "Rural cooperatives"
 aof_v03_kaz_land2_desc: "Rural cooperatives. Cooperation and a land compromise broaden support for education and processing. This is negotiated reform rather than forced collectivisation; domestic capital remains limited."
 aof_v03_kaz_land3: "Teachers before officials"
 aof_v03_kaz_land3_desc: "Teachers before officials. Cooperation and a land compromise broaden support for education and processing. This is negotiated reform rather than forced collectivisation; domestic capital remains limited."
 aof_v03_kaz_land4: "Public orders for processing"
 aof_v03_kaz_land4_desc: "Public orders for processing. Cooperation and a land compromise broaden support for education and processing. This is negotiated reform rather than forced collectivisation; domestic capital remains limited."
 aof_v03_kaz_land5: "A social republic"
 aof_v03_kaz_land5_desc: "A social republic. Cooperation and a land compromise broaden support for education and processing. This is negotiated reform rather than forced collectivisation; domestic capital remains limited."
 aof_v03_kaz_mandate1: "Unified command"
 aof_v03_kaz_mandate1_desc: "Unified command. Emergency authority concentrates defence orders and junction security. Civilians pay through reduced influence; after the army is organised, returning the mandate remains an open question."
 aof_v03_kaz_mandate2: "Guard junctions rather than every mile"
 aof_v03_kaz_mandate2_desc: "Guard junctions rather than every mile. Emergency authority concentrates defence orders and junction security. Civilians pay through reduced influence; after the army is organised, returning the mandate remains an open question."
 aof_v03_kaz_mandate3: "An emergency industrial order"
 aof_v03_kaz_mandate3_desc: "An emergency industrial order. Emergency authority concentrates defence orders and junction security. Civilians pay through reduced influence; after the army is organised, returning the mandate remains an open question."
 aof_v03_kaz_mandate4: "The army guarantees the state"
 aof_v03_kaz_mandate4_desc: "The army guarantees the state. Emergency authority concentrates defence orders and junction security. Civilians pay through reduced influence; after the army is organised, returning the mandate remains an open question."
 aof_v03_kaz_return_mandate: "Return the mandate to congress"
 aof_v03_kaz_return_mandate_desc: "The army received a mandate to organise defence, not govern forever. Returning authority to congress requires command to defend the republic under elected civilian government."
 aof_v03_kaz_directory: "A permanent directorate"
 aof_v03_kaz_directory_desc: "A temporary command can become permanent government. The directorate retains military priorities, but abandoning the return of authority makes public trust the price of future mobilisation."
 aof_v03_kaz_industry1: "Collect the geological records"
 aof_v03_kaz_industry1_desc: "Collect the geological records. Known deposits do not yet form a domestic industrial chain. Records and roads come first, followed by processing, tools and machine building. This project does not invent resource reserves."
 aof_v03_kaz_industry2: "The first common survey programme"
 aof_v03_kaz_industry2_desc: "The first common survey programme. Known deposits do not yet form a domestic industrial chain. Records and roads come first, followed by processing, tools and machine building. This project does not invent resource reserves. One controlled state with a known resource becomes the site of a limited project. After a road is built, processing recovers a little more of a resource already produced there."
 aof_v03_kaz_industry3: "Roads to proven deposits"
 aof_v03_kaz_industry3_desc: "Roads to proven deposits. Known deposits do not yet form a domestic industrial chain. Records and roads come first, followed by processing, tools and machine building. This project does not invent resource reserves."
 aof_v03_kaz_industry4: "Processing beside extraction"
 aof_v03_kaz_industry4_desc: "Processing beside extraction. Known deposits do not yet form a domestic industrial chain. Records and roads come first, followed by processing, tools and machine building. This project does not invent resource reserves."
 aof_v03_kaz_industry5: "A toolmaking workshop"
 aof_v03_kaz_industry5_desc: "A toolmaking workshop. Known deposits do not yet form a domestic industrial chain. Records and roads come first, followed by processing, tools and machine building. This project does not invent resource reserves."
 aof_v03_kaz_industry6: "Domestic machine building"
 aof_v03_kaz_industry6_desc: "Domestic machine building. Known deposits do not yet form a domestic industrial chain. Records and roads come first, followed by processing, tools and machine building. This project does not invent resource reserves."
 aof_v03_kaz_american1: "Order machine tools"
 aof_v03_kaz_american1_desc: "Workshops need machine tools, not merely a buyer for raw materials. An American partnership brings conditions if accepted; refusal leaves us seeking another route to production."
 aof_v03_kaz_american2: "Concession terms"
 aof_v03_kaz_american2_desc: "Acceptance enables the joint programme. If refused, the republic pays for a slower domestic substitute: 25 political power to train its own specialists."
 aof_v03_kaz_american3: "Engineering places for Alash citizens"
 aof_v03_kaz_american3_desc: "Acceptance enables the joint programme. If refused, the republic pays for a slower domestic substitute: 25 political power to train its own specialists."
 aof_v03_kaz_american4: "Revise the original contract"
 aof_v03_kaz_american4_desc: "Acceptance enables the joint programme. If refused, the republic pays for a slower domestic substitute: 25 political power to train its own specialists."
 aof_v03_kaz_japanese1: "A technical mission"
 aof_v03_kaz_japanese1_desc: "Equipment without maintenance skills creates dependency. We will request a Japanese technical mission to support domestic repair works; its government retains control of its answer."
 aof_v03_kaz_japanese2: "Joint repair works"
 aof_v03_kaz_japanese2_desc: "Acceptance enables the joint programme. If refused, the republic pays for a slower domestic substitute: 25 political power to train its own specialists."
 aof_v03_kaz_japanese3: "Licences with training"
 aof_v03_kaz_japanese3_desc: "Acceptance enables the joint programme. If refused, the republic pays for a slower domestic substitute: 25 political power to train its own specialists."
 aof_v03_kaz_japanese4: "A domestic series of parts"
 aof_v03_kaz_japanese4_desc: "Acceptance enables the joint programme. If refused, the republic pays for a slower domestic substitute: 25 political power to train its own specialists."
 aof_v03_kaz_diverse1: "Divide the major orders"
 aof_v03_kaz_diverse1_desc: "Divide the major orders. Divided orders cost more and take longer than an exclusive contract. A domestic institute and equipment compatibility reduce dependence on one foreign customer."
 aof_v03_kaz_diverse2: "Invite independent teams"
 aof_v03_kaz_diverse2_desc: "Invite independent teams. Divided orders cost more and take longer than an exclusive contract. A domestic institute and equipment compatibility reduce dependence on one foreign customer."
 aof_v03_kaz_diverse3: "An institute of applied work"
 aof_v03_kaz_diverse3_desc: "An institute of applied work. Divided orders cost more and take longer than an exclusive contract. A domestic institute and equipment compatibility reduce dependence on one foreign customer."
 aof_v03_kaz_diverse4: "Our own compatibility standard"
 aof_v03_kaz_diverse4_desc: "Our own compatibility standard. Divided orders cost more and take longer than an exclusive contract. A domestic institute and equipment compatibility reduce dependence on one foreign customer."
 aof_v03_kaz_first_batch: "The first batch for our own chain"
 aof_v03_kaz_first_batch_desc: "The first production run reveals whom the industrial chain serves. The customer expects its contract honoured; local workshops need materials. We must choose fulfilment, a domestic quota or unilateral revision."
 aof_v03_kaz_caspian1: "The Caspian is not a dead end"
 aof_v03_kaz_caspian1_desc: "The Caspian is not a dead end. The maritime programme requires a verified Caspian route, controlled coastline and Caucasian consent. It complements the inland road; a partner’s refusal leaves the overland alternative open."
 aof_v03_kaz_caspian2: "Transit terms with the Caucasus"
 aof_v03_kaz_caspian2_desc: "Transit terms with the Caucasus. The maritime programme requires a verified Caspian route, controlled coastline and Caucasian consent. It complements the inland road; a partner’s refusal leaves the overland alternative open."
 aof_v03_kaz_caspian3: "The harbour and inland road"
 aof_v03_kaz_caspian3_desc: "The harbour and inland road. The maritime programme requires a verified Caspian route, controlled coastline and Caucasian consent. It complements the inland road; a partner’s refusal leaves the overland alternative open."
 aof_v03_kaz_caspian4: "Our own merchant vessels"
 aof_v03_kaz_caspian4_desc: "Our own merchant vessels. The maritime programme requires a verified Caspian route, controlled coastline and Caucasian consent. It complements the inland road; a partner’s refusal leaves the overland alternative open."
 aof_v03_kaz_caspian5: "Coastguard"
 aof_v03_kaz_caspian5_desc: "Coastguard. The maritime programme requires a verified Caspian route, controlled coastline and Caucasian consent. It complements the inland road; a partner’s refusal leaves the overland alternative open."
 aof_v03_kaz_caspian6: "Preserve the sea route"
 aof_v03_kaz_caspian6_desc: "Preserve the sea route. The maritime programme requires a verified Caspian route, controlled coastline and Caucasian consent. It complements the inland road; a partner’s refusal leaves the overland alternative open."
 aof_v03_kaz_siberia1: "A border compact with Siberia"
 aof_v03_kaz_siberia1_desc: "A border compact with Siberia. An overland connection to independent Siberia is a complete alternative to the maritime programme. Military cooperation requires a reply and never automatically merges the countries."
 aof_v03_kaz_siberia2: "The northern overland corridor"
 aof_v03_kaz_siberia2_desc: "The northern overland corridor. An overland connection to independent Siberia is a complete alternative to the maritime programme. Military cooperation requires a reply and never automatically merges the countries."
 aof_v03_kaz_siberia3: "Mutual security"
 aof_v03_kaz_siberia3_desc: "Mutual security. An overland connection to independent Siberia is a complete alternative to the maritime programme. Military cooperation requires a reply and never automatically merges the countries."
 aof_v03_kaz_soviet1: "Recognition or a succession dispute"
 aof_v03_kaz_soviet1_desc: "Independence requires our own policy towards the Soviet neighbour. We will prepare for non-interference or a defensive response to pressure; a succession dispute does not make war inevitable."
 aof_v03_kaz_noninterference: "Non-interference"
 aof_v03_kaz_noninterference_desc: "Domestic government takes priority over turning every neighbouring dispute into our own front. Stability requires restraint: neighbours' independence cannot be recognised only until the first disagreement."
 aof_v03_kaz_border_defence: "Prepare the frontiers"
 aof_v03_kaz_border_defence_desc: "External pressure requires more than declarations. Commanders and a domestic defence order will prepare the frontier without pretending that neighbouring lands already belong to us."
 aof_v03_kaz_turkestan1: "Invite mediators"
 aof_v03_kaz_turkestan1_desc: "Instability in the neighbouring union affects routes and security. Political effort will support mediation rather than promises to redraw Turkestan without its members."
 aof_v03_kaz_turkestan2: "Guarantees for local governments"
 aof_v03_kaz_turkestan2_desc: "Guarantees must leave local governments their own voice. A voluntary defence offer to Turkestan requires its consent; refusal need not end civilian cooperation."
 aof_v03_kaz_turk_union: "Preserve the neighbouring union"
 aof_v03_kaz_turk_union_desc: "A surviving neighbouring union may provide a predictable partner if its members reach their own compact. Supporting it grants no authority over Turkestan's internal government."
 aof_v03_kaz_turk_exit: "An agreed withdrawal of participants"
 aof_v03_kaz_turk_exit_desc: "Members of the neighbouring union must negotiate withdrawal themselves. Supporting negotiations neither grants us foreign states nor executes Turkestan's partition."
 aof_v03_kaz_army1: "A mobile border reserve"
 aof_v03_kaz_army1_desc: "A mobile border reserve. The republic must maintain an army across great distances. Junior officers, repairs and supply precede motorisation; domestic equipment requires functioning workshops."
 aof_v03_kaz_army2: "Junior republican officers"
 aof_v03_kaz_army2_desc: "Junior republican officers. The republic must maintain an army across great distances. Junior officers, repairs and supply precede motorisation; domestic equipment requires functioning workshops."
 aof_v03_kaz_army3: "Repair teams along the routes"
 aof_v03_kaz_army3_desc: "Repair teams along the routes. The republic must maintain an army across great distances. Junior officers, repairs and supply precede motorisation; domestic equipment requires functioning workshops."
 aof_v03_kaz_army4: "Long-range reconnaissance"
 aof_v03_kaz_army4_desc: "Long-range reconnaissance. The republic must maintain an army across great distances. Junior officers, repairs and supply precede motorisation; domestic equipment requires functioning workshops."
 aof_v03_kaz_army5: "Motorise the core"
 aof_v03_kaz_army5_desc: "Motorise the core. The republic must maintain an army across great distances. Junior officers, repairs and supply precede motorisation; domestic equipment requires functioning workshops."
 aof_v03_kaz_army6: "A fleet we can maintain"
 aof_v03_kaz_army6_desc: "A fleet we can maintain. The republic must maintain an army across great distances. Junior officers, repairs and supply precede motorisation; domestic equipment requires functioning workshops."
 aof_v03_kaz_independent: "An independent republic"
 aof_v03_kaz_independent_desc: "Industry and defence should allow the republic to decide for itself. An independent course rests on domestic trust rather than compulsory membership in another patron's bloc."
 aof_v03_kaz_steppe: "A league of steppe republics"
 aof_v03_kaz_steppe_desc: "Shared threats do not require a shared master. Voluntary defence offers to Siberia and Turkestan preserve refusal; a league requires commitments accepted by its participants."
 aof_v03_kaz_regional: "A regional power"
 aof_v03_kaz_regional_desc: "A domestic supply chain permits greater defensive ambitions. Preparing command for a regional role does not grant automatic authority over neighbouring governments."
 aof_v03_cau_entry1: "The postwar federal congress"
 aof_v03_cau_entry1_desc: "The federation needs a common mandate for postwar government. Representatives must settle authority: neither a central department nor one member can speak for the whole union on its budget."
 aof_v03_cau_entry2: "Whose obligations does the canal serve?"
 aof_v03_cau_entry2_desc: "A strategic passage needs the internal roads that serve it. Improving them must justify costs through benefits to residents as well as convenience for external customers."
 aof_v03_cau_entry3: "A common budget or local treasuries"
 aof_v03_cau_entry3_desc: "Federal and local treasuries cannot keep presenting incompatible bills. A workable budgetary settlement will prevent revenue disputes from paralysing everyday government."
 aof_v03_cau_compact1: "Confirm constituent rights"
 aof_v03_cau_compact1_desc: "Confirm constituent rights. The federation holds together through constituent rights and an agreed budget. Durable consent costs more time than a quick order; transit must not enrich only the central office."
 aof_v03_cau_compact2: "A common civil service"
 aof_v03_cau_compact2_desc: "A common civil service. The federation holds together through constituent rights and an agreed budget. Durable consent costs more time than a quick order; transit must not enrich only the central office."
 aof_v03_cau_compact3: "Distribute transit revenues"
 aof_v03_cau_compact3_desc: "Distribute transit revenues. The federation holds together through constituent rights and an agreed budget. Durable consent costs more time than a quick order; transit must not enrich only the central office."
 aof_v03_cau_compact4: "A constitution for a complex state"
 aof_v03_cau_compact4_desc: "A constitution for a complex state. The federation holds together through constituent rights and an agreed budget. Durable consent costs more time than a quick order; transit must not enrich only the central office."
 aof_v03_cau_central1: "A common army"
 aof_v03_cau_central1_desc: "A common army. A common army, customs service and roads administration accelerate coordination. Regional elites demand guarantees; centralisation has a political cost without making collapse inevitable."
 aof_v03_cau_central2: "A common customs service"
 aof_v03_cau_central2_desc: "A common customs service. A common army, customs service and roads administration accelerate coordination. Regional elites demand guarantees; centralisation has a political cost without making collapse inevitable."
 aof_v03_cau_central3: "Central management of strategic roads"
 aof_v03_cau_central3_desc: "Central management of strategic roads. A common army, customs service and roads administration accelerate coordination. Regional elites demand guarantees; centralisation has a political cost without making collapse inevitable."
 aof_v03_cau_central4: "Federal authority without intermediaries"
 aof_v03_cau_central4_desc: "Federal authority without intermediaries. A common army, customs service and roads administration accelerate coordination. Regional elites demand guarantees; centralisation has a political cost without making collapse inevitable."
 aof_v03_cau_neutral1: "A convention of free passage"
 aof_v03_cau_neutral1_desc: "A convention of free passage. Passage rules must not turn the federation into somebody else’s base. Rejecting foreign garrisons requires our own security forces and rules for another country’s war."
 aof_v03_cau_neutral2: "No foreign garrisons"
 aof_v03_cau_neutral2_desc: "No foreign garrisons. Passage rules must not turn the federation into somebody else’s base. Rejecting foreign garrisons requires our own security forces and rules for another country’s war."
 aof_v03_cau_neutral3: "Our own security service"
 aof_v03_cau_neutral3_desc: "Our own security service. Passage rules must not turn the federation into somebody else’s base. Rejecting foreign garrisons requires our own security forces and rules for another country’s war."
 aof_v03_cau_neutral4: "Transit is not submission"
 aof_v03_cau_neutral4_desc: "Transit is not submission. Passage rules must not turn the federation into somebody else’s base. Rejecting foreign garrisons requires our own security forces and rules for another country’s war."
 aof_v03_cau_transit_crisis: "Rules for somebody else’s war"
 aof_v03_cau_transit_crisis_desc: "When customers prepare to fight each other, transit becomes a political choice. We must restrict military traffic, escort it under common rules or suspend the disputed flow."
 aof_v03_cau_alash: "Offer Alash transit rules"
 aof_v03_cau_alash_desc: "A predictable Caspian partner is more useful than another dependency. We will approach Alash with a cooperation offer; an invitation creates neither a sea route nor our neighbour's consent."
 aof_v03_sib_entry1: "Reconnect the country after war"
 aof_v03_sib_entry1_desc: "Siberian independence cannot remain a name over disconnected routes. Authority to reconnect the regions must prove itself through timetables and supply rather than declarations."
 aof_v03_sib_entry2: "A common timetable and repair service"
 aof_v03_sib_entry2_desc: "Trains and workshops need compatible rules. Better connections must precede new demands on the trunk line; coordination should support local services rather than overburden them."
 aof_v03_sib_entry3: "What do the regions want?"
 aof_v03_sib_entry3_desc: "The regions need a reason to sustain a common state. Reconciling immediate needs will overcome initial fragmentation and give civilian or military priorities a working foundation."
 aof_v03_sib_civil1: "A congress of regions"
 aof_v03_sib_civil1_desc: "A congress of regions. Siberian statehood must serve its residents rather than remain a temporary headquarters. Regional consent builds trust, while external corridors depend on neighbours’ independent decisions."
 aof_v03_sib_civil2: "A civilian federation"
 aof_v03_sib_civil2_desc: "A civilian federation. Siberian statehood must serve its residents rather than remain a temporary headquarters. Regional consent builds trust, while external corridors depend on neighbours’ independent decisions."
 aof_v03_sib_civil3: "A compact with Alash"
 aof_v03_sib_civil3_desc: "A compact with Alash. Siberian statehood must serve its residents rather than remain a temporary headquarters. Regional consent builds trust, while external corridors depend on neighbours’ independent decisions."
 aof_v03_sib_civil4: "Open access through the Far East"
 aof_v03_sib_civil4_desc: "Open access through the Far East. Siberian statehood must serve its residents rather than remain a temporary headquarters. Regional consent builds trust, while external corridors depend on neighbours’ independent decisions."
 aof_v03_sib_russia1: "Common citizenship without a common leader"
 aof_v03_sib_russia1_desc: "Common citizenship without a common leader. Common citizenship does not justify another march. The conference offers a treaty to willing republics; refusal preserves their independence without automatic war."
 aof_v03_sib_russia2: "Conference of Russian republics"
 aof_v03_sib_russia2_desc: "Conference of Russian republics. Common citizenship does not justify another march. The conference offers a treaty to willing republics; refusal preserves their independence without automatic war."
 aof_v03_sib_russia3: "A treaty instead of another march"
 aof_v03_sib_russia3_desc: "A treaty instead of another march. Common citizenship does not justify another march. The conference offers a treaty to willing republics; refusal preserves their independence without automatic war."
 aof_v03_sib_russia4: "A federation of willing republics"
 aof_v03_sib_russia4_desc: "A federation of willing republics. Common citizenship does not justify another march. The conference offers a treaty to willing republics; refusal preserves their independence without automatic war."
 aof_v03_sib_directory1: "Unified command of junction security"
 aof_v03_sib_directory1_desc: "Unified command of junction security. Command guards junctions and rapidly restores the trunk line. Military orders and workshops take priority at the cost of civilian legitimacy and regional trust."
 aof_v03_sib_directory2: "Military orders for the workshops"
 aof_v03_sib_directory2_desc: "Military orders for the workshops. Command guards junctions and rapidly restores the trunk line. Military orders and workshops take priority at the cost of civilian legitimacy and regional trust."
 aof_v03_sib_directory3: "A mobile reserve"
 aof_v03_sib_directory3_desc: "A mobile reserve. Command guards junctions and rapidly restores the trunk line. Military orders and workshops take priority at the cost of civilian legitimacy and regional trust."
 aof_v03_sib_directory4: "Order along the whole route"
 aof_v03_sib_directory4_desc: "Order along the whole route. Command guards junctions and rapidly restores the trunk line. Military orders and workshops take priority at the cost of civilian legitimacy and regional trust."
 aof_v03_sib_workshops1: "Repairs along the trunk line"
 aof_v03_sib_workshops1_desc: "The trunk line cannot depend on repairs at one centre. Local maintenance infrastructure gives reliable connections priority over a central department's convenience."
 aof_v03_sib_workshops2: "Local orders for local workshops"
 aof_v03_sib_workshops2_desc: "A workshop needs steady civilian orders rather than occasional headquarters instructions. A broader productive base lets repairs and employment sustain regular regional connections."
 aof_v03_sib_workshops3: "Connections before parades"
 aof_v03_sib_workshops3_desc: "Parade production cannot replace interchangeable parts. Applied work will improve industrial reliability, supporting the trunk line with maintainable equipment rather than promises of records."
 aof_v03_sib_port_conditions: "The price of somebody else’s sea access"
 aof_v03_sib_port_conditions_desc: "Access to the sea involves another government and Japanese commitments. Limited trade or riskier support for local autonomy remain choices; our neighbour may reject our preferred terms."
 aof_v03_sov_entry1: "Close emergency front administrations"
 aof_v03_sov_entry1_desc: "The civil war has ended; front administration cannot replace ordinary government indefinitely. We will prepare workable civilian tasks before promising new campaigns abroad."
 aof_v03_sov_entry2: "Return workshops to work"
 aof_v03_sov_entry2_desc: "Workshops serve food distribution and transport as well as the army. Restoring their infrastructure gives production practical connections rather than demanding it by decree."
 aof_v03_sov_entry3: "Audit the state’s real capabilities"
 aof_v03_sov_entry3_desc: "A viable state is measured by commitments it can fulfil. Matching immediate tasks to capacity will ease the initial emergency burden and preserve a real choice of priorities."
 aof_v03_sov_recovery1: "A compromise with local production"
 aof_v03_sov_recovery1_desc: "A compromise with local production. The civil war has already ended. A viable state needs bread, goods and a workable plan; domestic recovery limits resources for revolution abroad."
 aof_v03_sov_recovery2: "Bread and manufactured goods"
 aof_v03_sov_recovery2_desc: "Bread and manufactured goods. The civil war has already ended. A viable state needs bread, goods and a workable plan; domestic recovery limits resources for revolution abroad."
 aof_v03_sov_recovery3: "From military orders to planning"
 aof_v03_sov_recovery3_desc: "From military orders to planning. The civil war has already ended. A viable state needs bread, goods and a workable plan; domestic recovery limits resources for revolution abroad."
 aof_v03_sov_recovery4: "Borders we can defend"
 aof_v03_sov_recovery4_desc: "Borders we can defend. The civil war has already ended. A viable state needs bread, goods and a workable plan; domestic recovery limits resources for revolution abroad."
 aof_v03_sov_treaty1: "The right to a separate government"
 aof_v03_sov_treaty1_desc: "The right to a separate government. Recognising a separate government must have practical meaning. Trade and defence are offered to independent neighbours, who may stay neutral or refuse."
 aof_v03_sov_treaty2: "Reciprocal trade negotiations"
 aof_v03_sov_treaty2_desc: "Reciprocal trade negotiations. Recognising a separate government must have practical meaning. Trade and defence are offered to independent neighbours, who may stay neutral or refuse."
 aof_v03_sov_treaty3: "A common defence treaty"
 aof_v03_sov_treaty3_desc: "A common defence treaty. Recognising a separate government must have practical meaning. Trade and defence are offered to independent neighbours, who may stay neutral or refuse."
 aof_v03_sov_treaty4: "A voluntary union of republics"
 aof_v03_sov_treaty4_desc: "A voluntary union of republics. Recognising a separate government must have practical meaning. Trade and defence are offered to independent neighbours, who may stay neutral or refuse."
 aof_v03_sov_pressure1: "Restore influence abroad"
 aof_v03_sov_pressure1_desc: "Restore influence abroad. Revolutionary pressure strengthens the army and foreign movements but diverts resources from domestic recovery. Neighbours gain reasons to prepare defensive agreements."
 aof_v03_sov_pressure2: "Aid friendly movements"
 aof_v03_sov_pressure2_desc: "Aid friendly movements. Revolutionary pressure strengthens the army and foreign movements but diverts resources from domestic recovery. Neighbours gain reasons to prepare defensive agreements. The organising programme costs 35 political power. One independent neighbour with existing communist support receives a proposal; its government may reject it or choose its own reform. If no eligible neighbour exists, the funds support a domestic applied school and agreement on the economic plan."
 aof_v03_sov_pressure3: "An army of revolutionary pressure"
 aof_v03_sov_pressure3_desc: "An army of revolutionary pressure. Revolutionary pressure strengthens the army and foreign movements but diverts resources from domestic recovery. Neighbours gain reasons to prepare defensive agreements."
 aof_v03_sov_pressure4: "Revisit the postwar settlement"
 aof_v03_sov_pressure4_desc: "Revisit the postwar settlement. Revolutionary pressure strengthens the army and foreign movements but diverts resources from domestic recovery. Neighbours gain reasons to prepare defensive agreements."
 aof_v03_sov_council_central: "Soviet centralism"
 aof_v03_sov_council_central_desc: "A Soviet centre can coordinate industrial orders more quickly. Local decisions pay through reduced autonomy; executive discipline must answer for results as well as obedience."
 aof_v03_sov_council_local: "Autonomous councils and cooperation"
 aof_v03_sov_council_local_desc: "Councils and cooperatives can give recovery local support. Independent work requires harder coordination of a common plan rather than identical orders to every territory."
 aof_v03_sov_ultimatum: "Demand a revision of borders"
 aof_v03_sov_ultimatum_desc: "Pressure on an independent neighbour eventually requires a separate decision on force. Government must withdraw the ultimatum or prepare war; no prior order erases Siberian statehood."
 aof_v03_naf_entry1: "Congress of liberated territories"
 aof_v03_naf_entry1_desc: "Shared freedom must still become a common state. Representatives of the liberated territories must establish authority without replacing equality with the strongest headquarters' right to decide."
 aof_v03_naf_entry2: "Restore common roads"
 aof_v03_naf_entry2_desc: "Common roads connect recovery to residents' lives. Better internal infrastructure must demonstrate the common budget's value to people whose most immediate needs remain local."
 aof_v03_naf_entry3: "Civil administration instead of headquarters"
 aof_v03_naf_entry3_desc: "A headquarters may win a struggle without establishing everyday government. Civilian administration must ground recovery in functioning institutions rather than endless emergency authority."
 aof_v03_naf_neutral1: "Guarantees without foreign bases"
 aof_v03_naf_neutral1_desc: "Guarantees without foreign bases. Neutrality actively defends independence. Domestic training units and trade security must replace foreign bases rather than open another foreign front."
 aof_v03_naf_neutral2: "Guard the trading ports"
 aof_v03_naf_neutral2_desc: "Guard the trading ports. Neutrality actively defends independence. Domestic training units and trade security must replace foreign bases rather than open another foreign front."
 aof_v03_naf_neutral3: "Commonwealth training units"
 aof_v03_naf_neutral3_desc: "Commonwealth training units. Neutrality actively defends independence. Domestic training units and trade security must replace foreign bases rather than open another foreign front."
 aof_v03_naf_neutral4: "Do not become somebody else’s front"
 aof_v03_naf_neutral4_desc: "Do not become somebody else’s front. Neutrality actively defends independence. Domestic training units and trade security must replace foreign bases rather than open another foreign front."
 aof_v03_naf_citizen1: "Common citizenship"
 aof_v03_naf_citizen1_desc: "Common citizenship. Common victory must become common citizenship, schools and a federal budget. Equality among members requires agreement but makes the state part of everyday life."
 aof_v03_naf_citizen2: "Schools for recovery"
 aof_v03_naf_citizen2_desc: "Schools for recovery. Common victory must become common citizenship, schools and a federal budget. Equality among members requires agreement but makes the state part of everyday life."
 aof_v03_naf_citizen3: "An agreed federal budget"
 aof_v03_naf_citizen3_desc: "An agreed federal budget. Common victory must become common citizenship, schools and a federal budget. Equality among members requires agreement but makes the state part of everyday life."
 aof_v03_naf_citizen4: "One country of equal members"
 aof_v03_naf_citizen4_desc: "One country of equal members. Common victory must become common citizenship, schools and a federal budget. Equality among members requires agreement but makes the state part of everyday life."
 aof_v03_naf_voice1: "Mediation among neighbours"
 aof_v03_naf_voice1_desc: "Mediation among neighbours. Mediation and specialist training offer independent states a partner without new tutelage. A later request for military aid will test the limits of our neutrality."
 aof_v03_naf_voice2: "Train African specialists"
 aof_v03_naf_voice2_desc: "Train African specialists. Mediation and specialist training offer independent states a partner without new tutelage. A later request for military aid will test the limits of our neutrality."
 aof_v03_naf_voice3: "Ports for independent trade"
 aof_v03_naf_voice3_desc: "Ports for independent trade. Mediation and specialist training offer independent states a partner without new tutelage. A later request for military aid will test the limits of our neutrality."
 aof_v03_naf_voice4: "Aid without new tutelage"
 aof_v03_naf_voice4_desc: "Aid without new tutelage. Mediation and specialist training offer independent states a partner without new tutelage. A later request for military aid will test the limits of our neutrality."
 aof_v03_naf_aid_crisis: "A request for aid in another war"
 aof_v03_naf_aid_crisis_desc: "A request for military help tests our neutrality. Civilian supplies, arms and mediation are different answers; assistance must not quietly become an obligation to fight another country's war."
 aof_v03_cmt_entry1: "The last paid invoice"
 aof_v03_cmt_entry1_desc: "The wartime invoice is paid, but the emergency administration's justification is fading. We must prepare transition before another order postpones the question of whom this country serves."
 aof_v03_cmt_entry2: "Audit the wartime charter"
 aof_v03_cmt_entry2_desc: "The charter must be measured against civilian needs rather than suppliers' convenience. Stronger internal connections will support a future settlement on labour, government and transport."
 aof_v03_cmt_entry3: "Who speaks for the country?"
 aof_v03_cmt_entry3_desc: "A contract cannot forever replace the right to represent residents. Easing initial instability will make civilian authority and supplier government an explicit political choice."
 aof_v03_cmt_residents1: "Representation for local communities"
 aof_v03_cmt_residents1_desc: "Representation for local communities. Resident representation replaces emergency administration. The transition protects labour and civil rights but requires terms with contractors who still provide employment."
 aof_v03_cmt_residents2: "Labour contracts instead of emergency rule"
 aof_v03_cmt_residents2_desc: "Labour contracts instead of emergency rule. Resident representation replaces emergency administration. The transition protects labour and civil rights but requires terms with contractors who still provide employment."
 aof_v03_cmt_residents3: "A civil constitution"
 aof_v03_cmt_residents3_desc: "A civil constitution. Resident representation replaces emergency administration. The transition protects labour and civil rights but requires terms with contractors who still provide employment."
 aof_v03_cmt_residents4: "The port belongs to the country"
 aof_v03_cmt_residents4_desc: "The port belongs to the country. Resident representation replaces emergency administration. The transition protects labour and civil rights but requires terms with contractors who still provide employment."
 aof_v03_cmt_board1: "Preserve the commercial charter"
 aof_v03_cmt_board1_desc: "Preserve the commercial charter. A long contract quickly restores production and protects corridors. Corporate government preserves the conflict between suppliers’ profits and popular representation."
 aof_v03_cmt_board2: "A new American order"
 aof_v03_cmt_board2_desc: "A new American order. A long contract quickly restores production and protects corridors. Corporate government preserves the conflict between suppliers’ profits and popular representation."
 aof_v03_cmt_board3: "Guard production corridors"
 aof_v03_cmt_board3_desc: "Guard production corridors. A long contract quickly restores production and protects corridors. Corporate government preserves the conflict between suppliers’ profits and popular representation. Continue after a reply, after thirty days without one, or when the partner becomes unavailable. Without actual consent the government closes the request as refused and continues domestically; no foreign guarantees are invented."
 aof_v03_cmt_board4: "The state of the long contract"
 aof_v03_cmt_board4_desc: "The state of the long contract. A long contract quickly restores production and protects corridors. Corporate government preserves the conflict between suppliers’ profits and popular representation."
 aof_v03_cmt_patrons1: "Talks with the former patrons"
 aof_v03_cmt_patrons1_desc: "Talks with the former patrons. Old obligations do not disappear when war ends. Negotiating a new foreign guarantee may bring security but must expose the cost to autonomy."
 aof_v03_cmt_patrons2: "Renew concession rights"
 aof_v03_cmt_patrons2_desc: "Renew concession rights. Old obligations do not disappear when war ends. Negotiating a new foreign guarantee may bring security but must expose the cost to autonomy."
 aof_v03_cmt_patrons3: "Request a foreign guarantee"
 aof_v03_cmt_patrons3_desc: "Request a foreign guarantee. Old obligations do not disappear when war ends. Negotiating a new foreign guarantee may bring security but must expose the cost to autonomy. The request for new American protection may produce voluntary dependency, a limited guarantee or refusal. It does not make America an original patron."
 aof_v03_cmt_patrons4: "Order at the cost of autonomy"
 aof_v03_cmt_patrons4_desc: "Order at the cost of autonomy. Old obligations do not disappear when war ends. Negotiating a new foreign guarantee may bring security but must expose the cost to autonomy. Continue after a reply, after thirty days without one, or when the partner becomes unavailable. Without actual consent the government closes the request as refused and continues domestically; no foreign guarantees are invented."
 aof_v03_cmt_charter_end: "The end of the wartime charter"
 aof_v03_cmt_charter_end_desc: "Ending the wartime charter requires a domestic settlement and new external terms. We will debate government and propose an American partnership without making America our former patron or substituting its answer for our choice."
 aof_v03_mex_entry1: "End emergency levies"
 aof_v03_mex_entry1_desc: "An emergency levy can outlive the reason it was introduced. Predictable rules require a mandate for reform rather than another temporary exception."
 aof_v03_mex_entry2: "Land disputes and the oil question"
 aof_v03_mex_entry2_desc: "Land claims and oil commitments cannot be settled through incompatible orders. We will improve the connections any reform needs while government determines which rights and timetables it will defend."
 aof_v03_mex_entry3: "Rules for government and companies"
 aof_v03_mex_entry3_desc: "Companies and citizens must know the limits of emergency discretion. Basic rules will ease initial instability while leaving law, oil reform and military order as genuine alternatives."
 aof_v03_mex_law1: "Property and labour guarantees"
 aof_v03_mex_law1_desc: "Property and labour guarantees. Predictable revision schedules protect labour, property and independence. Control returns more slowly, while the oil dispute gains a negotiated outcome that the United States may refuse."
 aof_v03_mex_law2: "Revise agreements on schedule"
 aof_v03_mex_law2_desc: "Revise agreements on schedule. Predictable revision schedules protect labour, property and independence. Control returns more slowly, while the oil dispute gains a negotiated outcome that the United States may refuse."
 aof_v03_mex_law3: "A common tax service"
 aof_v03_mex_law3_desc: "A common tax service. Predictable revision schedules protect labour, property and independence. Control returns more slowly, while the oil dispute gains a negotiated outcome that the United States may refuse."
 aof_v03_mex_law4: "Independence through predictability"
 aof_v03_mex_law4_desc: "Independence through predictability. Predictable revision schedules protect labour, property and independence. Control returns more slowly, while the oil dispute gains a negotiated outcome that the United States may refuse."
 aof_v03_mex_oil1: "State-owned refining"
 aof_v03_mex_oil1_desc: "State-owned refining. Oil income must become refining and local expertise. Compensation negotiations defend control without inevitable war; their outcome also depends on the United States."
 aof_v03_mex_oil2: "Local skills for the oilfields"
 aof_v03_mex_oil2_desc: "Local skills for the oilfields. Oil income must become refining and local expertise. Compensation negotiations defend control without inevitable war; their outcome also depends on the United States."
 aof_v03_mex_oil3: "Compensation negotiations"
 aof_v03_mex_oil3_desc: "Compensation negotiations. Oil income must become refining and local expertise. Compensation negotiations defend control without inevitable war; their outcome also depends on the United States."
 aof_v03_mex_oil4: "A contract written by Mexico"
 aof_v03_mex_oil4_desc: "A contract written by Mexico. Oil income must become refining and local expertise. Compensation negotiations defend control without inevitable war; their outcome also depends on the United States."
 aof_v03_mex_officers1: "One army instead of political garrisons"
 aof_v03_mex_officers1_desc: "One army instead of political garrisons. A common army guards roads and oilfields faster than political garrisons. Military transition costs civilian influence and must end in an explicit choice about returning power."
 aof_v03_mex_officers2: "Guard roads and oilfields"
 aof_v03_mex_officers2_desc: "Guard roads and oilfields. A common army guards roads and oilfields faster than political garrisons. Military transition costs civilian influence and must end in an explicit choice about returning power."
 aof_v03_mex_officers3: "A transitional military cabinet"
 aof_v03_mex_officers3_desc: "A transitional military cabinet. A common army guards roads and oilfields faster than political garrisons. Military transition costs civilian influence and must end in an explicit choice about returning power."
 aof_v03_mex_civil_return: "Restore civilian order"
 aof_v03_mex_civil_return_desc: "Guarding roads and oilfields gives the army no indefinite right to govern. Elected civilian authority must return even if command would prefer to retain the military transition's guarantees."
 aof_v03_mex_permanent: "Make the exception permanent"
 aof_v03_mex_permanent_desc: "Emergency rule can outlast its immediate tasks. A renewed mobilisation priority comes at the cost of civilian trust in the promise that military authority would remain temporary."
 aof_v03_mex_neutral_bloc: "A regional bloc of neutral countries"
 aof_v03_mex_neutral_bloc_desc: "Economic independence is easier to defend with willing partners. Voluntary defence offers to Brazil and Argentina cannot proclaim their neutrality or membership on their behalf."
 aof_v03_mex_oil_outcome: "Independence after the oil dispute"
 aof_v03_mex_oil_outcome_desc: "The reply opens a choice between agreed compensation, talks with other investors and unilateral revision. The latter accelerates domestic orders at the cost of supply disruption and relations."
 aof_v03_bra_entry1: "Accounts of the export decade"
 aof_v03_bra_entry1_desc: "Export receipts do not show how well the republic holds together. Reconciling income and obligations will give the next common order a domestic purpose beyond established customers' expectations."
 aof_v03_bra_entry2: "A common market instead of privileges"
 aof_v03_bra_entry2_desc: "Regional privilege must not divide the common market. Better infrastructure requires beneficiaries of special arrangements to justify placing their interests above exchange within the country."
 aof_v03_bra_entry3: "Who does the federal government serve?"
 aof_v03_bra_entry3_desc: "Federal authority must govern the country rather than merely distribute export income. Overcoming initial fragmentation will prepare clear civilian, officer-led and negotiated federal alternatives."
 aof_v03_bra_republic1: "Revise electoral rules"
 aof_v03_bra_republic1_desc: "Revise electoral rules. Export income does not replace a common state. Electoral rules and civilian administration must connect markets and carry federal government into the provinces."
 aof_v03_bra_republic2: "Civilian administration of garrisons"
 aof_v03_bra_republic2_desc: "Civilian administration of garrisons. Export income does not replace a common state. Electoral rules and civilian administration must connect markets and carry federal government into the provinces."
 aof_v03_bra_republic3: "Connect internal markets"
 aof_v03_bra_republic3_desc: "Connect internal markets. Export income does not replace a common state. Electoral rules and civilian administration must connect markets and carry federal government into the provinces."
 aof_v03_bra_republic4: "A republic that reaches the provinces"
 aof_v03_bra_republic4_desc: "A republic that reaches the provinces. Export income does not replace a common state. Electoral rules and civilian administration must connect markets and carry federal government into the provinces."
 aof_v03_bra_officers1: "The young officers’ programme"
 aof_v03_bra_officers1_desc: "The young officers’ programme. Officer-led modernisation concentrates infrastructure and industrial orders. The common plan’s speed risks permanent military government; the transitional cabinet must answer for its promise."
 aof_v03_bra_officers2: "A common infrastructure order"
 aof_v03_bra_officers2_desc: "A common infrastructure order. Officer-led modernisation concentrates infrastructure and industrial orders. The common plan’s speed risks permanent military government; the transitional cabinet must answer for its promise."
 aof_v03_bra_officers3: "A state industrial order"
 aof_v03_bra_officers3_desc: "A state industrial order. Officer-led modernisation concentrates infrastructure and industrial orders. The common plan’s speed risks permanent military government; the transitional cabinet must answer for its promise."
 aof_v03_bra_officers4: "A great country under one plan"
 aof_v03_bra_officers4_desc: "A great country under one plan. Officer-led modernisation concentrates infrastructure and industrial orders. The common plan’s speed risks permanent military government; the transitional cabinet must answer for its promise."
 aof_v03_bra_federal1: "Guarantees for regional governments"
 aof_v03_bra_federal1_desc: "Guarantees for regional governments. Regional guarantees allow common roads without personal central rule. Consent strengthens the federation but slows unified mobilisation."
 aof_v03_bra_federal2: "Joint interregional roads"
 aof_v03_bra_federal2_desc: "Joint interregional roads. Regional guarantees allow common roads without personal central rule. Consent strengthens the federation but slows unified mobilisation."
 aof_v03_bra_federal3: "A common export agreement"
 aof_v03_bra_federal3_desc: "A common export agreement. Regional guarantees allow common roads without personal central rule. Consent strengthens the federation but slows unified mobilisation."
 aof_v03_bra_federal4: "A strong federation without personal rule"
 aof_v03_bra_federal4_desc: "A strong federation without personal rule. Regional guarantees allow common roads without personal central rule. Consent strengthens the federation but slows unified mobilisation."
 aof_v03_bra_peace1: "Do not buy influence through war"
 aof_v03_bra_peace1_desc: "Influence need not be purchased through threats of war. Confidence in a peaceful course lets neighbours judge our invitations by predictability rather than fear of force."
 aof_v03_bra_peace2: "A South American conference"
 aof_v03_bra_peace2_desc: "A conference matters only if a major neighbour may dispute its terms. An Argentine counteroffer or refusal is more valuable than fictitious unanimity under our chairmanship."
 aof_v03_bra_peace3: "A common defence treaty"
 aof_v03_bra_peace3_desc: "A common discussion does not create a common military obligation. A separate defence offer leaves Argentina free to choose limited cooperation or independent defence."
 aof_v03_bra_hegemony1: "Brazil sets the rules"
 aof_v03_bra_hegemony1_desc: "Regional order can be pursued through Brazil's claim to set the agenda. A more assertive role must recognise that confidence in our leadership does not make neighbours willing participants."
 aof_v03_bra_hegemony2: "Our partners come first"
 aof_v03_bra_hegemony2_desc: "Selected partners will receive priority in our political efforts. Concentration helps action, but those outside the preferred circle will still demand an explanation of the regional project's rules."
 aof_v03_bra_hegemony3: "Pressure on dissenters"
 aof_v03_bra_hegemony3_desc: "A pressured conference gives neighbours a reason to reject Brazilian primacy. A harder approach to Argentina carries a domestic cost; its refusal does not automatically declare war."
 aof_v03_bra_military_promise: "The transitional cabinet’s promise"
 aof_v03_bra_military_promise_desc: "A transitional cabinet must explain when modernisation ceases to justify emergency power. It must honour the promised civilian settlement or explicitly retain permanent military government."
 aof_v03_arg_entry1: "Revenues of the long war"
 aof_v03_arg_entry1_desc: "The long war sustained demand for food, but receipts alone cannot create industrial independence. We must reconcile opportunities and obligations before investing that success in a different economy."
 aof_v03_arg_entry2: "When the old buyer no longer pays"
 aof_v03_arg_entry2_desc: "An established buyer may need our goods yet lack the means to maintain old terms. Better internal infrastructure will reduce the hold of external payments over production decisions."
 aof_v03_arg_entry3: "Orders for a different economy"
 aof_v03_arg_entry3_desc: "Export income needs a domestic purpose. Easing initial uncertainty prepares a choice between processing, a regional compact and Atlantic priorities without declaring one course inevitable."
 aof_v03_arg_industry1: "Processing instead of raw exports"
 aof_v03_arg_industry1_desc: "Processing instead of raw exports. The old buyer no longer guarantees income. Processing, machines and merchant yards turn export revenue into an independent chain at the cost of short-term consumption."
 aof_v03_arg_industry2: "Domestic machines for production"
 aof_v03_arg_industry2_desc: "Domestic machines for production. The old buyer no longer guarantees income. Processing, machines and merchant yards turn export revenue into an independent chain at the cost of short-term consumption."
 aof_v03_arg_industry3: "Merchant shipyards"
 aof_v03_arg_industry3_desc: "Merchant shipyards. The old buyer no longer guarantees income. Processing, machines and merchant yards turn export revenue into an independent chain at the cost of short-term consumption."
 aof_v03_arg_industry4: "A complete production cycle"
 aof_v03_arg_industry4_desc: "A complete production cycle. The old buyer no longer guarantees income. Processing, machines and merchant yards turn export revenue into an independent chain at the cost of short-term consumption."
 aof_v03_arg_league1: "Conference of southern states"
 aof_v03_arg_league1_desc: "Conference of southern states. The conference must preserve every participant’s voice and right to refuse. Arbitration and voluntary security offer cooperation instead of tutelage by the strongest."
 aof_v03_arg_league2: "Arbitration instead of ultimatums"
 aof_v03_arg_league2_desc: "Arbitration instead of ultimatums. The conference must preserve every participant’s voice and right to refuse. Arbitration and voluntary security offer cooperation instead of tutelage by the strongest."
 aof_v03_arg_league3: "Joint maritime security"
 aof_v03_arg_league3_desc: "Joint maritime security. The conference must preserve every participant’s voice and right to refuse. Arbitration and voluntary security offer cooperation instead of tutelage by the strongest."
 aof_v03_arg_league4: "Nobody speaks for the whole continent"
 aof_v03_arg_league4_desc: "Nobody speaks for the whole continent. The conference must preserve every participant’s voice and right to refuse. Arbitration and voluntary security offer cooperation instead of tutelage by the strongest."
 aof_v03_arg_atlantic1: "Ports as the basis of influence"
 aof_v03_arg_atlantic1_desc: "Ports as the basis of influence. Naval orders quickly strengthen external influence but take resources from domestic industry. Port-based influence does not make war with Brazil inevitable."
 aof_v03_arg_atlantic2: "Naval orders take priority"
 aof_v03_arg_atlantic2_desc: "Naval orders take priority. Naval orders quickly strengthen external influence but take resources from domestic industry. Port-based influence does not make war with Brazil inevitable."
 aof_v03_arg_atlantic3: "Defend distant trading links"
 aof_v03_arg_atlantic3_desc: "Defend distant trading links. Naval orders quickly strengthen external influence but take resources from domestic industry. Port-based influence does not make war with Brazil inevitable."
 aof_v03_arg_atlantic4: "The right to shape regional order"
 aof_v03_arg_atlantic4_desc: "The right to shape regional order. Naval orders quickly strengthen external influence but take resources from domestic industry. Port-based influence does not make war with Brazil inevitable."
 aof_v03_arg_counterconference: "An equal conference instead of primacy"
 aof_v03_arg_counterconference_desc: "Brazilian primacy need not end cooperation. We will invite independent neighbours to an equal conference; each may accept, counteroffer or refuse."
 aof_v03_arg_counterdefence: "Defence without another state’s primacy"
 aof_v03_arg_counterdefence_desc: "Governments participating in our conference receive a separate defence proposal. Joining talks never substitutes for consent to military obligations."
 aof_v03_chi_entry1: "Coordinate the nearest front"
 aof_v03_chi_entry1_desc: "The immediate front must not consume debate over the country's future. A mandate for common tasks should precede promises of personal command over every government."
 aof_v03_chi_entry2: "Who commands the garrisons?"
 aof_v03_chi_entry2_desc: "Garrison orders need connections that make them workable. Better infrastructure will support the debate between civilian and military authorities over control of common supply."
 aof_v03_chi_entry3: "Audit foreign obligations"
 aof_v03_chi_entry3_desc: "Foreign aid brings expectations that cannot be hidden behind unity. Examining commitments and easing initial instability will let the country make its next choice rather than leave it to patrons."
 aof_v03_chi_agreement1: "Conference of regional governments"
 aof_v03_chi_agreement1_desc: "Conference of regional governments. Union requires regional governments’ consent. Common customs, supplies and diplomacy build a republic without compulsory obedience to a single general."
 aof_v03_chi_agreement2: "Common customs and military supplies"
 aof_v03_chi_agreement2_desc: "Common customs and military supplies. Union requires regional governments’ consent. Common customs, supplies and diplomacy build a republic without compulsory obedience to a single general."
 aof_v03_chi_agreement3: "A constitution for union"
 aof_v03_chi_agreement3_desc: "A constitution for union. Union requires regional governments’ consent. Common customs, supplies and diplomacy build a republic without compulsory obedience to a single general."
 aof_v03_chi_agreement4: "One diplomacy without one general"
 aof_v03_chi_agreement4_desc: "One diplomacy without one general. Union requires regional governments’ consent. Common customs, supplies and diplomacy build a republic without compulsory obedience to a single general."
 aof_v03_chi_army1: "A common general staff"
 aof_v03_chi_army1_desc: "A common general staff. A common staff ends independent arms channels, but campaigning creates new obligations and conflicts. Military priority must lead to a choice between civilian government and permanent command."
 aof_v03_chi_army2: "End independent arms channels"
 aof_v03_chi_army2_desc: "End independent arms channels. A common staff ends independent arms channels, but campaigning creates new obligations and conflicts. Military priority must lead to a choice between civilian government and permanent command."
 aof_v03_chi_army3: "A campaign against defiant centres"
 aof_v03_chi_army3_desc: "A campaign against defiant centres. A common staff ends independent arms channels, but campaigning creates new obligations and conflicts. Military priority must lead to a choice between civilian government and permanent command."
 aof_v03_chi_land1: "Agreement with rural movements"
 aof_v03_chi_land1_desc: "Agreement with rural movements. Rural movements provide support and domestic supply. Local property reform can lead to a social republic or revolutionary government: these are different decisions."
 aof_v03_chi_land2: "Local property reform"
 aof_v03_chi_land2_desc: "Local property reform. Rural movements provide support and domestic supply. Local property reform can lead to a social republic or revolutionary government: these are different decisions."
 aof_v03_chi_land3: "Supply from within the country"
 aof_v03_chi_land3_desc: "Supply from within the country. Rural movements provide support and domestic supply. Local property reform can lead to a social republic or revolutionary government: these are different decisions."
 aof_v03_chi_army_civil: "Civil government after unification"
 aof_v03_chi_army_civil_desc: "A common staff need not remain the sole source of authority. Ending the military transition restores elected civilian government and an army that defends rather than indefinitely governs the state."
 aof_v03_chi_army_state: "A state of command"
 aof_v03_chi_army_state_desc: "Command can entrench its priorities through a permanent defence order. A stronger military foundation leaves demands for civilian oversight after unity unanswered."
 aof_v03_chi_social: "A social republic"
 aof_v03_chi_social_desc: "Rural reform can culminate in a parliamentary social compact. Elected social-democratic government must retain communities' support through functioning institutions rather than endless emergency appeals."
 aof_v03_chi_revolution: "Revolutionary government"
 aof_v03_chi_revolution_desc: "Rural mobilisation can support revolutionary authority rather than parliamentary compromise. A different source of power and rules of participation must still become effective government."
 aof_v03_chi_foreign_price: "Unity without a foreign price"
 aof_v03_chi_foreign_price_desc: "Unity on somebody else's terms leaves independence unresolved. We must examine acceptable aid and external involvement; our own government must answer for a future agreement's price."
