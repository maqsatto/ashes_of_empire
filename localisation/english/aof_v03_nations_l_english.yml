 aof_nations.50.t: "The military mission’s conditions"
 aof_nations.50.d: "Foreign instructors offer training but demand political concessions. Assistance must not permanently decide the government’s choices."
 aof_nations.50.a: "Limited training without commitments"
 aof_nations.50.b: "Our own officer school"
 aof_nations.50.c: "Accept the military priority"
 aof_nations.3.t: "The next contract"
 aof_nations.3.d: "The first contract brought machines and obligations. Renew it, pay for more equal terms, or leave with transitional losses."
 aof_nations.3.a: "Preserve the customer’s trust"
 aof_nations.3.b: "Pay for equal revision"
 aof_nations.3.c: "End the exclusive contract"
 aof_nations.60.t: "After the common order"
 aof_nations.60.d: "The common plan built roads. Officers now dispute who should inherit their institutions. Extending their mandate preserves command speed at the cost of civilian guarantees."
 aof_nations.60.a: "Civilian control of the new administration"
 aof_nations.60.b: "Permanent modernisation command"
 aof_nations.70.t: "The port and Japanese conditions"
 aof_nations.70.d: "Access through Vladivostok depends on its government and the Japanese guarantee. Negotiate trade, invest in another route, or offer support for autonomy. None of these choices automatically starts a war."
 aof_nations.70.a: "Trade without military commitments"
 aof_nations.70.b: "Invest in an overland route through Alash"
 aof_nations.70.c: "Offer support for autonomy"
 aof_nations.80.t: "The price of a common staff"
 aof_nations.80.d: "Military coordination gives no ownership of other governments. Invite neighbours into a voluntary compact or prepare a campaign against a defiant neighbouring centre."
 aof_nations.80.a: "Keep a negotiated outcome open"
 aof_nations.80.b: "Prepare a campaign against a neighbouring centre only"
 aof_nations.81.t: "Foreign support and a local movement"
 aof_nations.81.d: "Circumstances changed: take no further action"
 aof_nations.81.a: "Permit public organising"
 aof_nations.81.b: "Respond with domestic parliamentary reform"
 aof_nations.81.c: "Expel foreign organisers"
