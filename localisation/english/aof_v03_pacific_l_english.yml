 aof_v03_pacific.1.t: "The Professor Wants to Go Home"
 aof_v03_pacific.1.d: "A specialist who arrived during the war wants to lead a recovering European institute. Former students already run the American laboratory. We can fund an exclusive order, build a partnership, or trust our own school."
 aof_v03_pacific.1.a: "Retain the professor with a major order."
 aof_v03_pacific.1.b: "Establish a partner institute."
 aof_v03_pacific.1.c: "Appoint a trained successor."
 aof_v03_pacific.2.t: "There Was No Order from the Capital"
 aof_v03_pacific.2.d: "An armed client seized a section of Chinese railway and claims to act for Japan. Army patrons demand recognition; civilian officials fear escalation. Recognition does not transfer foreign territory to us."
 aof_v03_pacific.2.a: "Condemn the unauthorised action."
 aof_v03_pacific.2.b: "Seek a joint investigation."
 aof_v03_pacific.2.c: "Recognise the result."
 aof_v03_pacific.3.t: "Peace Presents Its Bill"
 aof_v03_pacific.3.d: "The last paid wartime invoice lies before the cabinet. Wealth and specialists remain, but old orders are ending. Industrial conversion, the distribution of profits and foreign commitments will shape our republic. Science, armour and naval programmes remain independent of the political course."
 aof_v03_pacific.3.a: "Open the peacetime accounts."
 aof_v03_pacific.4.t: "Two Protectorates, Two Prices"
 aof_v03_pacific.4.d: "The Manchurian administration needs industrial investment; Vladivostok wants a trading future; the navy needs maritime links; field commands demand freedom of action. These are distinct societies and obligations. The cabinet must choose a treaty sphere, a continental mandate or a maritime priority."
 aof_v03_pacific.4.a: "Bring the demands before the cabinet."
 aof_v03_pacific.10.t: "A Social Contract for Prosperity"
 aof_v03_pacific.10.d: "Reforms have broadened education and civilian prosperity. We can retain a social-liberal republic or give parliamentary social democracy a mandate. Both settlements preserve elections."
 aof_v03_pacific.10.a: "Social liberalism and civil guarantees."
 aof_v03_pacific.10.b: "A parliamentary social-democratic mandate."
 aof_v03_pacific.11.t: "The Limits of Presidential Power"
 aof_v03_pacific.11.d: "A hemispheric strategy needs lasting institutions but does not dictate their form. A constitutional cabinet retains parliamentary oversight. Emergency presidential rule suspends elections and provokes resistance."
 aof_v03_pacific.11.a: "A constitutional conservative cabinet."
 aof_v03_pacific.11.b: "An emergency presidential dictatorship."
 aof_v03_pacific.12.t: "Who Controls the Long Contracts?"
 aof_v03_pacific.12.d: "Long contracts give corporations political weight. We can retain elected oversight or entrust power to an unaccountable corporate cabinet. Authoritarianism is a separate choice, not an inevitable consequence of markets."
 aof_v03_pacific.12.a: "Contracts under elected republican oversight."
 aof_v03_pacific.12.b: "A corporate cabinet without a parliamentary veto."
 aof_v03_pacific.13.t: "The Cabinet of the Treaty Sphere"
 aof_v03_pacific.13.d: "Treaties with dependencies do not settle the domestic constitution. A treaty sphere may rest on conservative parliamentary continuity or a liberal civilian mandate. Neither option alone abolishes the monarchy."
 aof_v03_pacific.13.a: "Parliamentary continuity."
 aof_v03_pacific.13.b: "A liberal civilian mandate."
 aof_v03_pacific.14.t: "A Mandate or a National Mission?"
 aof_v03_pacific.14.d: "Direct domination demands ever more commitments. The military government can retain a limited mandate or declare an expansionist national mission, accelerating mobilisation at the expense of social stability."
 aof_v03_pacific.14.a: "Retain military rule without a new doctrine."
 aof_v03_pacific.14.b: "An expansionist national mission."
