 aof_nations.50.t: "Условия военной миссии"
 aof_nations.50.d: "Иностранные инструкторы готовы обучать части, но требуют политических уступок. Помощь не должна навсегда решать за правительство страны."
 aof_nations.50.a: "Ограниченное обучение без обязательств"
 aof_nations.50.b: "Собственная школа командиров"
 aof_nations.50.c: "Принять военный приоритет"
 aof_nations.3.t: "Следующий договор"
 aof_nations.3.d: "Первый контракт дал станки и обязательства. Теперь можно продлить прежние условия, оплатить более равноправный договор или выйти из него с временными потерями."
 aof_nations.3.a: "Сохранить доверие заказчика"
 aof_nations.3.b: "Оплатить равноправный пересмотр"
 aof_nations.3.c: "Завершить исключительный договор"
 aof_nations.60.t: "После общего приказа"
 aof_nations.60.d: "Единый план построил дороги. Офицеры теперь спорят, кому передать учреждения, которые они создали. Продление их мандата сохранит скорость приказа ценой гражданских гарантий."
 aof_nations.60.a: "Гражданский контроль над новым аппаратом"
 aof_nations.60.b: "Постоянное командование модернизации"
 aof_nations.70.t: "Порт и японские условия"
 aof_nations.70.d: "Выход через Владивосток зависит от местного правительства и японской гарантии. Можно согласовать торговлю, вложиться в другой маршрут или предложить поддержку самостоятельности. Ни одно решение не начинает войну само по себе."
 aof_nations.70.a: "Торговое сотрудничество без военных обязательств"
 aof_nations.70.b: "Вложиться в сухопутный маршрут через Алаш"
 aof_nations.70.c: "Предложить поддержку самостоятельности"
 aof_nations.80.t: "Цена общего штаба"
 aof_nations.80.d: "Военная координация не даёт права на чужие правительства. Можно пригласить соседей в добровольный договор или подготовить поход против неподчинившегося пограничного центра."
 aof_nations.80.a: "Договорный выход остаётся открыт"
 aof_nations.80.b: "Готовить поход только против пограничного центра"
 aof_nations.81.t: "Зарубежная помощь и местное движение"
 aof_nations.81.d: "Обстоятельства изменились: оставить вопрос без продолжения"
 aof_nations.81.a: "Разрешить открытую организационную работу"
 aof_nations.81.b: "Ответить собственной парламентской реформой"
 aof_nations.81.c: "Выслать иностранных организаторов"
