 aof_nations.10.t: "Конвенция и воюющий клиент"
 aof_nations.10.d: "Алаш участвует в войне и требует сохранить проход. Охрана требует наших средств. Ограничение страны перекрывает её военные перевозки и торговые конвои; чрезвычайное закрытие всего канала затрагивает всех клиентов. Ни одно решение не вводит Кавказ в чужую войну."
