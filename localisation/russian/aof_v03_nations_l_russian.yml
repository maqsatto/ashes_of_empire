 aof_v03_mex_oil_settlement: "Самостоятельное соглашение с США"
 aof_v03_mex_oil_settlement_desc: "Нефтяная самостоятельность требует условий, которые другая сторона готова подписать. Направим США предложение о переходе и компенсациях: согласие, компромисс и отказ должны оставаться разными исходами."
