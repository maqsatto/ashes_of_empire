 aof_nations.40.t: "Не остановить страну вместе с контрактом"
 aof_nations.40.d: "Рабочие требуют представительства, подрядчики предупреждают о срыве снабжения. Можно оплатить гарантии занятости, исполнить старые обязательства до пересмотра или до выбора авторитарного пути профинансировать гражданский переход."
