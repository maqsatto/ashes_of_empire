 aof_nations.41.t: "Кому подотчётна гражданская республика?"
 aof_nations.41.d: "Представительство жителей стало законом. Выборный надзор может сохранить рыночные договоры или опереться на парламентскую программу труда и образования. Ни один вариант не отменяет независимость и многопартийность."
 aof_nations.41.a: "Выборный рыночный кабинет"
 aof_nations.41.b: "Парламентский социальный договор"
 aof_nations.31.t: "Просьба о помощи изменилась"
 aof_nations.31.d: "Получатель больше не соответствует условиям согласованной помощи. Вооружение и гарантии не переданы; можно вернуться к дипломатии при новых обстоятельствах."
 aof_nations.31.a: "Учесть новые обстоятельства"
 aof_v03_mex_supply_disruption: "Издержки одностороннего пересмотра"
 aof_v03_mex_supply_disruption_desc: "Издержки одностороннего пересмотра — преимущества и ограничения выбранного курса."
 aof_nations.90.t: "Нефтяной договор после ответа"
 aof_nations.90.d: "Ответ США не завершает наш выбор. Согласованный переход сохраняет поставки ценой компенсаций. Новые партнёры требуют новых переговоров. Односторонний пересмотр ускоряет внутренний заказ, но нарушает снабжение и ухудшает отношения."
 aof_nations.90.a: "Выполнить согласованный компенсационный переход"
 aof_nations.90.b: "Искать других инвесторов без войны"
 aof_nations.90.c: "Провести односторонний пересмотр"
 aof_v03_kaz_entry1: "Созвать общий съезд"
 aof_v03_kaz_entry1_desc: "Созвать общий съезд. Независимость уже существует, но учреждения и связи остаются разобщёнными. Общая служба должна заменить чрезвычайный сбор средств и личное покровительство."
 aof_v03_kaz_entry2: "Связать центры республики"
 aof_v03_kaz_entry2_desc: "Улучшим инфраструктуру и соединим столицу и каспийскую базу с главной железнодорожной сетью. Обе перемычки требуют владения и контроля Алаш над всем маршрутом."
 aof_v03_kaz_entry3: "Общая казна вместо чрезвычайных сборов"
 aof_v03_kaz_entry3_desc: "Общая казна вместо чрезвычайных сборов. Независимость уже существует, но учреждения и связи остаются разобщёнными. Общая служба должна заменить чрезвычайный сбор средств и личное покровительство."
 aof_v03_kaz_service1: "Служба гражданской администрации"
 aof_v03_kaz_service1_desc: "Служба гражданской администрации. Ежедневная работа республики требует подготовленных служащих и доступного образования. Общество должно видеть результат съезда за пределами заседаний."
 aof_v03_kaz_service2: "Школа для нового поколения"
 aof_v03_kaz_service2_desc: "Школа для нового поколения. Ежедневная работа республики требует подготовленных служащих и доступного образования. Общество должно видеть результат съезда за пределами заседаний."
 aof_v03_kaz_service3: "Республика должна работать ежедневно"
 aof_v03_kaz_service3_desc: "Республика должна работать ежедневно. Ежедневная работа республики требует подготовленных служащих и доступного образования. Общество должно видеть результат съезда за пределами заседаний."
 aof_v03_kaz_constitution1: "Конституция, признанная на местах"
 aof_v03_kaz_constitution1_desc: "Конституция, признанная на местах. Законность укрепляет доверие разных общин, но запрещает центру обходить местные гарантии ради быстрого приказа. Суд и выборное управление делают этот компромисс устойчивым."
 aof_v03_kaz_constitution2: "Права гражданина важнее покровителя"
 aof_v03_kaz_constitution2_desc: "Права гражданина важнее покровителя. Законность укрепляет доверие разных общин, но запрещает центру обходить местные гарантии ради быстрого приказа. Суд и выборное управление делают этот компромисс устойчивым."
 aof_v03_kaz_constitution3: "Выборное местное управление"
 aof_v03_kaz_constitution3_desc: "Выборное местное управление. Законность укрепляет доверие разных общин, но запрещает центру обходить местные гарантии ради быстрого приказа. Суд и выборное управление делают этот компромисс устойчивым."
 aof_v03_kaz_constitution4: "Суд между властью и собственностью"
 aof_v03_kaz_constitution4_desc: "Суд между властью и собственностью. Законность укрепляет доверие разных общин, но запрещает центру обходить местные гарантии ради быстрого приказа. Суд и выборное управление делают этот компромисс устойчивым."
 aof_v03_kaz_constitution5: "Республика разных общин"
 aof_v03_kaz_constitution5_desc: "Республика разных общин. Законность укрепляет доверие разных общин, но запрещает центру обходить местные гарантии ради быстрого приказа. Суд и выборное управление делают этот компромисс устойчивым."
 aof_v03_kaz_land1: "Земельный компромисс"
 aof_v03_kaz_land1_desc: "Земельный компромисс. Кооперация и земельный компромисс расширяют поддержку образования и переработки. Это договорная реформа, а не принудительная коллективизация; внутренний капитал остаётся ограниченным."
 aof_v03_kaz_land2: "Сельские кооперативы"
 aof_v03_kaz_land2_desc: "Сельские кооперативы. Кооперация и земельный компромисс расширяют поддержку образования и переработки. Это договорная реформа, а не принудительная коллективизация; внутренний капитал остаётся ограниченным."
 aof_v03_kaz_land3: "Учитель раньше чиновника"
 aof_v03_kaz_land3_desc: "Учитель раньше чиновника. Кооперация и земельный компромисс расширяют поддержку образования и переработки. Это договорная реформа, а не принудительная коллективизация; внутренний капитал остаётся ограниченным."
 aof_v03_kaz_land4: "Общественный заказ на переработку"
 aof_v03_kaz_land4_desc: "Общественный заказ на переработку. Кооперация и земельный компромисс расширяют поддержку образования и переработки. Это договорная реформа, а не принудительная коллективизация; внутренний капитал остаётся ограниченным."
 aof_v03_kaz_land5: "Социальная республика"
 aof_v03_kaz_land5_desc: "Социальная республика. Кооперация и земельный компромисс расширяют поддержку образования и переработки. Это договорная реформа, а не принудительная коллективизация; внутренний капитал остаётся ограниченным."
 aof_v03_kaz_mandate1: "Единое командование"
 aof_v03_kaz_mandate1_desc: "Единое командование. Чрезвычайный мандат концентрирует оборонные заказы и охрану узлов. Гражданские силы платят ограничением своего влияния; после организации армии вопрос о возврате полномочий останется открытым."
 aof_v03_kaz_mandate2: "Охранять узлы, а не каждый километр"
 aof_v03_kaz_mandate2_desc: "Охранять узлы, а не каждый километр. Чрезвычайный мандат концентрирует оборонные заказы и охрану узлов. Гражданские силы платят ограничением своего влияния; после организации армии вопрос о возврате полномочий останется открытым."
 aof_v03_kaz_mandate3: "Чрезвычайный промышленный заказ"
 aof_v03_kaz_mandate3_desc: "Чрезвычайный промышленный заказ. Чрезвычайный мандат концентрирует оборонные заказы и охрану узлов. Гражданские силы платят ограничением своего влияния; после организации армии вопрос о возврате полномочий останется открытым."
 aof_v03_kaz_mandate4: "Армия гарантирует государство"
 aof_v03_kaz_mandate4_desc: "Армия гарантирует государство. Чрезвычайный мандат концентрирует оборонные заказы и охрану узлов. Гражданские силы платят ограничением своего влияния; после организации армии вопрос о возврате полномочий останется открытым."
 aof_v03_kaz_return_mandate: "Вернуть мандат съезду"
 aof_v03_kaz_return_mandate_desc: "Армия получила мандат для устройства обороны, а не вечного управления. Вернём полномочия съезду: командованию придётся защищать республику в рамках выборной гражданской власти."
 aof_v03_kaz_directory: "Постоянная директория"
 aof_v03_kaz_directory_desc: "Временный приказ можно превратить в постоянный порядок. Директория сохранит военный приоритет, но отказ от возвращения полномочий сделает общественное доверие ценой будущей мобилизации."
 aof_v03_kaz_industry1: "Собрать геологические материалы"
 aof_v03_kaz_industry1_desc: "Собрать геологические материалы. Известные недра ещё не образуют собственной промышленной цепочки. Сначала нужны материалы исследований и дороги, затем переработка, инструмент и машиностроение. Проект не создаёт вымышленных запасов ресурсов."
 aof_v03_kaz_industry2: "Первая общая экспедиционная программа"
 aof_v03_kaz_industry2_desc: "Первая общая экспедиционная программа. Известные недра ещё не образуют собственной промышленной цепочки. Сначала нужны материалы исследований и дороги, затем переработка, инструмент и машиностроение. Проект не создаёт вымышленных запасов ресурсов. Один контролируемый район с уже известным сырьём станет местом ограниченного проекта. После дороги переработка увеличит выпуск только того ресурса, который уже производится здесь."
 aof_v03_kaz_industry3: "Дороги к подтверждённым месторождениям"
 aof_v03_kaz_industry3_desc: "Дороги к подтверждённым месторождениям. Известные недра ещё не образуют собственной промышленной цепочки. Сначала нужны материалы исследований и дороги, затем переработка, инструмент и машиностроение. Проект не создаёт вымышленных запасов ресурсов."
 aof_v03_kaz_industry4: "Переработка рядом с добычей"
 aof_v03_kaz_industry4_desc: "Переработка рядом с добычей. Известные недра ещё не образуют собственной промышленной цепочки. Сначала нужны материалы исследований и дороги, затем переработка, инструмент и машиностроение. Проект не создаёт вымышленных запасов ресурсов."
 aof_v03_kaz_industry5: "Инструментальная мастерская"
 aof_v03_kaz_industry5_desc: "Инструментальная мастерская. Известные недра ещё не образуют собственной промышленной цепочки. Сначала нужны материалы исследований и дороги, затем переработка, инструмент и машиностроение. Проект не создаёт вымышленных запасов ресурсов."
 aof_v03_kaz_industry6: "Собственное машиностроение"
 aof_v03_kaz_industry6_desc: "Собственное машиностроение. Известные недра ещё не образуют собственной промышленной цепочки. Сначала нужны материалы исследований и дороги, затем переработка, инструмент и машиностроение. Проект не создаёт вымышленных запасов ресурсов."
 aof_v03_kaz_american1: "Заказ на станки"
 aof_v03_kaz_american1_desc: "Мастерским нужны станки, а не только покупатель сырья. Предложим американское партнёрство: согласие принесёт условия, отказ оставит необходимость искать другой способ освоить производство."
 aof_v03_kaz_american2: "Условия концессии"
 aof_v03_kaz_american2_desc: "При согласии партнёра действует совместная программа. При отказе республика оплачивает более медленную внутреннюю замену: 25 политической власти за подготовку собственных специалистов."
 aof_v03_kaz_american3: "Инженерные места для граждан Алаш"
 aof_v03_kaz_american3_desc: "При согласии партнёра действует совместная программа. При отказе республика оплачивает более медленную внутреннюю замену: 25 политической власти за подготовку собственных специалистов."
 aof_v03_kaz_american4: "Пересмотр первоначального договора"
 aof_v03_kaz_american4_desc: "При согласии партнёра действует совместная программа. При отказе республика оплачивает более медленную внутреннюю замену: 25 политической власти за подготовку собственных специалистов."
 aof_v03_kaz_japanese1: "Техническая миссия"
 aof_v03_kaz_japanese1_desc: "Оборудование без умения обслуживать его создаёт зависимость. Запросим японскую техническую миссию, чтобы обучение стало опорой собственных ремонтных предприятий; принимающее правительство само определит ответ."
 aof_v03_kaz_japanese2: "Совместные ремонтные предприятия"
 aof_v03_kaz_japanese2_desc: "При согласии партнёра действует совместная программа. При отказе республика оплачивает более медленную внутреннюю замену: 25 политической власти за подготовку собственных специалистов."
 aof_v03_kaz_japanese3: "Лицензия вместе с обучением"
 aof_v03_kaz_japanese3_desc: "При согласии партнёра действует совместная программа. При отказе республика оплачивает более медленную внутреннюю замену: 25 политической власти за подготовку собственных специалистов."
 aof_v03_kaz_japanese4: "Собственная серия деталей"
 aof_v03_kaz_japanese4_desc: "При согласии партнёра действует совместная программа. При отказе республика оплачивает более медленную внутреннюю замену: 25 политической власти за подготовку собственных специалистов."
 aof_v03_kaz_diverse1: "Разделить большие заказы"
 aof_v03_kaz_diverse1_desc: "Разделить большие заказы. Разделённые заказы дороже и медленнее исключительного контракта. Зато собственный институт и совместимость оборудования уменьшают зависимость от одного иностранного заказчика."
 aof_v03_kaz_diverse2: "Пригласить независимые коллективы"
 aof_v03_kaz_diverse2_desc: "Пригласить независимые коллективы. Разделённые заказы дороже и медленнее исключительного контракта. Зато собственный институт и совместимость оборудования уменьшают зависимость от одного иностранного заказчика."
 aof_v03_kaz_diverse3: "Институт прикладных работ"
 aof_v03_kaz_diverse3_desc: "Институт прикладных работ. Разделённые заказы дороже и медленнее исключительного контракта. Зато собственный институт и совместимость оборудования уменьшают зависимость от одного иностранного заказчика."
 aof_v03_kaz_diverse4: "Свой стандарт совместимости"
 aof_v03_kaz_diverse4_desc: "Свой стандарт совместимости. Разделённые заказы дороже и медленнее исключительного контракта. Зато собственный институт и совместимость оборудования уменьшают зависимость от одного иностранного заказчика."
 aof_v03_kaz_first_batch: "Первая партия собственной цепочки"
 aof_v03_kaz_first_batch_desc: "Первый выпуск показывает, кому служит промышленная цепочка. Заказчик ждёт исполнения договора, местные мастерские — материалов; предстоит выбрать между контрактом, внутренней квотой и риском одностороннего пересмотра."
 aof_v03_kaz_caspian1: "Каспий не тупик"
 aof_v03_kaz_caspian1_desc: "Каспий не тупик. Морская программа требует действительно проверенного Каспийского пути, контролируемого побережья и согласия Кавказа. Она дополняет внутреннюю дорогу; отказ партнёра не закрывает сухопутную альтернативу."
 aof_v03_kaz_caspian2: "Условия транзита с Кавказом"
 aof_v03_kaz_caspian2_desc: "Условия транзита с Кавказом. Морская программа требует действительно проверенного Каспийского пути, контролируемого побережья и согласия Кавказа. Она дополняет внутреннюю дорогу; отказ партнёра не закрывает сухопутную альтернативу."
 aof_v03_kaz_caspian3: "Гавань и внутренняя дорога"
 aof_v03_kaz_caspian3_desc: "Гавань и внутренняя дорога. Морская программа требует действительно проверенного Каспийского пути, контролируемого побережья и согласия Кавказа. Она дополняет внутреннюю дорогу; отказ партнёра не закрывает сухопутную альтернативу."
 aof_v03_kaz_caspian4: "Собственные торговые суда"
 aof_v03_kaz_caspian4_desc: "Собственные торговые суда. Морская программа требует действительно проверенного Каспийского пути, контролируемого побережья и согласия Кавказа. Она дополняет внутреннюю дорогу; отказ партнёра не закрывает сухопутную альтернативу."
 aof_v03_kaz_caspian5: "Береговая охрана"
 aof_v03_kaz_caspian5_desc: "Береговая охрана. Морская программа требует действительно проверенного Каспийского пути, контролируемого побережья и согласия Кавказа. Она дополняет внутреннюю дорогу; отказ партнёра не закрывает сухопутную альтернативу."
 aof_v03_kaz_caspian6: "Сохранить морской путь"
 aof_v03_kaz_caspian6_desc: "Сохранить морской путь. Морская программа требует действительно проверенного Каспийского пути, контролируемого побережья и согласия Кавказа. Она дополняет внутреннюю дорогу; отказ партнёра не закрывает сухопутную альтернативу."
 aof_v03_kaz_siberia1: "Пограничный договор с Сибирью"
 aof_v03_kaz_siberia1_desc: "Пограничный договор с Сибирью. Сухопутная связь с независимой Сибирью остаётся полноценной альтернативой морской программе. Военный договор требует встречного согласия и не объединяет страны автоматически."
 aof_v03_kaz_siberia2: "Северный сухопутный коридор"
 aof_v03_kaz_siberia2_desc: "Северный сухопутный коридор. Сухопутная связь с независимой Сибирью остаётся полноценной альтернативой морской программе. Военный договор требует встречного согласия и не объединяет страны автоматически."
 aof_v03_kaz_siberia3: "Взаимная безопасность"
 aof_v03_kaz_siberia3_desc: "Взаимная безопасность. Сухопутная связь с независимой Сибирью остаётся полноценной альтернативой морской программе. Военный договор требует встречного согласия и не объединяет страны автоматически."
 aof_v03_kaz_soviet1: "Признание или спор о наследстве"
 aof_v03_kaz_soviet1_desc: "Независимость требует собственной политики в отношении советского соседа. Подготовим позицию для невмешательства либо оборонного ответа на давление; спор о наследстве не делает войну неизбежной."
 aof_v03_kaz_noninterference: "Невмешательство"
 aof_v03_kaz_noninterference_desc: "Сосредоточимся на внутреннем устройстве, не превращая каждый соседний спор в собственный фронт. Спокойствие республики требует сдержанности: самостоятельность соседей нельзя признавать лишь до первого разногласия."
 aof_v03_kaz_border_defence: "Подготовить рубежи"
 aof_v03_kaz_border_defence_desc: "Внешнее давление требует больше, чем заявление. Подготовим командиров и собственный оборонный заказ; защита рубежей не означает, что соседние земли заранее объявлены нашими."
 aof_v03_kaz_turkestan1: "Пригласить посредников"
 aof_v03_kaz_turkestan1_desc: "Неустойчивость соседнего союза затрагивает дороги и безопасность. Вложим политические усилия в посредничество: общий стол переговоров полезнее обещания перекроить Туркестан без его участников."
 aof_v03_kaz_turkestan2: "Гарантии местным правительствам"
 aof_v03_kaz_turkestan2_desc: "Гарантии должны оставлять местным правительствам собственный голос. Направим Туркестану предложение добровольной обороны: согласие нельзя заменить нашим приказом, а отказ не обязан прекращать гражданское сотрудничество."
 aof_v03_kaz_turk_union: "Сохранить соседний союз"
 aof_v03_kaz_turk_union_desc: "Сохранение соседнего союза может дать предсказуемого партнёра, если участники сами найдут общий договор. Поддержим этот курс, не присваивая право управлять внутренним устройством Туркестана."
 aof_v03_kaz_turk_exit: "Согласованный выход участников"
 aof_v03_kaz_turk_exit_desc: "Участники соседнего союза должны сами договориться об условиях выхода. Поддержим переговорный путь; этот политический мандат не передаёт нам чужих областей и не исполняет раздел Туркестана."
 aof_v03_kaz_army1: "Подвижный пограничный резерв"
 aof_v03_kaz_army1_desc: "Подвижный пограничный резерв. Республика должна содержать армию на огромных расстояниях. Младшие командиры, ремонт и снабжение предшествуют моторизации; собственная техника требует работающих мастерских."
 aof_v03_kaz_army2: "Младшие командиры республики"
 aof_v03_kaz_army2_desc: "Младшие командиры республики. Республика должна содержать армию на огромных расстояниях. Младшие командиры, ремонт и снабжение предшествуют моторизации; собственная техника требует работающих мастерских."
 aof_v03_kaz_army3: "Ремонтные команды на маршрутах"
 aof_v03_kaz_army3_desc: "Ремонтные команды на маршрутах. Республика должна содержать армию на огромных расстояниях. Младшие командиры, ремонт и снабжение предшествуют моторизации; собственная техника требует работающих мастерских."
 aof_v03_kaz_army4: "Разведка больших расстояний"
 aof_v03_kaz_army4_desc: "Разведка больших расстояний. Республика должна содержать армию на огромных расстояниях. Младшие командиры, ремонт и снабжение предшествуют моторизации; собственная техника требует работающих мастерских."
 aof_v03_kaz_army5: "Моторизовать ядро"
 aof_v03_kaz_army5_desc: "Моторизовать ядро. Республика должна содержать армию на огромных расстояниях. Младшие командиры, ремонт и снабжение предшествуют моторизации; собственная техника требует работающих мастерских."
 aof_v03_kaz_army6: "Парк, который мы можем содержать"
 aof_v03_kaz_army6_desc: "Парк, который мы можем содержать. Республика должна содержать армию на огромных расстояниях. Младшие командиры, ремонт и снабжение предшествуют моторизации; собственная техника требует работающих мастерских."
 aof_v03_kaz_independent: "Самостоятельная республика"
 aof_v03_kaz_independent_desc: "Промышленность и армия должны позволить республике принимать решения самой. Закрепим самостоятельный курс без обязательного нового блока: внутреннее доверие важнее обещания очередного покровителя."
 aof_v03_kaz_steppe: "Союз степных республик"
 aof_v03_kaz_steppe_desc: "Общие угрозы не требуют общего хозяина. Предложим Сибири и Туркестану добровольную оборону, сохранив право отказа: союз возникает только из принятого обеими сторонами обязательства."
 aof_v03_kaz_regional: "Региональная держава"
 aof_v03_kaz_regional_desc: "Собственная цепочка снабжения позволяет требовать большего от обороны. Подготовим командование к региональной роли, помня: готовность действовать не даёт автоматического права распоряжаться соседями."
 aof_v03_cau_entry1: "Федеральный съезд после войны"
 aof_v03_cau_entry1_desc: "Федерации нужен общий мандат для послевоенного управления. Соберём представителей: ни центральное ведомство, ни отдельный участник не могут подменить весь союз при решении бюджетных вопросов."
 aof_v03_cau_entry2: "Чьи обязательства обслуживает канал?"
 aof_v03_cau_entry2_desc: "Стратегический путь бесполезен без обслуживающих его внутренних дорог. Начнём с их устройства: расходы должны оправдываться пользой жителям, а не только удобством внешних клиентов."
 aof_v03_cau_entry3: "Общий бюджет или местные кассы"
 aof_v03_cau_entry3_desc: "Федеральная казна и местные кассы не должны выставлять несовместимые счета. Установим рабочий бюджетный порядок, чтобы спор о доходах больше не парализовал повседневное управление."
 aof_v03_cau_compact1: "Подтвердить права субъектов"
 aof_v03_cau_compact1_desc: "Подтвердить права субъектов. Федерация сохраняет страну через права субъектов и согласованный бюджет. Устойчивое согласие дороже быстрого приказа, зато транзит не должен обогащать только центральное ведомство."
 aof_v03_cau_compact2: "Общее гражданское ведомство"
 aof_v03_cau_compact2_desc: "Общее гражданское ведомство. Федерация сохраняет страну через права субъектов и согласованный бюджет. Устойчивое согласие дороже быстрого приказа, зато транзит не должен обогащать только центральное ведомство."
 aof_v03_cau_compact3: "Распределить доходы от транзита"
 aof_v03_cau_compact3_desc: "Распределить доходы от транзита. Федерация сохраняет страну через права субъектов и согласованный бюджет. Устойчивое согласие дороже быстрого приказа, зато транзит не должен обогащать только центральное ведомство."
 aof_v03_cau_compact4: "Конституция сложного государства"
 aof_v03_cau_compact4_desc: "Конституция сложного государства. Федерация сохраняет страну через права субъектов и согласованный бюджет. Устойчивое согласие дороже быстрого приказа, зато транзит не должен обогащать только центральное ведомство."
 aof_v03_cau_central1: "Общая армия"
 aof_v03_cau_central1_desc: "Общая армия. Единые армия, таможня и управление дорогами ускоряют координацию. Региональные элиты требуют гарантий; централизация не означает неизбежного распада, но имеет политическую цену."
 aof_v03_cau_central2: "Единая таможенная служба"
 aof_v03_cau_central2_desc: "Единая таможенная служба. Единые армия, таможня и управление дорогами ускоряют координацию. Региональные элиты требуют гарантий; централизация не означает неизбежного распада, но имеет политическую цену."
 aof_v03_cau_central3: "Центральное управление дорогами"
 aof_v03_cau_central3_desc: "Центральное управление дорогами. Единые армия, таможня и управление дорогами ускоряют координацию. Региональные элиты требуют гарантий; централизация не означает неизбежного распада, но имеет политическую цену."
 aof_v03_cau_central4: "Федеральная власть без посредников"
 aof_v03_cau_central4_desc: "Федеральная власть без посредников. Единые армия, таможня и управление дорогами ускоряют координацию. Региональные элиты требуют гарантий; централизация не означает неизбежного распада, но имеет политическую цену."
 aof_v03_cau_neutral1: "Конвенция свободного прохода"
 aof_v03_cau_neutral1_desc: "Конвенция свободного прохода. Правила прохода не должны превращать федерацию в чужую базу. Отказ от иностранных гарнизонов требует собственной охраны и заранее установленных правил на случай чужой войны."
 aof_v03_cau_neutral2: "Никаких иностранных гарнизонов"
 aof_v03_cau_neutral2_desc: "Никаких иностранных гарнизонов. Правила прохода не должны превращать федерацию в чужую базу. Отказ от иностранных гарнизонов требует собственной охраны и заранее установленных правил на случай чужой войны."
 aof_v03_cau_neutral3: "Собственная служба охраны"
 aof_v03_cau_neutral3_desc: "Собственная служба охраны. Правила прохода не должны превращать федерацию в чужую базу. Отказ от иностранных гарнизонов требует собственной охраны и заранее установленных правил на случай чужой войны."
 aof_v03_cau_neutral4: "Транзит не равен подчинению"
 aof_v03_cau_neutral4_desc: "Транзит не равен подчинению. Правила прохода не должны превращать федерацию в чужую базу. Отказ от иностранных гарнизонов требует собственной охраны и заранее установленных правил на случай чужой войны."
 aof_v03_cau_transit_crisis: "Правила на случай чужой войны"
 aof_v03_cau_transit_crisis_desc: "Когда клиенты готовятся воевать друг с другом, обычный транзит становится политическим выбором. Решим, ограничивать ли военные перевозки, охранять их по общим правилам или приостанавливать спорный поток."
 aof_v03_cau_alash: "Предложить Алаш правила прохода"
 aof_v03_cau_alash_desc: "Предсказуемый партнёр у Каспия полезнее борьбы за чужую зависимость. Обратимся к Алаш с предложением сотрудничества; приглашение само по себе не создаёт морского пути и не заменяет согласия соседа."
 aof_v03_sib_entry1: "Соединить страну после войны"
 aof_v03_sib_entry1_desc: "Самостоятельность Сибири не должна оставаться названием над разорванными сообщениями. Соберём полномочия для связи регионов: государство придётся доказывать расписанием и снабжением, а не одним заявлением."
 aof_v03_sib_entry2: "Общее расписание и ремонт"
 aof_v03_sib_entry2_desc: "Поезда и мастерские должны работать по совместимым правилам. Улучшим внутреннюю связь, прежде чем требовать от магистрали новых задач: координация должна помогать местным службам, а не перегружать их."
 aof_v03_sib_entry3: "Чего хотят регионы?"
 aof_v03_sib_entry3_desc: "Регионам нужна понятная причина содержать общее государство. Согласуем ближайшие потребности и снимем исходную разобщённость, чтобы спор о гражданском или военном курсе опирался на работающие связи."
 aof_v03_sib_civil1: "Съезд регионов"
 aof_v03_sib_civil1_desc: "Съезд регионов. Сибирская государственность должна обслуживать жителей, а не оставаться временным военным штабом. Региональное согласие укрепляет доверие, но внешние коридоры зависят от самостоятельного решения соседей."
 aof_v03_sib_civil2: "Гражданская федерация"
 aof_v03_sib_civil2_desc: "Гражданская федерация. Сибирская государственность должна обслуживать жителей, а не оставаться временным военным штабом. Региональное согласие укрепляет доверие, но внешние коридоры зависят от самостоятельного решения соседей."
 aof_v03_sib_civil3: "Договор с Алаш"
 aof_v03_sib_civil3_desc: "Договор с Алаш. Сибирская государственность должна обслуживать жителей, а не оставаться временным военным штабом. Региональное согласие укрепляет доверие, но внешние коридоры зависят от самостоятельного решения соседей."
 aof_v03_sib_civil4: "Свободный выход через Дальний Восток"
 aof_v03_sib_civil4_desc: "Свободный выход через Дальний Восток. Сибирская государственность должна обслуживать жителей, а не оставаться временным военным штабом. Региональное согласие укрепляет доверие, но внешние коридоры зависят от самостоятельного решения соседей."
 aof_v03_sib_russia1: "Общее гражданство без общего вождя"
 aof_v03_sib_russia1_desc: "Общее гражданство без общего вождя. Общее гражданство не оправдывает нового похода. Конференция предлагает договор согласившимся республикам, а их отказ сохраняет независимость без автоматической войны."
 aof_v03_sib_russia2: "Конференция российских республик"
 aof_v03_sib_russia2_desc: "Конференция российских республик. Общее гражданство не оправдывает нового похода. Конференция предлагает договор согласившимся республикам, а их отказ сохраняет независимость без автоматической войны."
 aof_v03_sib_russia3: "Договор вместо нового похода"
 aof_v03_sib_russia3_desc: "Договор вместо нового похода. Общее гражданство не оправдывает нового похода. Конференция предлагает договор согласившимся республикам, а их отказ сохраняет независимость без автоматической войны."
 aof_v03_sib_russia4: "Федеративное объединение согласившихся"
 aof_v03_sib_russia4_desc: "Федеративное объединение согласившихся. Общее гражданство не оправдывает нового похода. Конференция предлагает договор согласившимся республикам, а их отказ сохраняет независимость без автоматической войны."
 aof_v03_sib_directory1: "Охрана узлов под единым командованием"
 aof_v03_sib_directory1_desc: "Охрана узлов под единым командованием. Командование охраняет узлы и быстро восстанавливает магистраль. Приоритет приказа и военных мастерских ослабляет гражданскую легитимность и доверие регионов."
 aof_v03_sib_directory2: "Военный заказ для мастерских"
 aof_v03_sib_directory2_desc: "Военный заказ для мастерских. Командование охраняет узлы и быстро восстанавливает магистраль. Приоритет приказа и военных мастерских ослабляет гражданскую легитимность и доверие регионов."
 aof_v03_sib_directory3: "Подвижный резерв"
 aof_v03_sib_directory3_desc: "Подвижный резерв. Командование охраняет узлы и быстро восстанавливает магистраль. Приоритет приказа и военных мастерских ослабляет гражданскую легитимность и доверие регионов."
 aof_v03_sib_directory4: "Порядок на всём протяжении"
 aof_v03_sib_directory4_desc: "Порядок на всём протяжении. Командование охраняет узлы и быстро восстанавливает магистраль. Приоритет приказа и военных мастерских ослабляет гражданскую легитимность и доверие регионов."
 aof_v03_sib_workshops1: "Ремонт вдоль магистрали"
 aof_v03_sib_workshops1_desc: "Магистраль не может зависеть от ремонта в единственном центре. Подготовим инфраструктуру для обслуживания на местах: надёжность сообщений важнее удобства централизованного ведомства."
 aof_v03_sib_workshops2: "Местные заказы для местных мастерских"
 aof_v03_sib_workshops2_desc: "Мастерской нужен устойчивый гражданский заказ, а не редкое распоряжение штаба. Расширим производственную опору, чтобы ремонт и занятость поддерживали постоянную связь между регионами."
 aof_v03_sib_workshops3: "Связность прежде парада"
 aof_v03_sib_workshops3_desc: "Парадный выпуск не заменяет совместимых деталей. Направим прикладную работу на производственную надёжность: дальнейшая связь магистрали должна опираться на обслуживаемую технику, а не обещание рекорда."
 aof_v03_sib_port_conditions: "Цена чужого выхода к морю"
 aof_v03_sib_port_conditions_desc: "Выход к морю зависит от другого правительства и японских обязательств. Предстоит выбрать ограниченную торговлю или более рискованную поддержку местной самостоятельности; сосед вправе отвергнуть удобные нам условия."
 aof_v03_sov_entry1: "Закрыть чрезвычайные фронтовые управления"
 aof_v03_sov_entry1_desc: "Гражданская война завершилась; фронтовое управление не должно заменять обычное государство бесконечно. Подготовим переход к выполнимым гражданским задачам, прежде чем обещать новые внешние кампании."
 aof_v03_sov_entry2: "Вернуть мастерские к работе"
 aof_v03_sov_entry2_desc: "Мастерские нужны хлебу и перевозкам не меньше, чем армии. Восстановим инфраструктуру их работы: выпуск должен опираться на доступные связи, а не требоваться одним постановлением."
 aof_v03_sov_entry3: "Проверить реальные возможности государства"
 aof_v03_sov_entry3_desc: "Жизнеспособность государства измеряется исполнимыми обязательствами. Согласуем ближайшие задачи с возможностями и снимем исходный чрезвычайный груз, оставив реальный выбор дальнейших приоритетов."
 aof_v03_sov_recovery1: "Компромисс с местным хозяйством"
 aof_v03_sov_recovery1_desc: "Компромисс с местным хозяйством. Гражданская война уже закончилась. Жизнеспособное государство требует хлеба, товаров и выполнимого плана; внутреннее восстановление ограничивает ресурсы для внешней революции."
 aof_v03_sov_recovery2: "Хлеб и промышленный товар"
 aof_v03_sov_recovery2_desc: "Хлеб и промышленный товар. Гражданская война уже закончилась. Жизнеспособное государство требует хлеба, товаров и выполнимого плана; внутреннее восстановление ограничивает ресурсы для внешней революции."
 aof_v03_sov_recovery3: "От военного приказа к плану"
 aof_v03_sov_recovery3_desc: "От военного приказа к плану. Гражданская война уже закончилась. Жизнеспособное государство требует хлеба, товаров и выполнимого плана; внутреннее восстановление ограничивает ресурсы для внешней революции."
 aof_v03_sov_recovery4: "Границы, которые можно защищать"
 aof_v03_sov_recovery4_desc: "Границы, которые можно защищать. Гражданская война уже закончилась. Жизнеспособное государство требует хлеба, товаров и выполнимого плана; внутреннее восстановление ограничивает ресурсы для внешней революции."
 aof_v03_sov_treaty1: "Право на отдельное правительство"
 aof_v03_sov_treaty1_desc: "Право на отдельное правительство. Признание отдельного правительства должно иметь практический смысл. Торговля и оборона предлагаются независимым соседям, которые могут сохранить нейтралитет или отказаться."
 aof_v03_sov_treaty2: "Переговоры о взаимной торговле"
 aof_v03_sov_treaty2_desc: "Переговоры о взаимной торговле. Признание отдельного правительства должно иметь практический смысл. Торговля и оборона предлагаются независимым соседям, которые могут сохранить нейтралитет или отказаться."
 aof_v03_sov_treaty3: "Общий оборонный договор"
 aof_v03_sov_treaty3_desc: "Общий оборонный договор. Признание отдельного правительства должно иметь практический смысл. Торговля и оборона предлагаются независимым соседям, которые могут сохранить нейтралитет или отказаться."
 aof_v03_sov_treaty4: "Добровольный союз республик"
 aof_v03_sov_treaty4_desc: "Добровольный союз республик. Признание отдельного правительства должно иметь практический смысл. Торговля и оборона предлагаются независимым соседям, которые могут сохранить нейтралитет или отказаться."
 aof_v03_sov_pressure1: "Восстановить влияние за границей"
 aof_v03_sov_pressure1_desc: "Восстановить влияние за границей. Революционное давление развивает армию и внешние связи движений, но отнимает ресурсы у внутреннего восстановления. Соседи получают основания готовить оборонительные соглашения."
 aof_v03_sov_pressure2: "Помощь дружественным движениям"
 aof_v03_sov_pressure2_desc: "Помощь дружественным движениям. Революционное давление развивает армию и внешние связи движений, но отнимает ресурсы у внутреннего восстановления. Соседи получают основания готовить оборонительные соглашения. На организационную программу уйдут 35 единиц политического ресурса. Одному независимому соседу с существующей коммунистической поддержкой поступит предложение: его правительство может отказать или выбрать собственную реформу. Если подходящего соседа нет, средства пойдут на внутреннюю прикладную школу и согласование хозяйственного плана."
 aof_v03_sov_pressure3: "Армия революционного давления"
 aof_v03_sov_pressure3_desc: "Армия революционного давления. Революционное давление развивает армию и внешние связи движений, но отнимает ресурсы у внутреннего восстановления. Соседи получают основания готовить оборонительные соглашения."
 aof_v03_sov_pressure4: "Пересмотр послевоенного устройства"
 aof_v03_sov_pressure4_desc: "Пересмотр послевоенного устройства. Революционное давление развивает армию и внешние связи движений, но отнимает ресурсы у внутреннего восстановления. Соседи получают основания готовить оборонительные соглашения."
 aof_v03_sov_council_central: "Советский централизм"
 aof_v03_sov_council_central_desc: "Советский центр может быстрее согласовать промышленный заказ. Цена — меньшая самостоятельность местных решений; исполнительная дисциплина должна отвечать за результат, а не только за соблюдение приказа."
 aof_v03_sov_council_local: "Самостоятельные советы и кооперация"
 aof_v03_sov_council_local_desc: "Советы и кооперация могут придать восстановлению местную опору. Признаем самостоятельную работу, принимая более трудное согласование общего плана вместо одинакового приказа всем территориям."
 aof_v03_sov_ultimatum: "Потребовать пересмотра границ"
 aof_v03_sov_ultimatum_desc: "Давление на независимого соседа имеет предел, после которого силу нужно выбирать отдельно. Правительство решит, отступить от ультиматума или готовить войну: прежний приказ не отменяет сибирскую государственность."
 aof_v03_naf_entry1: "Съезд освобождённых территорий"
 aof_v03_naf_entry1_desc: "Общая свобода ещё должна стать общим государством. Созовём представителей освобождённых территорий, не подменяя равноправие участников правом сильнейшего штаба решать за остальных."
 aof_v03_naf_entry2: "Восстановить общие дороги"
 aof_v03_naf_entry2_desc: "Общие дороги связывают восстановление с жизнью жителей. Улучшим внутреннюю инфраструктуру: пользу общего бюджета придётся показать тем, кто пока видит прежде всего местные нужды."
 aof_v03_naf_entry3: "Гражданская администрация вместо штаба"
 aof_v03_naf_entry3_desc: "Штаб способен выиграть борьбу и не устроить повседневное управление. Передадим восстановление гражданской администрации, чтобы общие решения опирались на работу учреждений, а не бесконечную чрезвычайную власть."
 aof_v03_naf_neutral1: "Гарантии без иностранных баз"
 aof_v03_naf_neutral1_desc: "Гарантии без иностранных баз. Нейтралитет — активная политика защиты независимости. Собственные учебные части и охрана торговли должны заменить иностранные базы, а не открыть очередной чужой фронт."
 aof_v03_naf_neutral2: "Охрана торговых портов"
 aof_v03_naf_neutral2_desc: "Охрана торговых портов. Нейтралитет — активная политика защиты независимости. Собственные учебные части и охрана торговли должны заменить иностранные базы, а не открыть очередной чужой фронт."
 aof_v03_naf_neutral3: "Учебные части содружества"
 aof_v03_naf_neutral3_desc: "Учебные части содружества. Нейтралитет — активная политика защиты независимости. Собственные учебные части и охрана торговли должны заменить иностранные базы, а не открыть очередной чужой фронт."
 aof_v03_naf_neutral4: "Не становиться чужим фронтом"
 aof_v03_naf_neutral4_desc: "Не становиться чужим фронтом. Нейтралитет — активная политика защиты независимости. Собственные учебные части и охрана торговли должны заменить иностранные базы, а не открыть очередной чужой фронт."
 aof_v03_naf_citizen1: "Общее гражданство"
 aof_v03_naf_citizen1_desc: "Общее гражданство. Общая победа должна стать общим гражданством, школами и федеральным бюджетом. Равноправие участников требует согласования, но делает государство повседневным опытом жителей."
 aof_v03_naf_citizen2: "Школьная программа восстановления"
 aof_v03_naf_citizen2_desc: "Школьная программа восстановления. Общая победа должна стать общим гражданством, школами и федеральным бюджетом. Равноправие участников требует согласования, но делает государство повседневным опытом жителей."
 aof_v03_naf_citizen3: "Согласованный федеральный бюджет"
 aof_v03_naf_citizen3_desc: "Согласованный федеральный бюджет. Общая победа должна стать общим гражданством, школами и федеральным бюджетом. Равноправие участников требует согласования, но делает государство повседневным опытом жителей."
 aof_v03_naf_citizen4: "Одна страна равных участников"
 aof_v03_naf_citizen4_desc: "Одна страна равных участников. Общая победа должна стать общим гражданством, школами и федеральным бюджетом. Равноправие участников требует согласования, но делает государство повседневным опытом жителей."
 aof_v03_naf_voice1: "Посредничество между соседями"
 aof_v03_naf_voice1_desc: "Посредничество между соседями. Посредничество и подготовка специалистов дают независимым странам партнёра без новой опеки. Просьба о военной помощи позднее проверит пределы нашего нейтралитета."
 aof_v03_naf_voice2: "Подготовка африканских специалистов"
 aof_v03_naf_voice2_desc: "Подготовка африканских специалистов. Посредничество и подготовка специалистов дают независимым странам партнёра без новой опеки. Просьба о военной помощи позднее проверит пределы нашего нейтралитета."
 aof_v03_naf_voice3: "Порты для независимой торговли"
 aof_v03_naf_voice3_desc: "Порты для независимой торговли. Посредничество и подготовка специалистов дают независимым странам партнёра без новой опеки. Просьба о военной помощи позднее проверит пределы нашего нейтралитета."
 aof_v03_naf_voice4: "Помощь без новой опеки"
 aof_v03_naf_voice4_desc: "Помощь без новой опеки. Посредничество и подготовка специалистов дают независимым странам партнёра без новой опеки. Просьба о военной помощи позднее проверит пределы нашего нейтралитета."
 aof_v03_naf_aid_crisis: "Просьба о помощи в чужой войне"
 aof_v03_naf_aid_crisis_desc: "Просьба о военной помощи проверяет наш нейтралитет. Гражданские поставки, вооружение и посредничество — разные ответы; помощь не должна незаметно стать обязательством вести чужую войну."
 aof_v03_cmt_entry1: "Последняя оплаченная накладная"
 aof_v03_cmt_entry1_desc: "Военная накладная оплачена, но прежнее оправдание чрезвычайной администрации уходит. Подготовим переход, прежде чем новый заказ снова отложит вопрос, кому служит эта страна."
 aof_v03_cmt_entry2: "Проверить военный устав"
 aof_v03_cmt_entry2_desc: "Устав следует проверить по гражданским потребностям, а не удобству поставщика. Укрепим внутренние связи, необходимые будущему договору о труде, управлении и перевозках."
 aof_v03_cmt_entry3: "Кто говорит от имени страны?"
 aof_v03_cmt_entry3_desc: "Контракт не может вечно заменять право представлять жителей. Снимем первоначальную неустойчивость администрации: гражданский мандат и власть совета поставщиков должны стать открытым политическим выбором."
 aof_v03_cmt_residents1: "Представительство местных общин"
 aof_v03_cmt_residents1_desc: "Представительство местных общин. Представительство жителей заменяет чрезвычайное управление. Переход защищает труд и гражданские права, но требует договориться с подрядчиками, от которых пока зависит занятость."
 aof_v03_cmt_residents2: "Трудовой договор вместо чрезвычайного режима"
 aof_v03_cmt_residents2_desc: "Трудовой договор вместо чрезвычайного режима. Представительство жителей заменяет чрезвычайное управление. Переход защищает труд и гражданские права, но требует договориться с подрядчиками, от которых пока зависит занятость."
 aof_v03_cmt_residents3: "Гражданская конституция"
 aof_v03_cmt_residents3_desc: "Гражданская конституция. Представительство жителей заменяет чрезвычайное управление. Переход защищает труд и гражданские права, но требует договориться с подрядчиками, от которых пока зависит занятость."
 aof_v03_cmt_residents4: "Порт принадлежит стране"
 aof_v03_cmt_residents4_desc: "Порт принадлежит стране. Представительство жителей заменяет чрезвычайное управление. Переход защищает труд и гражданские права, но требует договориться с подрядчиками, от которых пока зависит занятость."
 aof_v03_cmt_board1: "Сохранить коммерческий устав"
 aof_v03_cmt_board1_desc: "Сохранить коммерческий устав. Долгий контракт быстро возвращает производство и защищает коридоры. Корпоративный кабинет сохраняет конфликт между прибылью поставщиков и представительством населения."
 aof_v03_cmt_board2: "Новый американский заказ"
 aof_v03_cmt_board2_desc: "Новый американский заказ. Долгий контракт быстро возвращает производство и защищает коридоры. Корпоративный кабинет сохраняет конфликт между прибылью поставщиков и представительством населения."
 aof_v03_cmt_board3: "Охрана производственных коридоров"
 aof_v03_cmt_board3_desc: "Охрана производственных коридоров. Долгий контракт быстро возвращает производство и защищает коридоры. Корпоративный кабинет сохраняет конфликт между прибылью поставщиков и представительством населения. Продолжить можно после ответа, через тридцать дней без ответа либо при недоступности партнёра. Без действительного согласия правительство закроет запрос как отклонённый и продолжит внутреннюю программу; иностранные гарантии не появятся."
 aof_v03_cmt_board4: "Государство долгого контракта"
 aof_v03_cmt_board4_desc: "Государство долгого контракта. Долгий контракт быстро возвращает производство и защищает коридоры. Корпоративный кабинет сохраняет конфликт между прибылью поставщиков и представительством населения."
 aof_v03_cmt_patrons1: "Переговоры с прежними покровителями"
 aof_v03_cmt_patrons1_desc: "Переговоры с прежними покровителями. Старые обязательства не исчезают с окончанием войны. Переговоры о новой внешней гарантии могут дать безопасность, но не должны скрывать цену самостоятельности."
 aof_v03_cmt_patrons2: "Обновить концессионные права"
 aof_v03_cmt_patrons2_desc: "Обновить концессионные права. Старые обязательства не исчезают с окончанием войны. Переговоры о новой внешней гарантии могут дать безопасность, но не должны скрывать цену самостоятельности."
 aof_v03_cmt_patrons3: "Запросить иностранную гарантию"
 aof_v03_cmt_patrons3_desc: "Запросить иностранную гарантию. Старые обязательства не исчезают с окончанием войны. Переговоры о новой внешней гарантии могут дать безопасность, но не должны скрывать цену самостоятельности. Предложение новой защиты США допускает добровольную зависимость, ограниченную гарантию или отказ. Оно не утверждает, что США были прежним покровителем."
 aof_v03_cmt_patrons4: "Порядок за цену самостоятельности"
 aof_v03_cmt_patrons4_desc: "Порядок за цену самостоятельности. Старые обязательства не исчезают с окончанием войны. Переговоры о новой внешней гарантии могут дать безопасность, но не должны скрывать цену самостоятельности. Продолжить можно после ответа, через тридцать дней без ответа либо при недоступности партнёра. Без действительного согласия правительство закроет запрос как отклонённый и продолжит внутреннюю программу; иностранные гарантии не появятся."
 aof_v03_cmt_charter_end: "Конец военного устава"
 aof_v03_cmt_charter_end_desc: "Окончание военного устава требует внутреннего решения и новых внешних условий. Обсудим устройство страны и предложим США будущее партнёрство; их ответ не заменяет наш выбор и не делает их прежним покровителем."
 aof_v03_mex_entry1: "Прекратить чрезвычайные сборы"
 aof_v03_mex_entry1_desc: "Чрезвычайный сбор легко переживает причину своего введения. Подготовим переход к понятным правилам: реформа требует политического мандата, а не очередного временного исключения."
 aof_v03_mex_entry2: "Земельный спор и нефтяной вопрос"
 aof_v03_mex_entry2_desc: "Земельные требования и нефтяные обязательства нельзя решить несовместимыми распоряжениями. Начнём с внутренних связей, нужных любой реформе, пока правительство определяет защищаемые права и сроки."
 aof_v03_mex_entry3: "Правила для правительства и компаний"
 aof_v03_mex_entry3_desc: "Компании и граждане должны понимать предел чрезвычайных решений. Установим исходные правила и снимем первоначальную неустойчивость, оставив закон, нефтяную реформу и военный порядок реальными альтернативами."
 aof_v03_mex_law1: "Гарантии собственности и труда"
 aof_v03_mex_law1_desc: "Гарантии собственности и труда. Предсказуемые сроки пересмотра защищают труд, собственность и самостоятельность. Контроль возвращается медленнее, зато нефтяной спор получает договорную развязку с реальным правом США отказать."
 aof_v03_mex_law2: "Пересмотр соглашений по срокам"
 aof_v03_mex_law2_desc: "Пересмотр соглашений по срокам. Предсказуемые сроки пересмотра защищают труд, собственность и самостоятельность. Контроль возвращается медленнее, зато нефтяной спор получает договорную развязку с реальным правом США отказать."
 aof_v03_mex_law3: "Общая налоговая служба"
 aof_v03_mex_law3_desc: "Общая налоговая служба. Предсказуемые сроки пересмотра защищают труд, собственность и самостоятельность. Контроль возвращается медленнее, зато нефтяной спор получает договорную развязку с реальным правом США отказать."
 aof_v03_mex_law4: "Самостоятельность через предсказуемость"
 aof_v03_mex_law4_desc: "Самостоятельность через предсказуемость. Предсказуемые сроки пересмотра защищают труд, собственность и самостоятельность. Контроль возвращается медленнее, зато нефтяной спор получает договорную развязку с реальным правом США отказать."
 aof_v03_mex_oil1: "Государственная переработка"
 aof_v03_mex_oil1_desc: "Государственная переработка. Доход от нефти должен стать переработкой и местными кадрами. Компенсационные переговоры позволяют отстаивать контроль без обязательной войны; их исход зависит и от США."
 aof_v03_mex_oil2: "Местные кадры для промыслов"
 aof_v03_mex_oil2_desc: "Местные кадры для промыслов. Доход от нефти должен стать переработкой и местными кадрами. Компенсационные переговоры позволяют отстаивать контроль без обязательной войны; их исход зависит и от США."
 aof_v03_mex_oil3: "Переговоры о компенсациях"
 aof_v03_mex_oil3_desc: "Переговоры о компенсациях. Доход от нефти должен стать переработкой и местными кадрами. Компенсационные переговоры позволяют отстаивать контроль без обязательной войны; их исход зависит и от США."
 aof_v03_mex_oil4: "Договор, который пишет Мексика"
 aof_v03_mex_oil4_desc: "Договор, который пишет Мексика. Доход от нефти должен стать переработкой и местными кадрами. Компенсационные переговоры позволяют отстаивать контроль без обязательной войны; их исход зависит и от США."
 aof_v03_mex_officers1: "Единая армия вместо политических гарнизонов"
 aof_v03_mex_officers1_desc: "Единая армия вместо политических гарнизонов. Общая армия защищает дороги и промыслы быстрее разрозненных гарнизонов. Военный переход имеет цену для гражданской политики и должен закончиться явным выбором о возврате власти."
 aof_v03_mex_officers2: "Охрана дорог и промыслов"
 aof_v03_mex_officers2_desc: "Охрана дорог и промыслов. Общая армия защищает дороги и промыслы быстрее разрозненных гарнизонов. Военный переход имеет цену для гражданской политики и должен закончиться явным выбором о возврате власти."
 aof_v03_mex_officers3: "Военный кабинет переходного периода"
 aof_v03_mex_officers3_desc: "Военный кабинет переходного периода. Общая армия защищает дороги и промыслы быстрее разрозненных гарнизонов. Военный переход имеет цену для гражданской политики и должен закончиться явным выбором о возврате власти."
 aof_v03_mex_civil_return: "Вернуть гражданский порядок"
 aof_v03_mex_civil_return_desc: "Охрана дорог и промыслов не даёт армии бессрочного права править. Вернём власть выборному гражданскому правительству, даже если командование предпочло бы сохранить гарантии военного перехода."
 aof_v03_mex_permanent: "Сделать исключение постоянным"
 aof_v03_mex_permanent_desc: "Чрезвычайный порядок можно сохранить после выполнения ближайших задач. Новый мобилизационный приоритет будет оплачен гражданским недоверием к обещанию временной военной власти."
 aof_v03_mex_neutral_bloc: "Региональный блок нейтральных стран"
 aof_v03_mex_neutral_bloc_desc: "Самостоятельность хозяйственной политики легче защищать с согласившимися партнёрами. Предложим Бразилии и Аргентине добровольную оборону: ни их нейтралитет, ни членство в блоке нельзя объявить за них."
 aof_v03_mex_oil_outcome: "Самостоятельность после нефтяного спора"
 aof_v03_mex_oil_outcome_desc: "Полученный ответ открывает выбор между согласованными компенсациями, переговорами с другими инвесторами и односторонним пересмотром. Последний ускорит внутренний заказ ценой перебоев снабжения и ухудшения отношений."
 aof_v03_bra_entry1: "Счёт экспортного десятилетия"
 aof_v03_bra_entry1_desc: "Экспортная выручка не показывает, насколько связана республика. Сведём доходы и обязательства, чтобы следующий общий заказ отвечал внутренним нуждам, а не только ожиданиям привычных покупателей."
 aof_v03_bra_entry2: "Общий рынок вместо привилегий"
 aof_v03_bra_entry2_desc: "Региональная привилегия не должна разрывать общий рынок. Улучшим его инфраструктуру: сторонникам особых условий придётся объяснить, почему их выгода важнее обмена между частями страны."
 aof_v03_bra_entry3: "Кому служит федеральное правительство?"
 aof_v03_bra_entry3_desc: "Федеральная власть должна отвечать за страну, а не только распределять экспортную ренту. Снимем исходную разобщённость, чтобы гражданский, офицерский и договорно-федеральный курсы стали ясными альтернативами."
 aof_v03_bra_republic1: "Пересмотреть правила выборов"
 aof_v03_bra_republic1_desc: "Пересмотреть правила выборов. Экспортная выручка не заменяет общего государства. Выборные правила и гражданское управление должны связать рынки и довести федеральную власть до провинций."
 aof_v03_bra_republic2: "Гражданское управление гарнизонами"
 aof_v03_bra_republic2_desc: "Гражданское управление гарнизонами. Экспортная выручка не заменяет общего государства. Выборные правила и гражданское управление должны связать рынки и довести федеральную власть до провинций."
 aof_v03_bra_republic3: "Связать внутренние рынки"
 aof_v03_bra_republic3_desc: "Связать внутренние рынки. Экспортная выручка не заменяет общего государства. Выборные правила и гражданское управление должны связать рынки и довести федеральную власть до провинций."
 aof_v03_bra_republic4: "Республика доходит до провинций"
 aof_v03_bra_republic4_desc: "Республика доходит до провинций. Экспортная выручка не заменяет общего государства. Выборные правила и гражданское управление должны связать рынки и довести федеральную власть до провинций."
 aof_v03_bra_officers1: "Программа молодых командиров"
 aof_v03_bra_officers1_desc: "Программа молодых командиров. Офицерская модернизация концентрирует инфраструктуру и промышленный заказ. Скорость общего плана оплачивается риском постоянной военной власти; переходный кабинет должен решить, выполнено ли обещание."
 aof_v03_bra_officers2: "Общий инфраструктурный приказ"
 aof_v03_bra_officers2_desc: "Общий инфраструктурный приказ. Офицерская модернизация концентрирует инфраструктуру и промышленный заказ. Скорость общего плана оплачивается риском постоянной военной власти; переходный кабинет должен решить, выполнено ли обещание."
 aof_v03_bra_officers3: "Государственный промышленный заказ"
 aof_v03_bra_officers3_desc: "Государственный промышленный заказ. Офицерская модернизация концентрирует инфраструктуру и промышленный заказ. Скорость общего плана оплачивается риском постоянной военной власти; переходный кабинет должен решить, выполнено ли обещание."
 aof_v03_bra_officers4: "Большая страна под единым планом"
 aof_v03_bra_officers4_desc: "Большая страна под единым планом. Офицерская модернизация концентрирует инфраструктуру и промышленный заказ. Скорость общего плана оплачивается риском постоянной военной власти; переходный кабинет должен решить, выполнено ли обещание."
 aof_v03_bra_federal1: "Гарантии региональным правительствам"
 aof_v03_bra_federal1_desc: "Гарантии региональным правительствам. Гарантии региональных правительств позволяют строить общие дороги без единоличного центра. Согласие укрепляет федерацию, но замедляет единую мобилизацию."
 aof_v03_bra_federal2: "Совместные межрегиональные дороги"
 aof_v03_bra_federal2_desc: "Совместные межрегиональные дороги. Гарантии региональных правительств позволяют строить общие дороги без единоличного центра. Согласие укрепляет федерацию, но замедляет единую мобилизацию."
 aof_v03_bra_federal3: "Единый экспортный договор"
 aof_v03_bra_federal3_desc: "Единый экспортный договор. Гарантии региональных правительств позволяют строить общие дороги без единоличного центра. Согласие укрепляет федерацию, но замедляет единую мобилизацию."
 aof_v03_bra_federal4: "Сильная федерация без единоличного центра"
 aof_v03_bra_federal4_desc: "Сильная федерация без единоличного центра. Гарантии региональных правительств позволяют строить общие дороги без единоличного центра. Согласие укрепляет федерацию, но замедляет единую мобилизацию."
 aof_v03_bra_peace1: "Не покупать влияние войной"
 aof_v03_bra_peace1_desc: "Влияние не обязательно покупать угрозой войны. Укрепим внутреннюю уверенность в мирном курсе, чтобы соседи оценивали наше приглашение по предсказуемости, а не страху перед силой."
 aof_v03_bra_peace2: "Южноамериканская конференция"
 aof_v03_bra_peace2_desc: "Конференция имеет смысл, если крупный сосед вправе спорить об условиях. Пригласим Аргентину: встречное предложение или отказ полезнее фиктивного единодушия под нашим председательством."
 aof_v03_bra_peace3: "Общий оборонный договор"
 aof_v03_bra_peace3_desc: "Общее обсуждение ещё не создаёт общего военного обязательства. Предложим Аргентине отдельный оборонный договор, оставив возможность ограниченного сотрудничества или самостоятельной защиты."
 aof_v03_bra_hegemony1: "Бразилия определяет правила"
 aof_v03_bra_hegemony1_desc: "Можно строить региональный порядок через право Бразилии задавать повестку. Подготовим общество к напористой роли, понимая: уверенность в своём лидерстве не делает соседей согласными участниками."
 aof_v03_bra_hegemony2: "Приоритет собственным партнёрам"
 aof_v03_bra_hegemony2_desc: "Избранные партнёры получат приоритет наших политических усилий. Это позволяет действовать сосредоточенно, но тем, кто остался вне круга, ещё предстоит объяснить правила регионального проекта."
 aof_v03_bra_hegemony3: "Давление на несогласных"
 aof_v03_bra_hegemony3_desc: "Конференция под давлением даст соседям повод отвергнуть первенство Бразилии. Обозначим жёсткий курс перед Аргентиной, принимая внутреннюю цену спора; её отказ не объявляет войну автоматически."
 aof_v03_bra_military_promise: "Обещание переходного кабинета"
 aof_v03_bra_military_promise_desc: "Переходный кабинет должен объяснить, когда модернизация перестаёт оправдывать чрезвычайную власть. Предстоит выбрать: выполнить обещание гражданского порядка или признать постоянное военное правление."
 aof_v03_arg_entry1: "Доходы долгой войны"
 aof_v03_arg_entry1_desc: "Долгая война поддержала спрос на продовольствие, но выручка не создаёт промышленной самостоятельности сама. Сведём возможности и обязательства, прежде чем вкладывать прежний успех в другую экономику."
 aof_v03_arg_entry2: "Когда старый покупатель не платит"
 aof_v03_arg_entry2_desc: "Привычный покупатель может нуждаться в товаре и не иметь средств на прежние условия. Укрепим внутреннюю инфраструктуру, чтобы внешний расчёт не определял каждое производственное решение."
 aof_v03_arg_entry3: "Заказ на другую экономику"
 aof_v03_arg_entry3_desc: "Экспортному доходу нужно внутреннее назначение. Снимем исходную неопределённость и подготовим выбор между промышленной переработкой, региональным договором и атлантическим приоритетом, не объявляя один путь неизбежной судьбой."
 aof_v03_arg_industry1: "Переработка вместо одного сырья"
 aof_v03_arg_industry1_desc: "Переработка вместо одного сырья. Старый покупатель больше не гарантирует доход. Переработка, машины и торговые верфи превращают экспортную выручку в самостоятельную цепочку ценой краткосрочного потребления."
 aof_v03_arg_industry2: "Собственные машины для хозяйства"
 aof_v03_arg_industry2_desc: "Собственные машины для хозяйства. Старый покупатель больше не гарантирует доход. Переработка, машины и торговые верфи превращают экспортную выручку в самостоятельную цепочку ценой краткосрочного потребления."
 aof_v03_arg_industry3: "Верфи торгового флота"
 aof_v03_arg_industry3_desc: "Верфи торгового флота. Старый покупатель больше не гарантирует доход. Переработка, машины и торговые верфи превращают экспортную выручку в самостоятельную цепочку ценой краткосрочного потребления."
 aof_v03_arg_industry4: "Полный производственный цикл"
 aof_v03_arg_industry4_desc: "Полный производственный цикл. Старый покупатель больше не гарантирует доход. Переработка, машины и торговые верфи превращают экспортную выручку в самостоятельную цепочку ценой краткосрочного потребления."
 aof_v03_arg_league1: "Конференция южных государств"
 aof_v03_arg_league1_desc: "Конференция южных государств. Конференция должна оставлять каждому участнику голос и право отказа. Арбитраж и добровольная безопасность противопоставляют сотрудничество опеке сильнейшего."
 aof_v03_arg_league2: "Арбитраж вместо ультиматума"
 aof_v03_arg_league2_desc: "Арбитраж вместо ультиматума. Конференция должна оставлять каждому участнику голос и право отказа. Арбитраж и добровольная безопасность противопоставляют сотрудничество опеке сильнейшего."
 aof_v03_arg_league3: "Совместная морская безопасность"
 aof_v03_arg_league3_desc: "Совместная морская безопасность. Конференция должна оставлять каждому участнику голос и право отказа. Арбитраж и добровольная безопасность противопоставляют сотрудничество опеке сильнейшего."
 aof_v03_arg_league4: "Никто не говорит за весь континент"
 aof_v03_arg_league4_desc: "Никто не говорит за весь континент. Конференция должна оставлять каждому участнику голос и право отказа. Арбитраж и добровольная безопасность противопоставляют сотрудничество опеке сильнейшего."
 aof_v03_arg_atlantic1: "Порты как основа влияния"
 aof_v03_arg_atlantic1_desc: "Порты как основа влияния. Морской заказ быстро усиливает внешнюю роль, но забирает ресурсы у внутренней промышленной программы. Влияние через порты не делает войну с Бразилией обязательной."
 aof_v03_arg_atlantic2: "Приоритет морскому заказу"
 aof_v03_arg_atlantic2_desc: "Приоритет морскому заказу. Морской заказ быстро усиливает внешнюю роль, но забирает ресурсы у внутренней промышленной программы. Влияние через порты не делает войну с Бразилией обязательной."
 aof_v03_arg_atlantic3: "Защита дальних торговых связей"
 aof_v03_arg_atlantic3_desc: "Защита дальних торговых связей. Морской заказ быстро усиливает внешнюю роль, но забирает ресурсы у внутренней промышленной программы. Влияние через порты не делает войну с Бразилией обязательной."
 aof_v03_arg_atlantic4: "Право определять региональный порядок"
 aof_v03_arg_atlantic4_desc: "Право определять региональный порядок. Морской заказ быстро усиливает внешнюю роль, но забирает ресурсы у внутренней промышленной программы. Влияние через порты не делает войну с Бразилией обязательной."
 aof_v03_arg_counterconference: "Равноправная конференция вместо первенства"
 aof_v03_arg_counterconference_desc: "Первенство Бразилии не обязывает нас отказываться от сотрудничества. Предложим равноправную конференцию независимым соседям: каждый вправе принять условия, предложить свои или отказаться."
 aof_v03_arg_counterdefence: "Оборона без чужого первенства"
 aof_v03_arg_counterdefence_desc: "Ответившие на нашу конференцию правительства получат отдельное предложение оборонительного союза. Участие в обсуждении не заменяет их согласия на военные обязательства."
 aof_v03_chi_entry1: "Согласовать ближайший фронт"
 aof_v03_chi_entry1_desc: "Ближайший фронт не должен поглощать спор о будущем страны. Соберём мандат для согласованных задач, прежде чем превращать объединение в обещание единоличного командования над всеми правительствами."
 aof_v03_chi_entry2: "Кому подчиняются гарнизоны?"
 aof_v03_chi_entry2_desc: "Приказы гарнизонам бесполезны без связей, позволяющих их исполнить. Укрепим внутреннюю инфраструктуру, пока гражданские и военные силы определяют, кому должно подчиняться общее снабжение."
 aof_v03_chi_entry3: "Разобрать иностранные обязательства"
 aof_v03_chi_entry3_desc: "Иностранная помощь несёт ожидания, которые нельзя скрыть словом «единство». Разберём обязательства и снимем исходную неустойчивость, чтобы следующий выбор делала страна, а не список её внешних покровителей."
 aof_v03_chi_agreement1: "Конференция региональных правительств"
 aof_v03_chi_agreement1_desc: "Конференция региональных правительств. Объединение требует согласия региональных правительств. Общие пошлины, снабжение и дипломатия создают республику без обязательного подчинения одному генералу."
 aof_v03_chi_agreement2: "Общие пошлины и снабжение"
 aof_v03_chi_agreement2_desc: "Общие пошлины и снабжение. Объединение требует согласия региональных правительств. Общие пошлины, снабжение и дипломатия создают республику без обязательного подчинения одному генералу."
 aof_v03_chi_agreement3: "Конституция объединения"
 aof_v03_chi_agreement3_desc: "Конституция объединения. Объединение требует согласия региональных правительств. Общие пошлины, снабжение и дипломатия создают республику без обязательного подчинения одному генералу."
 aof_v03_chi_agreement4: "Одна дипломатия без одного генерала"
 aof_v03_chi_agreement4_desc: "Одна дипломатия без одного генерала. Объединение требует согласия региональных правительств. Общие пошлины, снабжение и дипломатия создают республику без обязательного подчинения одному генералу."
 aof_v03_chi_army1: "Общий штаб"
 aof_v03_chi_army1_desc: "Общий штаб. Единый штаб прекращает независимые каналы оружия, но поход создаёт новые обязательства и конфликты. После военного приоритета остаётся выбор гражданского правительства или постоянного командования."
 aof_v03_chi_army2: "Отрезать независимые каналы оружия"
 aof_v03_chi_army2_desc: "Отрезать независимые каналы оружия. Единый штаб прекращает независимые каналы оружия, но поход создаёт новые обязательства и конфликты. После военного приоритета остаётся выбор гражданского правительства или постоянного командования."
 aof_v03_chi_army3: "Поход на неподчиняющиеся центры"
 aof_v03_chi_army3_desc: "Поход на неподчиняющиеся центры. Единый штаб прекращает независимые каналы оружия, но поход создаёт новые обязательства и конфликты. После военного приоритета остаётся выбор гражданского правительства или постоянного командования."
 aof_v03_chi_land1: "Соглашение с сельскими движениями"
 aof_v03_chi_land1_desc: "Соглашение с сельскими движениями. Сельские движения дают государству поддержку и внутреннее снабжение. Местная реформа собственности может закончиться социальной республикой или революционной властью — это разные решения."
 aof_v03_chi_land2: "Местная реформа собственности"
 aof_v03_chi_land2_desc: "Местная реформа собственности. Сельские движения дают государству поддержку и внутреннее снабжение. Местная реформа собственности может закончиться социальной республикой или революционной властью — это разные решения."
 aof_v03_chi_land3: "Снабжение изнутри страны"
 aof_v03_chi_land3_desc: "Снабжение изнутри страны. Сельские движения дают государству поддержку и внутреннее снабжение. Местная реформа собственности может закончиться социальной республикой или революционной властью — это разные решения."
 aof_v03_chi_army_civil: "Гражданское правительство после объединения"
 aof_v03_chi_army_civil_desc: "Единый штаб не обязан оставаться единственным источником власти. Завершим военный переход и вернём выборное гражданское правительство: армия должна защищать государство, которым больше не управляет бессрочно."
 aof_v03_chi_army_state: "Государство командования"
 aof_v03_chi_army_state_desc: "Командование может закрепить свой приоритет постоянным оборонным заказом. Военная опора государства усилится, но требование гражданского контроля после объединения останется без ответа."
 aof_v03_chi_social: "Социальная республика"
 aof_v03_chi_social_desc: "Сельская реформа может завершиться парламентским социальным договором. Выборное социал-демократическое правительство должно удерживать поддержку общин работой учреждений, а не бесконечным чрезвычайным призывом."
 aof_v03_chi_revolution: "Революционная власть"
 aof_v03_chi_revolution_desc: "Сельская мобилизация может поддержать революционную власть вместо парламентского компромисса. Источник полномочий и правила участия изменятся; общий мандат ещё придётся превратить в исполнимую государственную работу."
 aof_v03_chi_foreign_price: "Единство не за чужую цену"
 aof_v03_chi_foreign_price_desc: "Объединение на чужих условиях оставит самостоятельность нерешённым вопросом. Рассмотрим предел допустимой помощи и внешнего присутствия: собственная власть должна отвечать за цену будущего договора."
