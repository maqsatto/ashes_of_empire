 aof_v03_pacific.1.t: "Профессор хочет домой"
 aof_v03_pacific.1.d: "Специалист, приехавший во время войны, хочет возглавить восстанавливаемый европейский институт. Здесь уже работают его ученики. Сохранить исключительность, создать партнёрство или довериться собственной школе?"
 aof_v03_pacific.1.a: "Удержать крупным заказом."
 aof_v03_pacific.1.b: "Создать партнёрский институт."
 aof_v03_pacific.1.c: "Назначить подготовленного ученика."
 aof_v03_pacific.2.t: "Приказа из столицы не было"
 aof_v03_pacific.2.d: "Поддерживаемая группировка захватила участок китайской дороги и объявила, что действует ради Японии. Армейские покровители требуют признания; гражданские чиновники опасаются эскалации. Признание не даёт нам чужую территорию."
 aof_v03_pacific.2.a: "Осудить самовольные действия."
 aof_v03_pacific.2.b: "Добиваться смешанного расследования."
 aof_v03_pacific.2.c: "Признать результат."
 aof_v03_pacific.3.t: "Мир предъявляет счёт"
 aof_v03_pacific.3.d: "Последняя оплаченная военная накладная лежит на столе кабинета. Деньги и специалисты остаются в стране, но прежние заказы заканчиваются. Конверсия промышленности, спор о прибыли и выбор внешних обязательств определят нашу республику. Наука, танки и флот доступны независимо от политического курса."
 aof_v03_pacific.3.a: "Открыть счета мирного времени."
 aof_v03_pacific.4.t: "Два протектората, две цены"
 aof_v03_pacific.4.d: "Маньчжурская администрация требует промышленных вложений, Владивосток — торгового будущего, флот — средств на морские связи, а полевые командования — свободы действий. Это разные договоры и разные общества. Кабинету предстоит выбрать устойчивую сферу, материковый мандат или морской приоритет."
 aof_v03_pacific.4.a: "Свести требования перед кабинетом."
 aof_v03_pacific.10.t: "Общественный договор достатка"
 aof_v03_pacific.10.d: "Реформы создали широкую образовательную и гражданскую базу. Сохранить социально-либеральную республику или передать мандат парламентской социал-демократии? Ни один вариант не отменяет выборы."
 aof_v03_pacific.10.a: "Социальный либерализм и гражданские гарантии."
 aof_v03_pacific.10.b: "Парламентский социал-демократический мандат."
 aof_v03_pacific.11.t: "Пределы президентской власти"
 aof_v03_pacific.11.d: "Полушарная стратегия требует долговременной власти, но не определяет её форму. Конституционный кабинет сохранит контроль парламента. Чрезвычайное президентское правление отменит выборы и вызовет сопротивление."
 aof_v03_pacific.11.a: "Конституционный консервативный кабинет."
 aof_v03_pacific.11.b: "Чрезвычайная президентская диктатура."
 aof_v03_pacific.12.t: "Кто контролирует долгие контракты?"
 aof_v03_pacific.12.d: "Долгосрочные соглашения дают корпорациям общественный вес. Сохранить выборный надзор или передать управление неподотчётному корпоративному кабинету? Последнее — отдельный авторитарный выбор, а не неизбежный итог рынка."
 aof_v03_pacific.12.a: "Договоры под надзором выборной республики."
 aof_v03_pacific.12.b: "Корпоративный кабинет без парламентского вето."
 aof_v03_pacific.13.t: "Кабинет договорной сферы"
 aof_v03_pacific.13.d: "Отношения с протекторатами не заменяют внутреннюю конституцию. Стабильная договорная сфера может опираться на консервативную парламентскую преемственность либо на либеральный гражданский мандат. Монархическая форма сама по себе не отменяется."
 aof_v03_pacific.13.a: "Парламентская преемственность."
 aof_v03_pacific.13.b: "Либеральный гражданский мандат."
 aof_v03_pacific.14.t: "Мандат или национальная миссия?"
 aof_v03_pacific.14.d: "Прямое доминирование требует всё новых обязательств. Военное правительство может сохранить ограниченный мандат или провозгласить экспансионистскую национальную миссию, ускорив мобилизацию ценой общественной устойчивости."
 aof_v03_pacific.14.a: "Сохранить военное правление без новой доктрины."
 aof_v03_pacific.14.b: "Экспансионистская национальная миссия."
