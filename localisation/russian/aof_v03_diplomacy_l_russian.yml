 aof_diplomacy.70.t: "Каспийская конвенция"
 aof_diplomacy.70.d: "Условия морского коридора требуют согласия обеих сторон. Обычный транзит, оборонные гарантии и отказ дают разные последствия. Соглашение само не создаёт морской путь на карте."
 aof_diplomacy.70.a: "Принять договор с взаимными обязательствами."
