 aof_diplomacy.81.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.90.t: "Условия южноамериканской конференции"
 aof_diplomacy.90.d: "Инициатор предлагает общий договор. Можно вступить на равных, требовать пересмотра условий или остаться вне проекта. Отказ не объявляет войну."
 aof_diplomacy.90.a: "Присоединиться как равноправный участник."
 aof_diplomacy.90.b: "Требовать равноправного пересмотра."
 aof_diplomacy.90.c: "Не признавать чужого первенства."
 aof_diplomacy.100.t: "Возврат научной школы"
 aof_diplomacy.100.d: "Восстановленный европейский институт приглашает специалиста домой. Его ученики уже работают у нас. Сохранить исключительное преимущество, создать совместную кафедру или поддержать передачу опыта?"
 aof_diplomacy.100.a: "Удержать специалиста новым заказом."
 aof_diplomacy.100.b: "Создать совместный институт."
 aof_diplomacy.100.c: "Передать руководство подготовленным ученикам."
 aof_diplomacy.110.t: "Конец военного устава"
 aof_diplomacy.110.d: "Коммерческое государство просит поддержки нового гражданского соглашения. Это предложение будущего партнёрства, а не утверждение, что США были его прежним покровителем."
 aof_diplomacy.110.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.110.b: "Предложить ограниченный компромисс."
 aof_diplomacy.110.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.120.t: "Предложение о взаимной обороне"
 aof_diplomacy.120.d: "Инициатор предлагает добровольный оборонный союз. Принятие создаёт общий блок, но не передаёт территории или власть. Отказ сохраняет независимость и оставляет торговое сотрудничество возможным."
 aof_diplomacy.120.a: "Принять взаимные оборонные обязательства."
 aof_diplomacy.120.b: "Только торговля и ненападение."
 aof_diplomacy.120.c: "Сохранить самостоятельную оборону."
 aof_diplomacy.130.t: "Условия перемирия"
 aof_diplomacy.130.d: "Другая сторона предлагает прекратить текущую войну без обязательного поглощения. Перемирие сохраняет государства и открывает послевоенный курс. Можно предпочесть продолжение войны."
 aof_diplomacy.130.a: "Прекратить огонь и заключить мир."
 aof_diplomacy.130.b: "Продолжать войну."
 aof_diplomacy.140.t: "Запрос помощи Пакистану"
 aof_diplomacy.140.d: "Пакистан просит ограниченную партию вооружения. Поставка не делает нас участником войны; прямое вмешательство не утверждено исходной историей."
 aof_diplomacy.140.a: "Отправить оружие и инструкторов."
 aof_diplomacy.140.b: "Ограничиться дипломатической поддержкой."
 aof_diplomacy.140.c: "Отказать в новой поставке."
 aof_diplomacy.150.t: "Китайское соглашение без подчинения"
 aof_diplomacy.150.d: "Япония предлагает договор вместо прямого доминирования. Китай сохраняет правительство и территории; условия требуют собственного согласия."
 aof_diplomacy.150.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.150.b: "Предложить ограниченный компромисс."
 aof_diplomacy.150.c: "Отказать и сохранить самостоятельный курс."
