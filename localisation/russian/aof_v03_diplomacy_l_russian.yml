 aof_diplomacy.201.t: "Договор принят"
 aof_diplomacy.201.d: "Партнёр согласился на взаимные обязательства. Действуют показанные условия; независимость сторон сохраняется."
 aof_diplomacy.201.a: "Принять ответ."
 aof_diplomacy.202.t: "Найден ограниченный компромисс"
 aof_diplomacy.202.d: "Партнёр предложил более узкое сотрудничество. Оно оставляет пространство для будущего пересмотра вместо обязательного конфликта."
 aof_diplomacy.202.a: "Принять ответ."
 aof_diplomacy.203.t: "Предложение отклонено"
 aof_diplomacy.203.d: "Партнёр отказался. Решение не даёт нам чужой территории или права распоряжаться его политикой. Можно продолжать внутреннюю программу либо искать других партнёров."
 aof_diplomacy.203.a: "Принять ответ."
 aof_diplomacy.10.t: "Пересмотр нефтяных обязательств"
 aof_diplomacy.10.d: "Другая сторона предлагает пересмотреть сроки и компенсации нефтяного соглашения. Поддержка собственного курса не требует немедленной войны: можно принять переход, ограничить договор или отказаться."
 aof_diplomacy.10.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.10.b: "Предложить ограниченный компромисс."
 aof_diplomacy.10.c: "Отказать и сохранить самостоятельный курс."
