 aof_diplomacy.11.b: "Предложить ограниченный компромисс."
 aof_diplomacy.11.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.20.t: "Промышленное партнёрство с Алаш"
 aof_diplomacy.20.d: "Станки и обучение ускорят развитие, но исключительный договор создаёт обязательства. Получатель сохраняет право отказа и возможность собственной программы."
 aof_diplomacy.20.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.20.b: "Предложить ограниченный компромисс."
 aof_diplomacy.20.c: "Отказать и сохранить самостоятельный курс."
