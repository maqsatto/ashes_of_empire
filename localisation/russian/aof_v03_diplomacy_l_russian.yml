 aof_diplomacy.80.t: "Сибирский выход к портам"
 aof_diplomacy.80.d: "Сухопутный коридор и открытый порт могут связать соседей без объединения государств. Японская зависимость порта остаётся отдельным вопросом."
 aof_diplomacy.80.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.80.b: "Предложить ограниченный компромисс."
 aof_diplomacy.80.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.81.t: "Сибирский выход к портам"
 aof_diplomacy.81.d: "Сухопутный коридор и открытый порт могут связать соседей без объединения государств. Японская зависимость порта остаётся отдельным вопросом."
