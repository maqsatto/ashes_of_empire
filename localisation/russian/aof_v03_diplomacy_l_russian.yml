 aof_diplomacy.40.t: "Пересмотр полномочий зависимого правительства"
 aof_diplomacy.40.d: "Правительство просит больше самостоятельности. Можно признать независимость под договорными гарантиями, сохранить защиту с местными правами или отказать. Изменение Маньчжурии не меняет автоматически статус Владивостока."
