 aof_diplomacy.60.t: "Тихоокеанская разрядка"
 aof_diplomacy.60.d: "Предлагается сотрудничество по морской безопасности без передачи островов, баз или права командовать чужим флотом."
 aof_diplomacy.60.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.60.b: "Предложить ограниченный компромисс."
 aof_diplomacy.60.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.61.t: "Тихоокеанская разрядка"
 aof_diplomacy.61.d: "Предлагается сотрудничество по морской безопасности без передачи островов, баз или права командовать чужим флотом."
 aof_diplomacy.61.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.61.b: "Предложить ограниченный компромисс."
 aof_diplomacy.61.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.70.t: "Каспийская конвенция"
 aof_diplomacy.70.d: "Условия морского коридора требуют согласия обеих сторон. Обычный транзит, оборонные гарантии и отказ дают разные последствия. Соглашение само не создаёт морской путь на карте."
 aof_diplomacy.70.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.70.b: "Предложить ограниченный компромисс."
 aof_diplomacy.70.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.71.t: "Каспийская конвенция"
 aof_diplomacy.71.d: "Условия морского коридора требуют согласия обеих сторон. Обычный транзит, оборонные гарантии и отказ дают разные последствия. Соглашение само не создаёт морской путь на карте."
 aof_diplomacy.71.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.71.b: "Предложить ограниченный компромисс."
 aof_diplomacy.71.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.72.t: "Конвенция перед испытанием войной"
 aof_diplomacy.72.d: "Алаш, уже участвующий в войне, просит подтвердить проход через кавказский канал. Договор не обязывает Кавказ вступать в войну. Можно сохранить проход, потребовать оплату охраны или закрыть маршрут для этой воюющей стороны. Закрытие касается и её конвоев; сухопутная программа остаётся доступной."
 aof_diplomacy.72.a: "Соблюдать конвенцию, сохраняя нейтралитет."
 aof_diplomacy.72.b: "Пропускать при оплате охраны маршрута."
 aof_diplomacy.72.c: "Закрыть проход для воюющей стороны."
 aof_diplomacy.80.t: "Сибирский выход к портам"
 aof_diplomacy.80.d: "Сухопутный коридор и открытый порт могут связать соседей без объединения государств. Японская зависимость порта остаётся отдельным вопросом."
 aof_diplomacy.80.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.80.b: "Предложить ограниченный компромисс."
 aof_diplomacy.80.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.81.t: "Сибирский выход к портам"
 aof_diplomacy.81.d: "Сухопутный коридор и открытый порт могут связать соседей без объединения государств. Японская зависимость порта остаётся отдельным вопросом."
 aof_diplomacy.81.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.81.b: "Предложить ограниченный компромисс."
 aof_diplomacy.81.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.90.t: "Условия южноамериканской конференции"
 aof_diplomacy.90.d: "Инициатор предлагает общий договор. Можно вступить на равных, требовать пересмотра условий или остаться вне проекта. Отказ не объявляет войну."
 aof_diplomacy.90.a: "Присоединиться как равноправный участник."
 aof_diplomacy.90.b: "Требовать равноправного пересмотра."
 aof_diplomacy.90.c: "Не признавать чужого первенства."
 aof_diplomacy.100.t: "Возврат научной школы"
 aof_diplomacy.100.d: "Восстановленный европейский институт приглашает специалиста домой. Его ученики уже работают у нас. Сохранить исключительное преимущество, создать совместную кафедру или поддержать передачу опыта?"
 aof_diplomacy.100.a: "Удержать специалиста новым заказом."
 aof_diplomacy.100.b: "Создать совместный институт."
 aof_diplomacy.100.c: "Передать руководство подготовленным ученикам."
 aof_diplomacy.110.t: "Конец военного устава"
 aof_diplomacy.110.d: "Коммерческое государство просит поддержки нового гражданского соглашения. Это предложение будущего партнёрства, а не утверждение, что США были его прежним покровителем."
 aof_diplomacy.110.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.110.b: "Предложить ограниченный компромисс."
 aof_diplomacy.110.c: "Отказать и сохранить самостоятельный курс."
 aof_diplomacy.120.t: "Предложение о взаимной обороне"
 aof_diplomacy.120.d: "Инициатор предлагает добровольный оборонный союз. Принятие создаёт общий блок, но не передаёт территории или власть. Отказ сохраняет независимость и оставляет торговое сотрудничество возможным."
 aof_diplomacy.120.a: "Принять взаимные оборонные обязательства."
 aof_diplomacy.120.b: "Только торговля и ненападение."
 aof_diplomacy.120.c: "Сохранить самостоятельную оборону."
 aof_diplomacy.130.t: "Условия перемирия"
 aof_diplomacy.130.d: "Другая сторона предлагает прекратить текущую войну без обязательного поглощения. Перемирие сохраняет государства и открывает послевоенный курс. Можно предпочесть продолжение войны."
 aof_diplomacy.130.a: "Прекратить огонь и заключить мир."
 aof_diplomacy.130.b: "Продолжать войну."
 aof_diplomacy.140.t: "Запрос помощи Пакистану"
 aof_diplomacy.140.d: "Пакистан просит ограниченную партию вооружения. Поставка не делает нас участником войны; прямое вмешательство не утверждено исходной историей."
 aof_diplomacy.140.a: "Отправить оружие и инструкторов."
 aof_diplomacy.140.b: "Ограничиться дипломатической поддержкой."
 aof_diplomacy.140.c: "Отказать в новой поставке."
 aof_diplomacy.150.t: "Китайское соглашение без подчинения"
 aof_diplomacy.150.d: "Япония предлагает договор вместо прямого доминирования. Китай сохраняет правительство и территории; условия требуют собственного согласия."
 aof_diplomacy.150.a: "Принять договор с взаимными обязательствами."
 aof_diplomacy.150.b: "Предложить ограниченный компромисс."
 aof_diplomacy.150.c: "Отказать и сохранить самостоятельный курс."
 aof_v03_far_eastern_rights: "Расширение дальневосточных полномочий"
 aof_diplomacy.160.t: "Предложение общей федерации"
 aof_diplomacy.160.d: "Партнёр по оборонному союзу предлагает объединить территории и учреждения. Принятие завершит отдельное существование нашей страны: земли и войска перейдут инициатору. Игрок этой страны потеряет отдельное управление. Национальные права передаются только на наших собственных национальных землях. Можно вместо объединения сохранить союз самостоятельных государств."
 aof_diplomacy.160.a: "Принять объединение и передать отдельное управление."
 aof_diplomacy.160.b: "Сохранить союз самостоятельных государств."
 aof_diplomacy.160.c: "Не менять существующие договоры."
 aof_voluntary_federation: "Федерация республик"
