 aof_v03_reopen_canal: "Возобновить общее судоходство"
 aof_v03_reopen_canal_desc: "После чрезвычайного закрытия восстановить проход для разрешённых стран. Запрет отдельному участнику конвенции и обычные правила военного доступа продолжают действовать."
 aof_v03_restore_kaz_passage: "Восстановить проход для Алаш"
 aof_v03_restore_kaz_passage_desc: "После окончания войны Алаш вернуть предусмотренный конвенцией проход его кораблям и торговым конвоям. Общее чрезвычайное закрытие канала отменяется отдельным решением."
