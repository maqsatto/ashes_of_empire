 aof_diplomacy.170.t: "Просьба о внешней защите"
 aof_diplomacy.170.d: "Коммерческое государство предлагает новые отношения защиты. Мы можем предложить протекторат, гарантировать независимость или отказаться. Передача самостоятельности требует отдельного окончательного согласия его правительства."
 aof_diplomacy.170.a: "Предложить протекторат на окончательное утверждение."
 aof_diplomacy.170.b: "Дать гарантию без подчинения."
 aof_diplomacy.170.c: "Не принимать новых обязательств."
 aof_diplomacy.172.t: "Последнее слово принадлежит нашему правительству"
 aof_diplomacy.172.d: "США согласились предложить внешнюю защиту. Протекторат сохранит нашу страну, но передаст часть внешней самостоятельности американскому покровителю. Можно утвердить только гарантию независимости или оставить собственную оборону. Никакое решение иностранного кабинета не заменяет нашего согласия."
 aof_diplomacy.172.a: "Утвердить протекторат: мы станем зависимым государством."
 aof_diplomacy.172.b: "Принять только гарантию независимости."
 aof_diplomacy.172.c: "Сохранить самостоятельную оборону."
 aof_diplomacy.171.t: "Заказы после окончания войны"
 aof_diplomacy.171.d: "Коммерческая администрация предлагает продолжить поставки уже для мирного рынка. Долгий заказ требует расходов американского бюджета; короткий контракт оставляет больше риска поставщику. Это закупки, а не иностранная опека."
 aof_diplomacy.171.a: "Утвердить двухлетний заказ."
 aof_diplomacy.171.b: "Предложить только переходный годовой контракт."
 aof_diplomacy.171.c: "Отказаться от нового заказа."
 aof_diplomacy.180.t: "Посредник по вопросу военного устава"
 aof_diplomacy.180.d: "Североафриканское содружество предлагает посредничество между администрацией, жителями и поставщиками. Посредник не назначает нам правительство. Принятие открывает совместную подготовку мирных производств; отказ оставляет внутренний спор за нашими учреждениями."
 aof_diplomacy.180.a: "Принять посредничество и обмен специалистами."
 aof_diplomacy.180.b: "Провести переговоры своими силами."
 aof_diplomacy.181.t: "Предложение помощи Содружества"
 aof_diplomacy.181.d: "Содружество предлагает помощь стране, уже участвующей в африканской войне. Мы определим, нужна ли гражданская поддержка или оружие; затем его кабинет решит, может ли выполнить запрос. Оружие и гарантии означают иной внешнеполитический выбор, чем нейтральное посредничество."
 aof_diplomacy.181.a: "Запросить гражданскую помощь."
 aof_diplomacy.181.b: "Запросить оружие и политическую защиту."
 aof_diplomacy.181.c: "Отказаться от внешней помощи."
 aof_diplomacy.182.t: "Посредничество соседней республики"
 aof_diplomacy.182.d: "Алаш предлагает площадку для переговоров о будущем Туркестана. Сохранение общих учреждений и договорённый раздел остаются нашим собственным выбором. Сосед может поддержать переговоры, но не разделить страну своим указом."
 aof_diplomacy.182.a: "Принять площадку и созвать собственных представителей."
 aof_diplomacy.182.b: "Обсудить будущее без внешнего посредника."
 aof_diplomacy.190.t: "Сибирский договор и японская гарантия"
 aof_diplomacy.190.d: "Сибирь предлагает торговое сотрудничество и поддерживает расширение местных полномочий. Пока действует японская опека, изменение её условий требует ответа Японии. Независимое правительство может заключить договор самостоятельно."
 aof_diplomacy.190.a: "Согласиться на торговлю и запросить пересмотр опеки."
 aof_diplomacy.190.b: "Сохранить прежние условия."
 aof_diplomacy.191.t: "Цена дальневосточной самостоятельности"
 aof_diplomacy.191.d: "Дальневосточное правительство просит согласовать торговлю с Сибирью и пересмотреть японскую гарантию. Можно признать самостоятельность, расширить местные права или оставить военную опеку. Независимость не означает передачи страны Сибири."
 aof_diplomacy.191.a: "Признать самостоятельность и сохранить торговый договор."
 aof_diplomacy.191.b: "Допустить торговлю и расширить местные полномочия."
 aof_diplomacy.191.c: "Оставить военную гарантию без изменений."
 aof_diplomacy.91.t: "Встречное предложение равных условий"
 aof_diplomacy.91.d: "Приглашённое правительство согласно обсуждать конференцию без признания чужого первенства. Принятие пересматривает наши двусторонние условия; другие приглашённые сохраняют собственное решение. Отказ позволяет партнёру созвать альтернативную мирную конференцию."
 aof_diplomacy.91.a: "Принять равноправный формат."
 aof_diplomacy.91.b: "Не пересматривать предложенные условия."
 aof_diplomacy.183.t: "Договор о взаимном невмешательстве"
 aof_diplomacy.183.d: "Алаш предлагает признать самостоятельность сторон и отказаться от нападения. Это договор, а не вступление в общий военный блок. Согласие сохраняет разные общественные системы; отказ не даёт нам чужих земель."
 aof_diplomacy.183.a: "Подписать договор о ненападении."
 aof_diplomacy.183.b: "Не связывать кабинет новым договором."
