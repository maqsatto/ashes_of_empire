l_russian:
 aof_debug_caspian_fixture: "Тест Каспия: флот и канал"
 aof_debug_caspian_fixture_desc: "Только отладка. Не исторический стартовый флот. Появление решения и запрос загрузки не доказывают работоспособность: проверьте корабль, базу, маршрут и журнал."
 aof_debug_caspian_ship_kaz: "Тест: один эсминец у базы 1517"
 aof_debug_caspian_ship_kaz_desc: "Однократно запросить один ранний тестовый эсминец KAZ у принадлежащей и подконтрольной базы 1517. Режим MTG создаёт модульный эскорт; без DLC используется ранний обычный эсминец. Решение даёт только необходимые ранние технологии и корабль. Флаг означает запрос, не подтверждение появления. Это не канон и не проверка судоходства."
 aof_debug_caspian_ship_cau: "Тест: один эсминец у базы 3668"
 aof_debug_caspian_ship_cau_desc: "Однократно запросить один ранний тестовый эсминец CAU у принадлежащей и подконтрольной базы 3668. Режим MTG создаёт модульный эскорт; без DLC используется ранний обычный эсминец. Решение даёт только необходимые ранние технологии и корабль. Флаг означает запрос, не подтверждение появления. Это не канон и не проверка судоходства."
 aof_debug_caspian_convoys: "Тест: 20 конвоев для торгового маршрута"
 aof_debug_caspian_convoys_desc: "Однократное отладочное пополнение. Затем оформите настоящий импорт и проверьте линию маршрута, расход конвоев и порт. Не подтверждает судоходство автоматически."
 aof_debug_caspian_close_canal: "Тест: закрыть канал — сейчас открыт"
 aof_debug_caspian_close_canal_desc: "Изменяет только отладочный флаг закрытия нативного прохода. Все 31 провинций коридора должны принадлежать и подчиняться Кавказу. Статус названия отражает флаг, а не проверенный маршрут. После изменения проверьте фактическое прохождение флота и торговли."
 aof_debug_caspian_open_canal: "Тест: открыть канал — сейчас закрыт"
 aof_debug_caspian_open_canal_desc: "Изменяет только отладочный флаг закрытия нативного прохода. Все 31 провинций коридора должны принадлежать и подчиняться Кавказу. Статус названия отражает флаг, а не проверенный маршрут. После изменения проверьте фактическое прохождение флота и торговли."
