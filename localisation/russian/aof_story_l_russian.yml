l_russian:
 aof_kaz.1.t: "Хрупкий мир"
 aof_kaz.1.d: "Великая война 1914–1924 годов завершилась. Казахстан вступает в этот неопределённый мир самостоятельной страной. Его значительный ресурсный потенциал остаётся недостаточно освоенным. Государственное управление, транспорт и практическое образование заложат основу будущего развития."
 aof_kaz.1.a: "Приступим к работе."
 aof_kaz.2.t: "Перед первыми вложениями"
 aof_kaz.2.d: "Одного ресурсного потенциала недостаточно для снабжения мастерских. Перед крупными добывающими проектами нужны обследования, подготовка специалистов и транспорт. Первые результаты помогут промышленным исследованиям."
 aof_kaz.2.a: "Поддержать промышленные исследования."
 aof_kaz.3.t: "Первая программа развития"
 aof_kaz.3.d: "Подготовительная работа завершена. Ограниченные средства требуют ясного приоритета: гражданские предприятия для долгосрочного роста или оружейное производство для снабжения армии. Оба пути служат самостоятельному развитию."
 aof_kaz.3.a: "Расширить гражданское производство."
 aof_kaz.3.b: "Снабдить собственную армию."
 aof_kaz.4.t: "Основа будущего"
 aof_kaz.4.d: "Первая программа объединила работу учреждений, подготовку специалистов и производство. Независимость получила более прочную материальную основу. Мир за нашими границами остаётся неопределённым; дальнейшее развитие — наша следующая задача."
 aof_kaz.4.a: "Продолжить созидание."
 aof_technical_network: "Научная сеть"
 aof_technical_network_desc: "Сотрудничество технических школ и мастерских помогает практическим исследованиям."
 aof_production_standards_spirit: "Производственные стандарты"
 aof_production_standards_spirit_desc: "Единые стандарты улучшают выпуск снаряжения."
 aof_resource_survey: "Обследование ресурсов"
 aof_capital_civilian_factory: "Добавляет одну ячейку строительства и одну гражданскую фабрику в столичной области."
 aof_capital_military_factory: "Добавляет одну ячейку строительства и один военный завод в столичной области."
 aof_capital_infrastructure: "Добавляет один уровень инфраструктуры в столичной области."
