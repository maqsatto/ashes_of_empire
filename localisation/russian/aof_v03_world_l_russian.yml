 AOF_BROKEN_PEACE_NAME: "Хрупкий мир: 1924"
 AOF_BROKEN_PEACE_DESC: "Десять лет Великой войны истощили старые державы и дали новым государствам шанс на самостоятельность. Европа ищет путь к восстановлению, США решают судьбу военной прибыли, Япония — будущее своей сферы влияния. Молодым республикам предстоит превратить независимость в работающие учреждения, промышленность и способность защищать свой выбор. Мир заключён, но его порядок ещё только предстоит создать."
 aof_world_KAZ_bookmark: "Независимость нужно построить. Свяжите центры Алаш дорогами, подготовьте учителей и инженеров, превратите известные недра в собственное машиностроение. Республика договора, земельный компромисс или чрезвычайный мандат определят внутренний курс; выбор промышленных партнёров и внешних маршрутов — цену самостоятельности."
 aof_world_SIB_bookmark: "Огромной стране нужно общее расписание. Восстановите магистраль, договоритесь с регионами и найдите надёжный выход к внешним рынкам. Постройте гражданскую Сибирь, предложите российским республикам добровольный договор или доверьте охрану коммуникаций военной директории."
 aof_world_CAU_bookmark: "Стратегический путь делает федерацию нужной соседям и уязвимой перед их требованиями. Разделите полномочия и доходы между участниками или укрепите единый центр. Собственная охрана и ясные правила транзита должны позволить Кавказу торговать, не превращаясь в чужую базу."
 aof_world_TRK_bookmark: "Общий союз нуждается в новом договоре участников. Определите полномочия местных правительств, согласуйте оборону и решите, что удерживает страну вместе. Можно укрепить союз или договориться о мирном разделе, сохранив правопреемственный кабинет в Ташкенте."
 aof_world_NAF_bookmark: "Общая победа над колониальным угнетением ещё должна стать повседневной свободой. Восстановите дороги, школы и гражданское управление, сохраняя равноправие участников. Защищённый нейтралитет и посредничество дадут содружеству собственный голос, но просьбы о военной помощи испытают пределы этого курса."
 aof_world_CMT_bookmark: "Страну создали для военных поставок, но война закончилась. Кто теперь представляет её жителей и кому служат склады, дороги и предприятия? Постройте гражданскую республику, сохраните коммерческий устав или ищите внешнюю гарантию — каждый путь потребует расплатиться по старым обязательствам."
 aof_world_FER_bookmark: "Владивосток может стать торговыми воротами между соперниками, а не только военным плацдармом. Подготовьте собственные кадры, расширьте связи с Сибирью и пересмотрите условия японской гарантии. Договорная самостоятельность требует встречного согласия; отказ оставляет выбор нового курса за местным правительством."
 aof_world_USA_bookmark: "Кому достанется прибыль десятилетия войны? Превратите научное и промышленное преимущество в гражданский достаток, долгие внешние контракты или влияние в Западном полушарии. Споры о труде, крупных корпорациях и пределах президентской власти определят, какой республикой станет Америка после войны."
 aof_world_JAP_bookmark: "Две зависимости, два договора и всё новые требования командования. Выберите устойчивую договорную сферу, материковый военный мандат или морской приоритет. Отношения с Маньчжурией, Владивостоком и китайскими правительствами покажут, способна ли империя удерживать влияние без бесконечного расширения обязательств."
 aof_world_SOV_bookmark: "Революция должна научиться жить. Гражданская война закончилась, но хозяйство и государственные учреждения ещё несут её наследие. Сделайте ставку на жизнеспособную республику, предложите соседям добровольный союз или вернитесь к внешнему революционному давлению — и определите место местных советов в новой системе."
 aof_world_MEX_bookmark: "Нефть принадлежит земле, но кто пишет договор? Согласуйте земельную реформу, права труда и условия иностранного заказа. Предсказуемый пересмотр контрактов, собственная переработка или офицерское собирание государства дадут разные ответы; спор с США допускает компромисс, но не гарантирует его."
 aof_world_BRA_bookmark: "Экспорт принёс доход, но ещё не объединил республику. Свяжите внутренние рынки и решите, кому служит федеральное правительство: гражданам, программе офицерской модернизации или договору регионов. На южноамериканской конференции предложите равноправную оборону либо попытайтесь установить собственные правила."
 aof_world_ARG_bookmark: "Накормить мир недостаточно, чтобы влиять на него. Когда старый покупатель слабеет, экспортную выручку можно направить в переработку и машины, лигу равных республик или южноатлантический флот. Сотрудничество с Бразилией остаётся возможным, но первенство на континенте не принадлежит никому по праву."
 aof_world_CHI_bookmark: "Единство не должно достаться за чужую цену. Согласуйте фронт и снабжение, разберите иностранные обязательства и определите отношения с региональными правительствами. Договорная республика, единая армия или земельная реформа предлагают разные дороги к общему государству."
 aof_world_MAN_bookmark: "Промышленность и железные дороги дают возможности, но условия японской опеки ограничивают самостоятельность. Подготовьте местных специалистов и собственную промышленную службу, затем обсудите полномочия гарнизонов. Договор о правах правительства должен стать реальным соглашением, а не обещанием покровителя."
 aof_world_RAJ_bookmark: "Война с Пакистаном требует снабжения фронта, но не должна навсегда определять устройство Индии. Удержите гражданское управление, проверьте условия перемирия и решите, какие обязательства страна готова принять после войны. Мир возможен лишь при встречном согласии."
 aof_world_PAK_bookmark: "Выживание не должно означать постоянную опеку. Свяжите армию с тылом, согласуйте помощь Ирана и Афганистана и выработайте общие правила снабжения. Добейтесь самостоятельного мира с Индией или подготовьте региональное оборонное сотрудничество."
 aof_world_FIN_bookmark: "Контроль над Карелией требует повседневного управления, а не только пограничных частей. Дайте местным общинам представительство, восстановите дороги и школы и укрепите признанную границу. Финляндия может защищать свои интересы, не превращая соседство с Россией в обязательную новую войну."
