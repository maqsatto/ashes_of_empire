 aof_v03_regions.38.t: "Предмет спора: Чако"
 aof_v03_regions.38.d: "Спор касается только установленной области 688, Чако-Бореаль: она принадлежит Парагваю, а национальные права имеют обе стороны. Аргентинская область 509 не входит в предложение. Предложим взаимное признание нынешнего владения без уничтожения национальных прав, либо попросим арбитраж. Ни одно решение здесь не меняет границы автоматически."
 aof_v03_regions.38.a: "Направить двустороннее предложение"
 aof_v03_regions.38.b: "Подготовить ограниченный военный вариант"
 aof_v03_regions.38.c: "Отложить спор без эскалации"
 aof_v03_regions.39.t: "Условия нефтяного заказа"
 aof_v03_regions.39.d: "Быстрый экспорт или подготовка собственной переработки?"
 aof_v03_regions.39.a: "Расширить экспортную концессию"
 aof_v03_regions.39.b: "Обучить местных техников"
 aof_v03_regions.41.t: "Долгая конституция"
 aof_v03_regions.41.d: "После подготовки гарантий парламент определяет общественный договор. Либеральный кабинет или консервативная преемственность сохраняют выборы."
 aof_v03_regions.41.a: "Либеральное правительство"
 aof_v03_regions.41.b: "Консервативный парламентский кабинет"
 aof_v03_regions.42.t: "Возвращение гражданского мандата"
 aof_v03_regions.42.d: "Чрезвычайные полномочия заканчиваются. Гражданское правительство будет отвечать перед избирателями."
 aof_v03_regions.42.a: "Консервативный гражданский кабинет"
 aof_v03_regions.42.b: "Либеральная конституция"
 aof_v03_regions.43.t: "Институт снова открывает двери"
 aof_v03_regions.43.d: "Восстановленный прикладной институт может пригласить домой специалиста, работающего в США или Японии. Принимающая держава сама решит, удержать его заказом, создать совместную кафедру или поддержать передачу опыта. Оплата предложения не гарантирует согласия."
 aof_v03_regions.43.a: "Пригласить из американской школы"
 aof_v03_regions.43.b: "Пригласить из японской школы"
 aof_v03_regions.43.c: "Сначала подготовить собственных учеников"
 aof_v03_regions.44.t: "Встречное предложение по Чако"
 aof_v03_regions.44.d: "Сосед предлагает признать нынешнего владельца области 688 и закончить кризис, сохранив национальные права сторон. Можно согласиться, попросить Аргентину провести арбитраж или отказать. Никто не передаёт нашу землю без нашего решения."
 aof_v03_regions.44.a: "Признать нынешнее владение и закончить кризис"
 aof_v03_regions.44.b: "Попросить независимый аргентинский арбитраж"
 aof_v03_regions.44.c: "Отказать и сохранить свободу действий"
 aof_v03_regions.45.t: "Чако: согласие двух правительств"
 aof_v03_regions.45.d: "Оба правительства согласились сохранить нынешнее владение областью 688 и завершить текущий кризис. Национальные права сторон не удалены. Война не началась, территории не переданы, Аргентинский Чако не затронут."
 aof_v03_regions.45.a: "Исполнять договор"
 aof_v03_regions.46.t: "Аргентинский арбитраж Чако"
 aof_v03_regions.46.d: "Одна из сторон просит предложить решение спора Боливии и Парагвая. Рекомендация сохранить нынешнее владение Чако-Бореаль вступит в силу только после отдельного согласия обоих правительств. Мы можем отказаться от посредничества."
 aof_v03_regions.46.a: "Предложить нынешнюю границу с сохранением национальных прав"
 aof_v03_regions.46.b: "Не принимать арбитражный мандат"
 aof_v03_regions.47.t: "Чако: пределы эскалации"
 aof_v03_regions.47.d: "Переговоры не обязывают нас воевать. Можно сохранить мир или подготовить ограниченную цель войны только против нынешнего боливийского либо парагвайского владельца области 688. Если область уже наша, такой цели нет: остаётся оборонная подготовка. Эта кнопка не объявляет войну и не обещает автоматического ограниченного мира после боёв."
 aof_v03_regions.47.a: "Сохранить мир и продолжить работу комиссии"
 aof_v03_regions.47.b: "Оформить цель войны только на область 688"
 aof_v03_regions.47.c: "Подготовить оборону без территориальной цели"
 aof_v03_regions.48.t: "Принять арбитраж по Чако?"
 aof_v03_regions.48.d: "Аргентина рекомендует сохранить нынешнее владение областью 688. Национальные права не стираются. Рекомендация становится договором только при согласии обоих правительств; отказ сохраняет нашу самостоятельность и не начинает войну."
 aof_v03_regions.48.a: "Принять рекомендацию при согласии соседа"
 aof_v03_regions.48.b: "Отказать в арбитражном решении"
 aof_v03_regions.49.t: "Предложение договорной независимости"
 aof_v03_regions.49.d: "Покровитель согласен отпустить нас. Принятие прекращает зависимость штатным эффектом и выводит нас из его блока, если мы в одном союзе. Оно не аннексирует страну и не завершает чужих войн. Можно сохранить нынешний статус."
 aof_v03_regions.49.a: "Принять независимость вне блока покровителя"
 aof_v03_regions.49.b: "Сохранить нынешний мандат"
 aof_v03_local_mandate: "Согласованное расширение местных полномочий"
 aof_v03_regions.50.t: "Финляндия предлагает признать границу"
 aof_v03_regions.50.d: "Финляндия просит признать её нынешнее владение Карелией, областями 215 и 216. Мы можем согласиться либо оставить вопрос открытым. Петроград не входит в предложение; никакие территории и национальные права не передаются этой кнопкой."
 aof_v03_regions.50.a: "Признать нынешнюю границу"
 aof_v03_regions.50.b: "Оставить вопрос открытым"
 aof_v03_regions.51.t: "Ответ по карельской границе"
 aof_v03_regions.51.d: "Сосед дал ответ. Признание улучшает отношения и устойчивость; отказ оставляет вопрос открытым и требует оборонной подготовки, но не начинает войну."
 aof_v03_regions.51.a: "Исполнять признанное соглашение"
 aof_v03_regions.51.b: "Готовить рубежи без новой войны"
 aof_v03_regions.52.t: "Предложить ограниченный мир по Чако"
 aof_v03_regions.52.d: "Подтвердим точные условия: область 688 закрепляется за её нынешним контролирующим государством, остальные занятые земли возвращаются прежним владельцам по белому миру. Вторая сторона должна явно согласиться; при изменении контроля до ответа условия устареют. Аргентинская область 509 не затрагивается."
 aof_v03_regions.52.a: "Предложить мир с областью 688 у Боливии"
 aof_v03_regions.52.b: "Предложить мир с областью 688 у Парагвая"
 aof_v03_regions.52.c: "Пока не направлять предложение"
 aof_v03_regions.53.t: "Принять ограниченный мир по Чако?"
 aof_v03_regions.53.d: "Противник предлагает закончить только двустороннюю войну. По выбранным условиям нынешний контролирующий участник получает область 688; другие занятые земли возвращаются владельцам. Национальные права сохраняются. Это реальный белый мир с единственным согласованным территориальным исключением. Можно отказаться. Если вмешалась третья страна, появился союз или изменился контроль, согласие недоступно."
 aof_v03_regions.53.a: "Принять: мир и область 688 у Боливии"
 aof_v03_regions.53.b: "Принять: мир и область 688 у Парагвая"
 aof_v03_regions.53.c: "Отказать или отозвать устаревшие условия"
 aof_v03_regions.54.t: "Ограниченный мир заключён"
 aof_v03_regions.54.d: "Правительства согласовали прекращение двусторонних боёв и владение Чако-Бореаль, областью 688. Другие области не аннексированы, национальные права не удалены. Дальнейшая политика остаётся нашим решением."
 aof_v03_regions.54.a: "Соблюдать согласованный мир"
 aof_v03_regions.55.t: "Канадские внешние полномочия"
 aof_v03_regions.55.d: "Независимая страна может заключать собственные соглашения. Зависимый кабинет сначала обращается к покровителю: местные полномочия и автономия не равны независимости. Отказ не мешает торговле и внутренней оборонной программе."
 aof_v03_regions.55.a: "Заключать собственные соседские соглашения"
 aof_v03_regions.55.b: "Обсудить полномочия с покровителем"
 aof_v03_regions.55.c: "Расширить торговлю при нынешнем статусе"
 aof_v03_core_projects: "Договорные проекты"
 aof_v03_core_projects_desc: "Выход из затянувшихся переговоров и ограниченные мирные предложения через штатные решения."
 aof_v03_domestic_investment_fallback: "Оплатить промышленный проект своими средствами"
 aof_v03_domestic_investment_fallback_desc: "Если ответа нет 30 дней либо партнёр исчез или стал противником, можно открыть внутреннее финансирование за 50 политической власти без иностранной концессии. Уже подписанный договор не дублируется."
 aof_v03_chaco_limited_peace_offer: "Чако: предложить ограниченный мир"
 aof_v03_chaco_limited_peace_offer_desc: "Только отдельная война независимых Боливии и Парагвая без фракций, иных противников, гражданской войны или конференции. Сначала явно подтвердим точного получателя области 688; затем противник принимает или отказывает. Контроль перепроверяется до белого мира и единственного согласованного переноса. Новая война автоматически не объявляется."
 aof_v03_chaco_withdraw_stale_offer: "Чако: отозвать ожидающее предложение"
 aof_v03_chaco_withdraw_stale_offer_desc: "Очистить только ожидающие условия, если переговоры устарели, началась другая война или противник не отвечает. Это не заключает мир и не передаёт землю. ИИ сохраняет действующее предложение до 30 дней, пока двусторонние условия не нарушены."
 aof_v03_cooperation: "Договорное сотрудничество"
