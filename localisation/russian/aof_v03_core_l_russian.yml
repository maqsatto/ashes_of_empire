 aof_v03_regions.1.t: "Инвестиционные переговоры"
 aof_v03_regions.1.d: "Выберем существующего партнёра, с которым нет войны. Он вправе отказать; тогда остаётся внутреннее финансирование без иностранной концессии. Если ответ пропадёт при изменении мира, через 30 дней доступно решение о собственных средствах."
 aof_v03_regions.1.a: "США"
 aof_v03_regions.1.b: "Япония"
 aof_v03_regions.1.c: "Собственные средства"
 aof_v03_regions.2.t: "Предложение совместного предприятия"
 aof_v03_regions.2.d: "Партнёр предлагает ограниченную концессию. Согласие не меняет границы и власть."
 aof_v03_regions.2.a: "Согласиться"
 aof_v03_regions.2.b: "Отказать"
 aof_v03_regions.3.t: "Переговоры прерваны"
 aof_v03_regions.3.d: "Внешнее предприятие не согласовано. Можно оплатить проект самим; иностранный договор и его двухлетние обязательства нам не приписываются."
 aof_v03_regions.3.a: "Внутренний капитал"
 aof_v03_regions.10.t: "Соглашение с соседом"
 aof_v03_regions.10.d: "Предложим мирное сотрудничество соседу, с которым нет войны."
 aof_v03_regions.10.a: "Направить предложение"
 aof_v03_regions.10.b: "Отложить"
 aof_v03_regions.11.t: "Конференция суверенных стран"
 aof_v03_regions.11.d: "Соседи получают приглашение. Отказ не является поводом для войны."
 aof_v03_regions.11.a: "Пригласить соседей"
 aof_v03_regions.12.t: "Взаимная оборона"
 aof_v03_regions.12.d: "Отправим предложение независимому соседу. Он сохраняет право отказа."
 aof_v03_regions.12.a: "Предложить добровольный союз"
 aof_v03_regions.12.b: "Подготовить собственную оборону"
 aof_v03_regions.13.t: "Приглашение к сотрудничеству"
 aof_v03_regions.13.d: "Сосед предлагает соглашение равных участников. Обязательного вступления в союз нет."
 aof_v03_regions.13.a: "Принять"
 aof_v03_regions.13.b: "Сохранить дистанцию"
 aof_v03_regions.20.t: "Полномочия зависимого кабинета"
 aof_v03_regions.20.d: "Покровитель должен сам ответить на требование расширить гражданские полномочия."
 aof_v03_regions.20.a: "Направить требование"
 aof_v03_regions.21.t: "Требование местного кабинета"
 aof_v03_regions.21.d: "Можно расширить местное управление со штатным ростом автономии, предложить согласованную независимость или сохранить мандат. Предложение независимости требует отдельного согласия зависимой страны и не прекращает чужих войн."
 aof_v03_regions.21.a: "Расширить полномочия и автономию"
 aof_v03_regions.21.b: "Предложить независимость вне нашего блока"
 aof_v03_regions.21.c: "Сохранить мандат"
 aof_v03_regions.30.t: "Устройство Карелии"
 aof_v03_regions.30.d: "Представительство местных общин или пограничная администрация? Новые войны не предрешены."
 aof_v03_regions.30.a: "Представительство общин"
 aof_v03_regions.30.b: "Пограничная администрация"
 aof_v03_regions.31.t: "Собственная опора"
 aof_v03_regions.31.d: "Японский ответ не отменяет необходимости обучать собственные кадры."
 aof_v03_regions.31.a: "Местные кадры"
 aof_v03_regions.31.b: "Внешняя опора"
 aof_v03_regions.32.t: "Полномочия Туркестана"
 aof_v03_regions.32.d: "Выбор между местным управлением и единой исполнительной властью."
 aof_v03_regions.32.a: "Договор участников"
 aof_v03_regions.32.b: "Единая исполнительная власть"
 aof_v03_regions.33.t: "Сохранить союз"
 aof_v03_regions.33.d: "Съезд может сохранить союз или открыть подтверждение согласованного мирного раздела. Перед изменением территории будут показаны точные условия и проверены права участников."
 aof_v03_regions.33.a: "Подтвердить союз"
 aof_v03_regions.33.b: "Открыть переговоры о разделе"
 aof_v03_regions.34.t: "Военное управление"
 aof_v03_regions.34.d: "Снабжение фронта не решает, кто будет править после войны."
 aof_v03_regions.34.a: "Гражданский кабинет"
 aof_v03_regions.34.b: "Чрезвычайное командование"
 aof_v03_regions.35.t: "Канадские обязательства"
 aof_v03_regions.35.d: "Если страна зависима, пересмотр полномочий требует ответа покровителя; независимая страна пересматривает свои обязательства сама."
 aof_v03_regions.35.a: "Пересмотреть обязательства"
 aof_v03_regions.36.t: "Направление канадской торговли"
 aof_v03_regions.36.d: "Океанские связи или североамериканский рынок?"
 aof_v03_regions.36.a: "Океанские связи"
 aof_v03_regions.36.b: "Североамериканский рынок"
 aof_v03_regions.37.t: "Федеративный договор"
 aof_v03_regions.37.d: "После транзитного и оборонного сотрудничества можно сохранить союз суверенных участников или предложить территориальную федерацию Гватемале, Гондурасу, Сальвадору, Никарагуа и Коста-Рике. Каждая страна решает сама. Согласившийся участник передаёт свои территории общему правительству; отказ не приводит к войне."
 aof_v03_regions.37.a: "Предложить добровольную территориальную федерацию"
 aof_v03_regions.37.b: "Сохранить союз суверенных участников"
 aof_v03_regions.40.t: "Вступить в Центральноамериканскую федерацию?"
 aof_v03_regions.40.d: "Прежний партнёр предлагает объединение территорий. Принятие упраздняет отдельное правительство: все наши собственные земли, включая внешние владения, и войска перейдут общему государству. Национальные права возникают только на нашей прежней национальной территории. Игрок, желающий продолжать отдельную кампанию, должен отказаться. Согласие возможно только для мирной независимой страны после принятого двустороннего сотрудничества."
 aof_v03_regions.40.a: "Принять: передать территории общему государству"
 aof_v03_regions.40.b: "Сохранить независимость и прежнее сотрудничество"
 aof_central_american_federation_democratic: "Центральноамериканская Федерация"
 aof_central_american_federation_democratic_DEF: "Центральноамериканская Федерация"
